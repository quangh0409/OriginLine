name: "Chuẩn bị phụ thuộc frontend"
description: >-
  Cài Node 20 và khôi phục node_modules của frontend/ theo package-lock.json.
  Dùng chung cho cổng 2 (kiểm tĩnh), cổng 3 (next build) và cổng 4 (E2E) để ba
  cổng không lệch nhau về phiên bản phụ thuộc.

runs:
  using: composite
  steps:
    - name: "Cài Node 20 + cache ~/.npm"
      uses: actions/setup-node@v4
      with:
        node-version: "20"
        cache: npm
        cache-dependency-path: frontend/package-lock.json

    # Cache hai tầng là cố ý: ~/.npm (ở trên) cứu lượt npm ci khi lockfile đổi,
    # còn node_modules (ở dưới) bỏ hẳn npm ci khi lockfile không đổi. Chỉ có
    # tầng trên thì mỗi job vẫn mất vài phút giải nén lại cây phụ thuộc.
    - name: "Khôi phục cache node_modules"
      id: cache-node-modules
      uses: actions/cache@v4
      with:
        path: frontend/node_modules
        key: node-modules-${{ runner.os }}-node20-${{ hashFiles('frontend/package-lock.json') }}

    - name: "npm ci (chỉ chạy khi cache node_modules trượt)"
      if: steps.cache-node-modules.outputs.cache-hit != 'true'
      shell: bash
      working-directory: frontend
      run: npm ci
