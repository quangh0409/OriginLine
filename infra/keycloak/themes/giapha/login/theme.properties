# ─────────────────────────────────────────────────────────────────────────────
# Theme đăng nhập của dòng họ.
#
# parent=base, KHÔNG phải parent=keycloak: theme `keycloak` kéo theo PatternFly
# và bộ CSS của Red Hat, và mọi dòng CSS của ta sau đó là một cuộc cãi nhau với
# nó về cỡ chữ và chiều cao nút — đúng hai thứ mà 00 §2.2 đặt làm sàn không
# thương lượng. `base` chỉ cho khung FreeMarker và không cho một điểm ảnh CSS
# nào, nên mọi con số trên màn hình là số ta viết ra.
#
# Cái giá: ta phải tự dựng MỌI trang Keycloak mà luồng này có thể đi qua. Trang
# nào chưa dựng sẽ rơi về khuôn của `base` — HTML trần, không CSS. Xem
# README.md mục Keycloak để biết danh sách đã dựng.
# ─────────────────────────────────────────────────────────────────────────────
parent=base

# Chỉ hai ngôn ngữ. Song ngữ KHÔNG đối xứng (00 §2.6): tiếng Việt là gốc, tiếng
# Anh phục vụ kiều bào — và bản tiếng Anh GIỮ NGUYÊN thuật ngữ dòng họ.
locales=vi,en

# Ngôn ngữ gốc — đứng TRƯỚC trong công tắc ngôn ngữ ở thanh đầu trang.
# Phải trùng `defaultLocale` của realm. Hai chỗ vì theme KHÔNG đọc được
# `realm.defaultLocale` (RealmBean không phơi thuộc tính ấy — đã thử).
giaphaPrimaryLocale=vi

styles=css/fonts.css css/giapha.css

# ═════════════════════════════════════════════════════════════════════════════
# CẤU HÌNH THEO TỪNG DÒNG HỌ
#
# Đây là chỗ duy nhất đặt được chuỗi riêng của một dòng họ mà không phải viết
# một Keycloak SPI. Mọi khoá dưới đây MẶC ĐỊNH RỖNG, và rỗng nghĩa là khối
# tương ứng KHÔNG IN RA — chứ không phải in ra một chỗ trống hay một số bịa.
# Định hướng 00 §5: "Không bịa số."
# ═════════════════════════════════════════════════════════════════════════════

# Dòng 2 của bảng tên — chỗ đứng trong đời thật.
# Ví dụ: giaphaClanSubtitle=Từ đường Đại Lan · Thanh Trì · Hà Nội
giaphaClanSubtitle=

# Dòng 3 của bảng tên — quy mô. CHỈ điền khi có số THẬT, đếm được, mà người
# trong họ tự kiểm chứng được. 06 §2.2: "Bịa số là cách nhanh nhất để mất lòng
# tin của đúng nhóm người biết rõ họ mình có bao nhiêu người."
# Ví dụ: giaphaClanScale=14 đời · 1.500 người có tên trong phả
giaphaClanScale=

# Người thật để gọi khi tắc. 06 §2.3 điểm 3: mọi ngõ cụt phải có TÊN và SỐ MÁY
# của một con người, không phải một hộp thư hỗ trợ. Để rỗng thì trang in một câu
# chung chung và không in số nào.
# Ví dụ: giaphaHelpName=Ông Nguyễn Văn Bốn · Trưởng chi Giáp
#        giaphaHelpPhone=0903111222
giaphaHelpName=
giaphaHelpPhone=

# ── Lối vào chế độ khách ─────────────────────────────────────────────────────
# Nút "Xem phần công khai của dòng họ" dẫn thẳng vào PHẢ ĐỒ, không dẫn về trang
# chủ. Trang chủ chỉ là một trang giới thiệu; nó trả lời lời hứa "xem phần công
# khai" bằng một nửa. `/tree` mở ra cây thật từ Thuỷ tổ ngay, không cần tham số
# (đã kiểm: `GET /api/v1/public/tree` không tham số trả 200).
#
# `{lang}` được thay bằng ngôn ngữ người dùng đang chọn TRÊN CHÍNH TRANG NÀY.
# Ai vừa bấm "English" mà bị ném sang bản tiếng Việt là mất luôn lựa chọn họ vừa
# làm, ngay ở thao tác kế tiếp.
giaphaGuestPath={lang}/tree

# Ghi đè TUYỆT ĐỐI cho đường dẫn trên. Để rỗng thì ghép `client.baseUrl` với
# `giaphaGuestPath` — tức quay về đúng ứng dụng vừa đẩy người dùng sang đây.
# Chỉ điền khi cổng công khai nằm ở một tên miền khác.
giaphaGuestUrl=

# Tuyến "Tôi có mã mời" (06 §5, cửa 1). Tuyến `/moi/[token]` CHƯA TỒN TẠI trong
# `frontend/src/app/[locale]/`, nên để rỗng và nút không in ra. Một nút dẫn tới
# 404 tệ hơn là không có nút.
giaphaInviteUrl=

# ── ĐƯỜNG KHÂU BÀN GIAO: MÀN ĐĂNG KÝ SẼ CHUYỂN CHỦ ───────────────────────────
#
# Rỗng  → liên kết "Tôi có mã mời của dòng họ" dẫn tới TRANG ĐĂNG KÝ CỦA KEYCLOAK
#         (`register.ftl`), nơi mã được so với một MẪU trong User Profile.
# Có    → liên kết dẫn tới địa chỉ này, và khi ấy PHẢI đặt luôn
#         `"registrationAllowed": false` trong realm-giapha.json.
#
# VÌ SAO CÓ KHOÁ NÀY, nói thẳng: máy chủ ĐÃ CÓ đường đăng ký thật —
# `POST /api/v1/clan-invites/register` (`ClanInviteController`), và nó giữ đủ bốn
# chốt chặn của checklist §1.2: mã lưu dạng băm, có hạn, thu hồi được, có bộ đếm,
# có giới hạn tần suất theo địa chỉ IP. Trang đăng ký của Keycloak chỉ so được mã
# với một mẫu.
#
# NGÀY 21-09-2026: MÀN ẤY ĐÃ CÓ, VÀ BA VIỆC ĐÃ LÀM CÙNG LÚC.
#   1. khoá này trỏ sang `/dang-ky` của ứng dụng (`RegisterScreen`, gọi
#      `POST /clan-invites/lookup` rồi mới `POST /clan-invites/register`);
#   2. `registrationAllowed` trong realm-giapha.json đặt về `false`;
#   3. `phat-ma-moi.mjs --thu-hoi` đóng mẫu mã phía Keycloak.
# Làm lẻ một trong ba là để hở: bỏ (2) thì cửa cũ vẫn mở; bỏ (3) thì mẫu mã cũ
# còn sống trong User Profile của realm ĐANG CHẠY (realm file chỉ là bản nhập
# lần đầu); bỏ (1) trước khi có màn thì khoá luôn mọi người ở ngoài.
#
# ⚠️ CHI PHÍ CỦA VIỆC ĐỂ HAI CỬA CÙNG MỞ — giữ lại để người sau không mở lại:
# tài khoản tạo qua trang Keycloak KHÔNG đi qua `ClanInviteRedeemer`, nên nó
# KHÔNG vào sổ lượt dùng của máy chủ. Bộ đếm của Hội đồng ở màn `/quan-ly/phat-ma`
# sẽ đếm THIẾU, và đếm thiếu thì đúng cái chốt chặn quan trọng nhất của §1.2
# ("không có bộ đếm thì không ai phát hiện được gì") mất tác dụng trong im lặng.
# Từ nay chỉ còn MỘT cửa, nên `/quan-ly/phat-ma` là con số đầy đủ; không phải
# cộng tay với `phat-ma-moi.mjs --dem` nữa.
#
# GIÁ TRỊ PHẢI TUYỆT ĐỐI, và đó là một ràng buộc của `login.ftl` chứ không phải
# một lựa chọn: khác `giaphaGuestPath`, khoá này được đặt THẲNG vào `href` mà
# không ghép với `client.baseUrl`. Một đường dẫn tương đối sẽ phân giải theo tên
# miền của KEYCLOAK (cổng 8081), tức dẫn tới 404 của Keycloak.
# Địa chỉ dưới đây lấy từ `rootUrl` của client `giapha-frontend` trong chính
# realm-giapha.json — hai chỗ phải khớp nhau; đổi một thì đổi cả hai.
#
# HẠN ĐÃ BIẾT: `{lang}` KHÔNG được thay ở khoá này (login.ftl chỉ thay cho
# `giaphaGuestPath`), nên người vừa bấm "English" trên trang đăng nhập vẫn rơi
# vào bản tiếng Việt của `/dang-ky` — rồi đổi lại bằng công tắc ngôn ngữ trong
# ứng dụng. Sửa cho đúng đòi một dòng `?replace("{lang}", lang)` trong
# `login.ftl`, thuộc mạch việc của theme.
giaphaRegisterUrl=http://localhost:3000/{lang}/dang-ky

# Có in khối "khách xem được gì" đầy đủ (06 §8) hay không.
#
# ĐANG LÀ true, và đây là một sự thật ĐÃ ĐO về backend chứ không phải một hy
# vọng. Cổng công khai có thật, ở `genealogy/api/rest/public_/`, và trả dữ liệu
# thật cho người KHÔNG có token (đo 19-09-2026 trên backend cổng 8088):
#
#   GET /api/v1/public/tree                          -> 200, 66 node ở depth 2
#   GET /api/v1/public/persons/search?q=Nguyễn       -> 200, 20 kết quả
#   GET /api/v1/public/persons/{id}                  -> 200, đủ lớp tên + giỗ âm
#
# Bản nháp đầu của theme này ĐẶT NHẦM cờ thành false vì tôi thử sai hai lối:
# `/api/v1/persons` và `/api/v1/tree` — hai lối ấy trả 401 cho khách, và đó là
# ĐÚNG THIẾT KẾ, vì chúng là bề mặt của THÀNH VIÊN. Cổng công khai là một bề mặt
# khác, có `PublicGuestScope`, `PublicVisibilityGuard` và `PublicRateLimitFilter`
# riêng. Ghi lại cái sai này để người sau đừng lặp lại: 401 ở một tuyến không
# nói gì về tuyến khác.
#
# Danh sách in ra phải khớp thứ API THẬT SỰ trả. Mỗi mục trong
# `giaphaGuestCan*` đều đã đối chiếu với một lượt gọi thật — xem messages/.
# Đặt lại thành false nếu một dòng họ chọn đóng cổng công khai; câu về Nghị định
# 13/2023 thì LUÔN in, vì nó đúng bất kể cấu hình.
giaphaPublicBrowsingReady=true
