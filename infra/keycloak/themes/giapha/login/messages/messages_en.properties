updateProfileMessage=Please fill in a few details that are still missing.

# ── Shown when the link in the email is opened in a DIFFERENT browser ────────
# Common and tested: register on a phone, open the mail on a laptop. With no
# session to resume, Keycloak inserts a confirmation step first.
#
# `emailSentMessage` is NOT `emailSuccessMessage`. The key printed after "Send
# reset instructions" is this one; the first draft overrode the other one and
# the screen silently kept Keycloak''s own sentence.
confirmEmailAddressVerificationHeader=Confirm your email address
confirmEmailAddressVerification=Is this really your email address: {0}?
emailSentMessage=Sent. If the number or address you entered is in the system, instructions will arrive there within a few minutes. Check your spam folder too.
