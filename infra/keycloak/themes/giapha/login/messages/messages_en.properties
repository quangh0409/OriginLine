# encoding: UTF-8
# =============================================================================
# ENGLISH — theme `giapha`
#
# The `# encoding: UTF-8` first line is required even here: the file carries
# Vietnamese clan terms with diacritics (chi, Trưởng chi, danh xưng, Thuỷ tổ).
#
# -----------------------------------------------------------------------------
# ASYMMETRIC BILINGUALISM (design doc 00 §2.6)
#
# Vietnamese is the source language. English serves relatives abroad who do not
# read Vietnamese fluently — it is NOT a mechanical translation.
#
# Clan terms stay in Vietnamese with a short gloss on first appearance:
#   Trưởng chi  → "Trưởng chi (the head of your branch)"
#   chi         → "chi (branch)"
#   danh xưng   → "danh xưng (the correct term of address)"
#   Thuỷ tổ     → "Thuỷ tổ (the founding ancestor)"
#   giỗ         → "giỗ (death anniversary)"
#   Hội đồng Tộc biểu → "Hội đồng Tộc biểu (the clan council)"
#
# A Vietnamese-American needs to learn WHO a "chú" is; an "uncle" that erases
# the chú/bác/cậu distinction teaches them nothing and loses the data.
# =============================================================================

