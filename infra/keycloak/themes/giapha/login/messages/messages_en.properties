# NOTE: the doubled apostrophe in "ancestor''s" is NOT a typo. Keycloak runs
# every theme message through java.text.MessageFormat, where a lone ' is an
# escape character and is silently swallowed — the first draft rendered "Each
# ancestors record". Double every apostrophe in this file.
giaphaGuestCan2=Each ancestor''s record: tên huý, tên tự, tên thụy (their several traditional names), đời (generation), chi (branch), and home village
giaphaGuestCan3=Their ngày giỗ (death anniversary), in both the lunar and the solar calendar
