doSendResetInstructions=Gửi hướng dẫn đặt lại
# Câu này CỐ Ý trung tính: nó phải giống hệt nhau dù tài khoản có tồn tại hay
# không (danh mục kiểm 06 §11 #7). Cái giá — sự mơ hồ mà 00 §1 nói người lớn
