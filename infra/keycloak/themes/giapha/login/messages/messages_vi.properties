backToLogin=Quay lại đăng nhập
rememberMe=Ghi nhớ đăng nhập trên máy này

# ── Câu lỗi ──────────────────────────────────────────────────────────────────
# 06 §7.2: không đổ lỗi ("Bạn đã nhập sai" → "chưa đúng"), không in mã lỗi,
# không để câu lỗi tiết lộ dữ liệu bị ẩn.
#
# `accountTemporarilyDisabledMessage` CỐ Ý trùng `invalidUserMessage`, y như bản
# gốc của Keycloak. Tách ra thành hai câu khác nhau là biến trang này thành công
# cụ dò xem số điện thoại nào là người trong họ. Người bị khoá tạm vẫn được giải
# thích, nhưng bằng khối hổ phách in cho MỌI ca lỗi — xem `giaphaLockoutNote`.
invalidUserMessage=Số hoặc mật khẩu chưa đúng
accountTemporarilyDisabledMessage=Số hoặc mật khẩu chưa đúng
missingUsernameMessage=Xin ông/bà nhập số điện thoại hoặc email.
missingPasswordMessage=Xin ông/bà nhập mật khẩu.
missingTotpMessage=Xin ông/bà nhập mã xác thực.
invalidTotpMessage=Mã xác thực chưa đúng.
accountDisabledMessage=Tài khoản này đang tạm khoá. Xin hỏi Trưởng chi hoặc Hội đồng Tộc biểu của ông/bà.
expiredCodeMessage=Đường dẫn đã hết hạn. Xin ông/bà đăng nhập lại.
expiredActionMessage=Đường dẫn đã hết hạn. Xin ông/bà đăng nhập lại.
errorTitle=Việc này chưa xong
errorTitleHtml=Việc này chưa xong
internalServerError=Hệ thống đang trục trặc. Xin ông/bà thử lại sau ít phút.

