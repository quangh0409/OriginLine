# ── Màn xác nhận khi liên kết trong thư mở ở MỘT TRÌNH DUYỆT KHÁC ────────────
# Ca này rất hay xảy ra và ta đã dựng thử: người dùng đăng ký trên điện thoại
# rồi mở thư trên máy tính — không còn phiên nào, nên Keycloak chèn một màn
# "bấm để xác nhận" trước khi làm gì. Bản gốc tiếng Việt của Keycloak ở đây là
# "Xác thực địa chỉ email" / "Xác nhận tính hợp lệ của địa chỉ email {0}." —
# dịch máy, và "tính hợp lệ" là từ của biểu mẫu hành chính.
#
# `emailSentMessage` KHÁC `emailSuccessMessage`: khoá được in sau khi bấm "Gửi
# hướng dẫn đặt lại" là khoá NÀY. Đã gửi thử và bắt được thư để biết chắc —
# bản đầu chỉ ghi đè `emailSuccessMessage` nên màn hình vẫn in câu gốc của
# Keycloak, và không có gì báo là ta đã ghi đè hụt.
confirmEmailAddressVerificationHeader=Xác nhận địa chỉ thư
confirmEmailAddressVerification=Đây có đúng là địa chỉ thư của ông/bà không: {0}?
emailSentMessage=Đã gửi. Nếu số hoặc email ông/bà vừa nhập có trong hệ thống, hướng dẫn đặt lại sẽ tới đó trong ít phút. Nhớ xem cả mục thư rác.
