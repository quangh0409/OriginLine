# nhiều cụ không có email, và cụ nào có thì thường là hộp thư do đứa cháu lập hộ.
usernameOrEmail=Số điện thoại hoặc email
username=Số điện thoại hoặc email
password=Mật khẩu
doLogIn=Đăng nhập
doForgotPassword=Quên mật khẩu?
doCancel=Thôi, quay lại
doSubmit=Gửi
doTryAgain=Thử lại
