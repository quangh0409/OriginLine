# ── Khối "khách xem được gì" (06 §8) ─────────────────────────────────────────
# MỖI DÒNG `giaphaGuestCan*` ĐÃ ĐỐI CHIẾU VỚI MỘT LƯỢT GỌI THẬT (19-09-2026):
#   Can1 ← GET /api/v1/public/tree            (66 node ở depth 2, 0 người sống)
#   Can2 ← GET /api/v1/public/persons/{id}    (names[] HUY/TU/THUY, generation,
#                                              primaryBranch, nativePlace)
#   Can3 ← cùng lời gọi trên: death.solar VÀ death.lunar
#   Can4 ← GET /api/v1/public/persons/search  (q=Nguyễn và q=Nguyen cho CÙNG
#                                              20 kết quả — FTS + unaccent)
# Thêm mục thứ năm thì gọi thử trước rồi mới viết. Đây là màn hình đầu tiên;
# một lời hứa sai ở đây tiêu mất lòng tin trước khi sản phẩm kịp chứng minh gì.
#
# CỐ Ý KHÔNG có mục "lịch giỗ chung của dòng họ" như khung dây §4.2 vẽ: không có
# endpoint công khai nào liệt kê sự kiện. Ngày giỗ chỉ xem được trên hồ sơ từng
# cụ, và Can3 nói đúng chừng ấy.
giaphaGuestTitle=Chưa đăng nhập thì xem được gì?
giaphaGuestCanTitle=Xem được, không cần tài khoản
giaphaGuestCan1=Phả đồ từ Thuỷ tổ xuống, theo đường các cụ đã khuất
giaphaGuestCan2=Hồ sơ từng cụ: tên huý, tên tự, tên thụy, đời, chi, quê quán
giaphaGuestCan3=Ngày giỗ của các cụ, cả ngày âm lẫn ngày dương
giaphaGuestCan4=Tìm theo tên — gõ có dấu hay không dấu đều ra
giaphaGuestCannotTitle=Phải là người trong họ, đã đăng nhập, mới xem được
giaphaGuestCannot1=Người đang sống — kể cả tên
giaphaGuestCannot2=Tra danh xưng cho người đang sống
giaphaGuestCannot3=Xin đính chính · Nhận nhắc ngày giỗ
giaphaGuestLaw=Đây không phải thiết lập của riêng ông/bà: người đang sống ẩn mặc định với mọi khách, và đó là quy định của pháp luật (Nghị định 13/2023), không phải lựa chọn của dòng họ.

