# ── Ngõ cụt do cookie ────────────────────────────────────────────────────────
# Bản gốc: "Không tìm thấy cookie khởi động lại đăng nhập. Cookie có thể đã hết
# hạn... Nhấp Quay lại Ứng dụng để đăng nhập lại." — ba câu kỹ thuật, và câu
# cuối dặn bấm một nút TÊN KHÁC với nút thật trên màn (ta đã đổi nhãn nút thành
# "Quay về trang dòng họ"). Câu chỉ đường mà chỉ sai chỗ thì tệ hơn không chỉ.
cookieNotFoundMessage=Trình duyệt của ông/bà đang chặn cookie, nên lượt đăng nhập này không giữ lại được. Xin bật cookie lên rồi bấm nút bên dưới để làm lại.
# Không dùng guillemet «» của bản gốc: nó là dấu của tiếng Pháp, không phải
# tiếng Việt, và trình đọc màn hình đọc thành "dấu ngoặc kép góc".
