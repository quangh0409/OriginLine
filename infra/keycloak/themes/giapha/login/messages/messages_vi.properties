# encoding: UTF-8
# =============================================================================
# BẢN TIẾNG VIỆT — theme `giapha`
#
# Dòng đầu tệp KHÔNG phải chú thích trang trí: `java.util.Properties` đọc mặc
# định bằng ISO-8859-1, và Keycloak chỉ chuyển sang UTF-8 khi thấy đúng dòng
# `# encoding: UTF-8` này. Xoá nó đi thì mọi dấu tiếng Việt thành ký tự rác, và
# trang vẫn chạy nên không ai biết cho tới khi có người nhìn.
#
# -----------------------------------------------------------------------------
# VÌ SAO PHẢI GHI ĐÈ, chứ không dùng bản dịch sẵn của Keycloak
#
# Bản tiếng Việt kèm Keycloak 26.7 nói tiếng của PHẦN MỀM, đúng thứ 00 §2.5 cấm:
#   username           = "Tên người dùng"        → hỏi một câu người dùng không
#                                                   có dữ kiện để trả lời
#   usernameOrEmail    = "Tên người dùng hoặc email"
#   rememberMe         = "Ghi nhớ tôi"            → dịch máy, không phải tiếng Việt
#   errorTitle         = "Chúng tôi xin lỗi..."   → xin lỗi thay cho việc chỉ đường
#   doClickHere        = "Nhấp vào đây"
#   invalidUserMessage = "Tên người dùng hoặc mật khẩu không hợp lệ."
#                                                 → "không hợp lệ" là từ của biểu
#                                                   mẫu hành chính, và nó đổ lỗi
#   accountDisabledMessage = "... vui lòng liên hệ quản trị viên."
#                                                 → "quản trị viên" là một ngõ cụt;
#                                                   06 §2.3 đòi một con người có tên
#
# Mọi khoá dưới đây đều là chuỗi NGƯỜI DÙNG THẬT SỰ ĐỌC. Khoá nào không ai đọc
# thì không ghi đè — để bản gốc, đỡ một chỗ phải bảo trì.
# =============================================================================

# ── Nhãn ngôn ngữ (06 §10: viết CHỮ, không vẽ cờ) ────────────────────────────
locale_vi=Tiếng Việt
locale_en=English

