# ── "Sau khi đăng ký thì chuyện gì xảy ra" ───────────────────────────────────
# Ba bước này là luồng đã chốt ở checklist §1.1. Nói TRƯỚC, vì bước 2 và 3 là
# thứ quyết định người mới hiểu vì sao mình chưa sửa được hồ sơ của chính mình.
giaphaAfterRegisterTitle=Đăng ký xong thì sao?
giaphaAfterRegister1=Dòng họ gửi một lá thư tới địa chỉ ông/bà vừa khai. Mở thư, bấm liên kết trong đó, rồi đặt mật khẩu. Mật khẩu đặt SAU, không đặt ở màn này.
giaphaAfterRegister2=Xong là xem được phả đồ ngay, không phải chờ ai duyệt. Tìm chính mình trên phả đồ và nhận: "đây là tôi". Chưa thấy mình trong phả thì có lối riêng để báo.
giaphaAfterRegister3=Trưởng chi đối chiếu rồi duyệt. Duyệt xong ông/bà mới sửa được hồ sơ của mình và xin đính chính.
giaphaAfterRegisterPrivacy=Trong lúc chờ duyệt, ông/bà xem được người trong họ nhưng chưa sửa được gì. Thông tin của người đang sống vẫn ẩn theo đúng Nghị định 13/2023 — đăng ký không mở thêm thứ gì ngoài phần dành cho người trong họ.

