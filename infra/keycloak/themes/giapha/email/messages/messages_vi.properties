# encoding: UTF-8
# =============================================================================
# THƯ GỬI ĐI — BẢN TIẾNG VIỆT
#
# Dòng đầu tệp KHÔNG phải chú thích trang trí, y như bên theme đăng nhập:
# `java.util.Properties` đọc mặc định bằng ISO-8859-1 và Keycloak chỉ chuyển
# sang UTF-8 khi thấy đúng dòng `# encoding: UTF-8`. Xoá nó đi thì lá thư vẫn
# gửi được, chỉ là dấu tiếng Việt thành ký tự rác trong hộp thư người nhận —
# tức hỏng ở chỗ ta không nhìn thấy.
#
# -----------------------------------------------------------------------------
# DẤU NHÁY ĐƠN PHẢI NHÂN ĐÔI
#
# Keycloak chạy mọi chuỗi này qua `java.text.MessageFormat`, nơi một dấu `'`
# đứng một mình là KÝ TỰ THOÁT và bị nuốt im lặng — cùng cái bẫy đã ghi ở
# `login/messages/messages_en.properties`. Tiếng Việt hiếm dùng nháy đơn nên
# chỗ này ít rủi ro, nhưng luật vẫn là luật.
#
# -----------------------------------------------------------------------------
# THAM SỐ CỦA KEYCLOAK, theo đúng thứ tự nó truyền vào
#
#   {0}  đường dẫn để bấm
#   {1}  tên tài khoản / realm (tuỳ khuôn — KHÔNG dùng, vì không chắc)
#   {2}  tên dòng họ, lấy từ `realm.displayName`
#   {3}  thời hạn của liên kết, đã được định dạng sẵn ("30 phút")
#
# -----------------------------------------------------------------------------
# VÌ SAO PHẢI VIẾT LẠI
#
# Bản gốc của Keycloak: "Ai đó vừa yêu cầu thay đổi thông tin đăng nhập tài
# khoản {2} của bạn." Câu ấy có hai vấn đề với người đọc của sản phẩm này:
#
#   · "Ai đó" nghe như một cảnh báo an ninh. Với cụ bảy mươi tuổi vừa tự bấm
#     "Quên mật khẩu?" ba mươi giây trước, câu ấy làm cụ sợ và không bấm nữa.
#   · Không có một chữ nào nói lá thư này đến từ DÒNG HỌ. Một thư lạ, viết
#     chung chung, kèm một đường dẫn — đó đúng là hình dạng của thư lừa đảo mà
#     người lớn tuổi được dặn phải xoá (06 §5.1).
#
# Nên mọi thư dưới đây mở đầu bằng TÊN DÒNG HỌ, nói rõ việc gì đang xảy ra và
# vì sao người nhận lại nhận được nó, rồi mới tới đường dẫn.
# =============================================================================

# ── Đặt lại mật khẩu ─────────────────────────────────────────────────────────
passwordResetSubject=Đặt lại mật khẩu cho trang gia phả dòng họ
passwordResetBody=Kính gửi ông/bà,\n\nCó người vừa xin đặt lại mật khẩu cho tài khoản của ông/bà ở trang gia phả {2}. Nếu đúng là ông/bà, xin mở đường dẫn dưới đây để đặt mật khẩu mới:\n\n{0}\n\nĐường dẫn này dùng được trong {3}, sau đó hết hiệu lực và phải xin lại từ đầu.\n\nNếu không phải ông/bà xin đặt lại, xin cứ bỏ qua thư này — mật khẩu cũ vẫn nguyên và không có gì thay đổi. Nếu thấy lạ, xin gọi Trưởng chi của mình.\n\nThư này gửi tự động từ trang gia phả {2}. Xin đừng trả lời thư.
passwordResetBodyHtml=<p>Kính gửi ông/bà,</p><p>Có người vừa xin đặt lại mật khẩu cho tài khoản của ông/bà ở trang gia phả <b>{2}</b>. Nếu đúng là ông/bà, xin bấm vào đây để đặt mật khẩu mới:</p><p><a href="{0}">Đặt mật khẩu mới</a></p><p>Đường dẫn này dùng được trong {3}, sau đó hết hiệu lực và phải xin lại từ đầu.</p><p>Nếu không phải ông/bà xin đặt lại, xin cứ bỏ qua thư này — mật khẩu cũ vẫn nguyên và không có gì thay đổi. Nếu thấy lạ, xin gọi Trưởng chi của mình.</p><p>Thư này gửi tự động từ trang gia phả {2}. Xin đừng trả lời thư.</p>

# ── Xác minh địa chỉ thư (người tự đăng ký bằng mã mời dòng họ) ──────────────
# Nói rõ "vừa đăng ký bằng mã mời của dòng họ" chứ không "ai đó đã tạo tài
# khoản": người nhận cần nhận ra VIỆC MÌNH VỪA LÀM trong câu đầu tiên.
emailVerificationSubject=Xin xác nhận địa chỉ thư — trang gia phả dòng họ
emailVerificationBody=Kính gửi ông/bà,\n\nCó người vừa đăng ký vào trang gia phả {2} bằng mã mời của dòng họ, và khai địa chỉ thư này. Nếu đúng là ông/bà, xin mở đường dẫn dưới đây để xác nhận:\n\n{0}\n\nĐường dẫn này dùng được trong {3}.\n\nXác nhận xong, ông/bà xem được phả đồ ngay. Muốn sửa hồ sơ của chính mình thì còn một bước nữa: tự nhận mình trên phả đồ và chờ Trưởng chi duyệt.\n\nNếu không phải ông/bà đăng ký, xin cứ bỏ qua thư này — không có tài khoản nào dùng được cho tới khi có người bấm đường dẫn trên.\n\nThư này gửi tự động từ trang gia phả {2}. Xin đừng trả lời thư.
emailVerificationBodyHtml=<p>Kính gửi ông/bà,</p><p>Có người vừa đăng ký vào trang gia phả <b>{2}</b> bằng mã mời của dòng họ, và khai địa chỉ thư này. Nếu đúng là ông/bà, xin bấm vào đây để xác nhận:</p><p><a href="{0}">Xác nhận địa chỉ thư của tôi</a></p><p>Đường dẫn này dùng được trong {3}.</p><p>Xác nhận xong, ông/bà xem được phả đồ ngay. Muốn sửa hồ sơ của chính mình thì còn một bước nữa: tự nhận mình trên phả đồ và chờ Trưởng chi duyệt.</p><p>Nếu không phải ông/bà đăng ký, xin cứ bỏ qua thư này — không có tài khoản nào dùng được cho tới khi có người bấm đường dẫn trên.</p><p>Thư này gửi tự động từ trang gia phả {2}. Xin đừng trả lời thư.</p>

# ── Hành động bắt buộc (Trưởng chi cấp mật khẩu tạm, bắt đổi ngay) ───────────
executeActionsSubject=Một việc cần làm cho tài khoản của ông/bà
executeActionsBody=Kính gửi ông/bà,\n\nTrang gia phả {2} cần ông/bà làm một việc cho tài khoản của mình. Xin mở đường dẫn dưới đây:\n\n{0}\n\nĐường dẫn này dùng được trong {3}.\n\nNếu ông/bà không hiểu vì sao nhận được thư này, xin gọi Trưởng chi của mình trước khi bấm vào đâu.\n\nThư này gửi tự động từ trang gia phả {2}. Xin đừng trả lời thư.
executeActionsBodyHtml=<p>Kính gửi ông/bà,</p><p>Trang gia phả <b>{2}</b> cần ông/bà làm một việc cho tài khoản của mình. Xin bấm vào đây:</p><p><a href="{0}">Mở trang của tôi</a></p><p>Đường dẫn này dùng được trong {3}.</p><p>Nếu ông/bà không hiểu vì sao nhận được thư này, xin gọi Trưởng chi của mình trước khi bấm vào đâu.</p><p>Thư này gửi tự động từ trang gia phả {2}. Xin đừng trả lời thư.</p>

# ── Thư thử của nút "Test connection" trong admin console ────────────────────
# Bản gốc: "[KEYCLOAK] - SMTP test message". Người bấm nút ấy là người quản trị
# của dòng họ, không phải người vận hành Keycloak — và tên sản phẩm trong tiêu
# đề thư nên là tên họ nhận ra.
emailTestSubject=Thư thử cấu hình máy chủ thư
emailTestBody=Thư này chứng minh máy chủ thư của trang gia phả {2} đang gửi được. Không có việc gì phải làm.
emailTestBodyHtml=<p>Thư này chứng minh máy chủ thư của trang gia phả <b>{2}</b> đang gửi được. Không có việc gì phải làm.</p>

# ── Đơn vị thời gian in trong "{3}" ──────────────────────────────────────────
# Tiếng Việt không chia số nhiều, nên cả bốn khoá đều là một từ. Bản gốc dùng
# cú pháp `{0,choice,...}` để chọn "minute"/"minutes"; giữ nguyên cú pháp ấy mà
# đổi chữ sẽ ra "30 phút|phút" nếu viết sai một dấu gạch đứng — nên viết thẳng.
linkExpirationFormatter.timePeriodUnit.seconds=giây
linkExpirationFormatter.timePeriodUnit.minutes=phút
linkExpirationFormatter.timePeriodUnit.hours=giờ
linkExpirationFormatter.timePeriodUnit.days=ngày

# ── TIÊU ĐỀ THƯ KHÔNG NHẬN THAM SỐ ───────────────────────────────────────────
# Bản đầu viết `emailVerificationSubject=Xin xác nhận địa chỉ thư — {2}` cho
# giống phần thân. Thư gửi đi có tiêu đề nguyên văn "… — {2}" — đã bắt được
# trong Mailpit.
#
# Lý do: Keycloak định dạng TIÊU ĐỀ bằng một danh sách tham số RỖNG
# (`send(subjectKey, emptyList, template, attributes)`), còn THÂN thư mới nhận
# đủ {0}..{3}. Nên tiêu đề không có cách nào biết tên dòng họ.
#
# Hệ quả: tiêu đề phải đứng vững một mình. Dòng họ nào muốn tên mình trong tiêu
# đề thì sửa thẳng bốn dòng dưới đây — theme vốn đã là bản triển khai riêng của
# một dòng họ (xem `login/theme.properties`).
