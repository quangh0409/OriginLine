# encoding: UTF-8
# =============================================================================
# OUTGOING EMAIL — ENGLISH
#
# The `# encoding: UTF-8` first line is required here too: these strings carry
# Vietnamese clan terms with diacritics (phả, Trưởng chi, phả đồ).
#
# DOUBLE EVERY APOSTROPHE. Keycloak runs each of these through MessageFormat,
# where a lone ' is an escape character and is silently swallowed: "don''t",
# "clan''s". This file has several, and every one of them is doubled on purpose.
#
# Keycloak parameters, in the order it passes them:
#   {0} the link · {2} the clan name (realm displayName) · {3} how long the
#   link lasts, already formatted
#
# Asymmetric bilingualism (00 §2.6): clan terms stay in Vietnamese with a short
# gloss. A relative abroad needs to learn what a Trưởng chi is; "branch manager"
# teaches them nothing.
# =============================================================================

passwordResetSubject=Reset your password for the family genealogy site
passwordResetBody=Dear relative,\n\nSomeone has asked to reset the password on your account at the {2} family genealogy site. If that was you, open the link below to set a new one:\n\n{0}\n\nThe link works for {3}, then it expires and you have to ask again.\n\nIf it was not you, simply ignore this message — your current password is untouched and nothing has changed. If it worries you, call your Trưởng chi (the head of your branch).\n\nThis message was sent automatically by the {2} genealogy site. Please do not reply to it.
passwordResetBodyHtml=<p>Dear relative,</p><p>Someone has asked to reset the password on your account at the <b>{2}</b> family genealogy site. If that was you, use the link below to set a new one:</p><p><a href="{0}">Set a new password</a></p><p>The link works for {3}, then it expires and you have to ask again.</p><p>If it was not you, simply ignore this message — your current password is untouched and nothing has changed. If it worries you, call your Trưởng chi (the head of your branch).</p><p>This message was sent automatically by the {2} genealogy site. Please do not reply to it.</p>

emailVerificationSubject=Please confirm this address — family genealogy site
emailVerificationBody=Dear relative,\n\nSomeone has just registered at the {2} family genealogy site using the clan''s invitation code, and gave this email address. If that was you, open the link below to confirm it:\n\n{0}\n\nThe link works for {3}.\n\nOnce confirmed, you can open the phả đồ (family tree) straight away. To edit your own record there is one more step: find yourself in the tree, claim your place, and wait for your Trưởng chi to approve.\n\nIf it was not you, simply ignore this message — no account can be used until somebody follows the link above.\n\nThis message was sent automatically by the {2} genealogy site. Please do not reply to it.
emailVerificationBodyHtml=<p>Dear relative,</p><p>Someone has just registered at the <b>{2}</b> family genealogy site using the clan''s invitation code, and gave this email address. If that was you, use the link below to confirm it:</p><p><a href="{0}">Confirm this is my address</a></p><p>The link works for {3}.</p><p>Once confirmed, you can open the phả đồ (family tree) straight away. To edit your own record there is one more step: find yourself in the tree, claim your place, and wait for your Trưởng chi to approve.</p><p>If it was not you, simply ignore this message — no account can be used until somebody follows the link above.</p><p>This message was sent automatically by the {2} genealogy site. Please do not reply to it.</p>

executeActionsSubject=Something needs doing on your account
executeActionsBody=Dear relative,\n\nThe {2} genealogy site needs you to do one thing on your account. Please open the link below:\n\n{0}\n\nThe link works for {3}.\n\nIf you do not know why you received this, call your Trưởng chi (the head of your branch) before following any link.\n\nThis message was sent automatically by the {2} genealogy site. Please do not reply to it.
executeActionsBodyHtml=<p>Dear relative,</p><p>The <b>{2}</b> genealogy site needs you to do one thing on your account. Please use the link below:</p><p><a href="{0}">Open my account page</a></p><p>The link works for {3}.</p><p>If you do not know why you received this, call your Trưởng chi (the head of your branch) before following any link.</p><p>This message was sent automatically by the {2} genealogy site. Please do not reply to it.</p>

emailTestSubject=Mail server test
emailTestBody=This message proves the mail server for the {2} genealogy site can send. There is nothing to do.
emailTestBodyHtml=<p>This message proves the mail server for the <b>{2}</b> genealogy site can send. There is nothing to do.</p>

# ── EMAIL SUBJECTS TAKE NO PARAMETERS ────────────────────────────────────────
# Keycloak formats the SUBJECT with an EMPTY parameter list; only the BODY gets
# {0}..{3}. A subject written with {2} in it is delivered with the literal text
# "{2}" — caught in Mailpit on the first try. Subjects must stand alone.
