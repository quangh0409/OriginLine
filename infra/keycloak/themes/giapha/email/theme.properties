# ─────────────────────────────────────────────────────────────────────────────
# Theme THƯ của dòng họ.
#
# `parent=keycloak` ở đây, KHÔNG phải `parent=base` như theme đăng nhập.
#
# Lý do khác nhau, và nó không mâu thuẫn: theme đăng nhập tránh `keycloak` vì
# theme ấy kéo theo PatternFly và một bộ CSS cãi nhau với sàn cỡ chữ 16px của
# 00 §2.2. Thư điện tử KHÔNG có bộ CSS nào để cãi — `keycloak/email` chỉ là
# `base/email` cộng một dòng, và `base/email` chỉ có khuôn FreeMarker trần.
# Kế thừa ở đây là nhận đúng thứ ta muốn: MỌI khuôn thư Keycloak có thể gửi
# (đặt lại mật khẩu, xác minh thư, hành động bắt buộc, sự kiện bảo mật), mà
# không phải dựng lại từng cái.
#
# Nên tệp này chỉ ghi đè CÂU CHỮ, không ghi đè khuôn. Thư nào ta chưa viết lại
# vẫn gửi được, chỉ là bằng câu gốc của Keycloak.
#
# Realm trỏ tới đây bằng khoá `emailTheme: giapha` trong realm-giapha.json.
# Thiếu khoá ấy thì Keycloak lặng lẽ dùng theme `keycloak` — thư vẫn gửi, chỉ
# là nói tiếng của phần mềm, và không ai thấy lỗi nào.
# ─────────────────────────────────────────────────────────────────────────────
parent=keycloak

locales=vi,en
