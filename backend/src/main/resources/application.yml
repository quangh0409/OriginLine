# =====================================================================================
# Cau hinh mac dinh - He Thong Quan Ly Gia Pha & Cong Thong Tin Dong Ho
# Gia tri nhay cam deu doc tu bien moi truong; gia tri mac dinh o day la cua moi truong
# phat trien cuc bo, khop voi infra/docker-compose.yml.
# =====================================================================================
spring:
  application:
    name: giapha-backend
  profiles:
    default: dev

  # ---------------------------------------------------------------------------------
  # PostgreSQL 16 + Apache AGE - kho du lieu DUY NHAT (quan he + do thi trong cung mot DB)
  # ---------------------------------------------------------------------------------
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/giapha}
    username: ${DB_USERNAME:giapha}
    password: ${DB_PASSWORD:giapha}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: giapha-hikari
      maximum-pool-size: ${DB_POOL_MAX:10}
      minimum-idle: 2
      connection-timeout: 30000
      # =============================================================================
      # BAY SO 1 - APACHE AGE PHAI DUOC NAP LAI TREN TUNG CONNECTION
      #
      # `CREATE EXTENSION age` (Flyway V1) chi dang ky extension o cap database. Nhung
      # thu vien dong cua AGE phai duoc LOAD vao *tung phien lam viec*, va cac ham/kieu
      # cua no (cypher(), agtype, ...) nam trong schema `ag_catalog` - schema nay khong
      # co trong search_path mac dinh.
      #
      # Khong co dong duoi day thi moi truy van Cypher se fail rai rac va rat kho chan
      # doan: connection nao vua duoc tao moi thi loi ("function cypher(...) does not
      # exist"), connection dang nam trong pool va da tung chay thi van chay dung.
      # Trieu chung "luc duoc luc khong" nay dot rat nhieu thoi gian neu khong biet truoc.
      #
      # Hikari chay chuoi SQL nay ngay sau khi mo moi connection vat ly - ke ca connection
      # ma Flyway dung. Luu y: LOAD 'age' doi hoi image Postgres CO san thu vien AGE
      # (vd. apache/age:PG16_latest). Chay tren image postgres:16 thuan thi TOAN BO pool
      # se hong ngay tu connection dau tien.
      # =============================================================================
      connection-init-sql: 'LOAD ''age''; SET search_path = ag_catalog, "$user", public;'

  jpa:
    hibernate:
      # Schema do Flyway quan ly. Khong bao gio de Hibernate tu sua schema:
      # bang `person` co cot generated (name_unaccented), ltree va graph di kem.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        # =====================================================================
        # BAY SO 2 - AGE VA HIBERNATE TRANH NHAU "SCHEMA MAC DINH"
        #
        # connection-init-sql o tren buoc phai dat ag_catalog DAU search_path de
        # Cypher chay duoc. Nhung Hibernate lai suy ra schema mac dinh tu chinh
        # phan tu dau tien do, nen khi ddl-auto=validate no di tim
        # `ag_catalog.branch` va chet ngay luc khoi dong:
        #
        #     SchemaManagementException: Schema-validation: missing table [branch]
        #
        # Bang van nam dung cho o `public` (Flyway tao dung); chi rieng phep
        # validate nhin nham cho. Ghim thang default_schema thay vi doi thu tu
        # search_path - doi thu tu la dung vao thu ma tang graph phu thuoc.
        # =====================================================================
        default_schema: public
        jdbc:
          time_zone: UTC
          batch_size: 50
        order_inserts: true
        order_updates: true
        format_sql: false
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true
    # Migration thuoc so huu cua workstream W1 - khong sua tu W0.

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2s
      lettuce:
        pool:
          max-active: 8
          max-idle: 4

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:giapha}
    password: ${RABBITMQ_PASSWORD:giapha}
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    listener:
      simple:
        acknowledge-mode: auto
        prefetch: 10
        # default-requeue-rejected: false la BAT BUOC. De true thi tin nhan loi quay
        # vong vo tan giua queue va consumer, khong bao gio toi duoc notify.dlq.
        default-requeue-rejected: false
        retry:
          enabled: true
          initial-interval: 2s
          multiplier: 2
          max-attempts: 5
          max-interval: 30s

  security:
    oauth2:
      resourceserver:
        jwt:
          # BAY SO 2 - khoi dong khong duoc phu thuoc vao Keycloak dang song.
          # Neu chi khai bao issuer-uri, Spring Boot goi endpoint discovery NGAY luc tao
          # bean -> Keycloak chua san sang la backend chet ngay khi khoi dong (va
          # /actuator/health khong bao gio xanh). Khai bao them jwk-set-uri thi decoder
          # duoc tao lazy, con issuer-uri van duoc dung de kiem tra claim `iss`.
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8081/realms/giapha}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8081/realms/giapha/protocol/openid-connect/certs}

  graphql:
    # GraphQL chi phuc vu truy van cay long sau (client tu chon do sau) - phan con lai la REST.
    path: /api/v1/graphql
    schema:
      locations: classpath:graphql/**/
    graphiql:
      enabled: false

  servlet:
    multipart:
      # =============================================================================
      # BAY SO 3 - TRAN MULTIPART MAC DINH CUA SPRING LA 1 MB
      #
      # Khong khai bao thi Spring Boot chan moi tep > 1 MB TRUOC KHI controller chay,
      # trong khi tran nghiep vu (ImportLimits.MAX_FILE_BYTES) la 10 MB. Hau qua:
      # mot tep .xlsx 2 MB hoan toan hop le cua mot chi 400 nguoi bi tu choi, va vi
      # tang api DA co handler cho MaxUploadSizeExceededException nen no ra dung ma
      # 413 kem dung cau "vuot tran 10 MB" - tuc la mot thong bao SAI ma trong nhu
      # dung. Kieu lech hang so am tham nay ton nhieu gio nhat de truy.
      #
      # HAI CON SO NAY PHAI KHOP vn.giapha.dataimport.domain.ImportLimits:
      #   max-file-size    == ImportLimits.MAX_FILE_BYTES        (10 MB)
      #   max-request-size >  max-file-size                      (phan bao multipart:
      #       boundary, header cua tung phan, va tham so branchId/force di kem)
      # ImportMultipartLimitTest ghim rang chung khong troi khoi nhau. Doi mot ben ma
      # khong doi ben kia se lam bo test do ngay, dung y do.
      # =============================================================================
      max-file-size: 10MB
      max-request-size: 12MB

  mvc:
    problemdetails:
      # Bat de ca ngoai le san co cua Spring MVC cung tra ve RFC 7807.
      enabled: true
    throw-exception-if-no-handler-found: true

  web:
    resources:
      add-mappings: false

  messages:
    basename: i18n/messages
    encoding: UTF-8
    fallback-to-system-locale: false

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  error:
    whitelabel:
      enabled: false
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true
  metrics:
    tags:
      application: giapha-backend

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

# =====================================================================================
# Cau hinh rieng cua ung dung
# =====================================================================================
giapha:
  # ===========================================================================
  # KHO DOI TUONG (MinIO / S3) — anh & video cua bai viet, anh chan dung
  #
  # KHONG CO KHOA THAT O DAY. Hai gia tri mac dinh duoi day la thong tin dang
  # nhap cua MAY PHAT TRIEN, va chung da nam cong khai trong
  # infra/docker-compose.yml + README.md vi chung chi mo duoc mot MinIO chay
  # tren chinh may cua nguoi phat trien. O moi truong that, MINIO_ACCESS_KEY /
  # MINIO_SECRET_KEY PHAI den tu bien moi truong.
  #
  # BAY: `public-endpoint` VA `endpoint` CO THE KHAC NHAU
  # Chu ky SigV4 phu ca TEN MAY CHU. Trong Docker Compose, backend goi MinIO qua
  # http://minio:9000 (ten dich vu trong mang noi bo) nhung trinh duyet KHONG
  # phan giai duoc ten ay. Ky bang mot ten roi giao cho trinh duyet dung mot ten
  # khac thi MinIO tra SignatureDoesNotMatch — mot thong bao noi ve chu ky trong
  # khi loi that nam o ten may chu. De trong = dung lai `endpoint`, dung cho may
  # phat trien noi ca hai deu la localhost:9000.
  #
  # TRAN DUNG LUONG/THOI LUONG KHONG O DAY. Chung o vn.giapha.media.domain
  # .MediaLimits — MOT cho duy nhat, va MediaLimitsContractTest ghim rang hop
  # dong OpenAPI khong troi khoi ma. Dat chung o YAML se tai lap dung cai bay ma
  # ImportMultipartLimitTest sinh ra de chan.
  #
  # LUU Y VE spring.servlet.multipart: tran 10 MB o tren KHONG lien quan toi
  # video. Tep KHONG di qua backend — client PUT thang len kho bang URL da ky.
  # Dung nang tran ay vi video; no co y khop ImportLimits.MAX_FILE_BYTES.
  # ===========================================================================
  media:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    public-endpoint: ${MINIO_PUBLIC_ENDPOINT:}
    access-key: ${MINIO_ACCESS_KEY:giapha}
    secret-key: ${MINIO_SECRET_KEY:giapha123}
    bucket: ${MINIO_MEDIA_BUCKET:giapha-media}
    # Bat o may phat trien va trong bai kiem tich hop. O moi truong that nen TAT
    # va de nguoi van hanh tao bucket kem dung chinh sach (khong doc an danh,
    # versioning, vong doi) — bucket do ung dung tu tao mang chinh sach mac dinh
    # cua may chu, va mac dinh ay khong phai thu ta muon cho anh nguoi con song.
    auto-create-bucket: ${MINIO_AUTO_CREATE_BUCKET:true}
    # Don tep mo coi. 03:15 GMT+7 — KHONG trung 01:30 cua job sinh nhac gio: hai
    # cong viec dem cung gio se tranh nhau pool ket noi roi cung cham, va nguoi
    # van hanh thay hai thu hong ma khong biet cai nao keo cai nao.
    gc-cron: ${GIAPHA_MEDIA_GC_CRON:0 15 3 * * *}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  security:
    client-id: ${KEYCLOAK_CLIENT_ID:giapha-backend}
  keycloak:
    admin:
      # =============================================================================
      # TAI KHOAN DICH VU DE LAP TAI KHOAN CHO NGUOI DUOC MOI
      #
      # KHONG CO DONG `client-secret` O DAY, VA DO LA CO Y. Bi mat nay mo quyen tao
      # nguoi dung trong realm; mot chuoi nhu the lot vao lich su Git la lot vinh vien
      # (xoa o commit sau khong xoa duoc o commit truoc, va moi ban clone deu da co).
      # No duoc doc THANG tu bien moi truong nho rang buoc ten long cua Spring Boot:
      #
      #     GIAPHA_KEYCLOAK_ADMIN_CLIENT_SECRET -> giapha.keycloak.admin.client-secret
      #
      # Cung khuon mau voi GIAPHA_WEBPUSH_PRIVATE_KEY. Xem
      # infra/keycloak-admin-dev.example.txt. `KeycloakAdminPropertiesTest` lam do bo
      # test neu bi mat xuat hien trong tep nay.
      #
      # Thieu bien moi truong thi cong danh tinh TU TAT: ung dung van khoi dong, loi
      # nhan loi moi bang token san co van chay, chi loi "nguoi chua co tai khoan" tra
      # 503 IDENTITY_PROVIDER_UNAVAILABLE.
      # =============================================================================
      enabled: ${GIAPHA_KEYCLOAK_ADMIN_ENABLED:true}
      server-url: ${KEYCLOAK_SERVER_URL:http://localhost:8081}
      realm: ${KEYCLOAK_REALM:giapha}
      client-id: ${GIAPHA_KEYCLOAK_ADMIN_CLIENT_ID:giapha-provisioner}
      # {token} la cho danh san; tro toi TRANG cua frontend, khong toi API.
      set-password-url: ${GIAPHA_SET_PASSWORD_URL:http://localhost:3000/vi/dat-mat-khau?token={token}}
      link-ttl: ${GIAPHA_SET_PASSWORD_LINK_TTL:30m}
  openapi:
    server-url: ${OPENAPI_SERVER_URL:http://localhost:8080}
  graph:
    # Ten do thi AGE - dung trong moi cau Cypher: SELECT * FROM cypher('giapha_graph', $$ ... $$)
    name: giapha_graph
  locale:
    default: vi
    supported: vi,en

logging:
  level:
    root: INFO
    vn.giapha: INFO
