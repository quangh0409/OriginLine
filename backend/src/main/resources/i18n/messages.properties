# =============================================================================
# RFC 7807 - thong diep cho ngoai le SAN CO cua Spring MVC.
#
# Spring tra cuu theo khoa `problemDetail.<FQCN>` (detail) va
# `problemDetail.title.<FQCN>` (title). Thieu khoa thi Spring dung thong diep
# mac dinh cua no (tieng Anh) - chap nhan duoc, khong con phun ma ra API nua.
#
# LICH SU: WebConfig tung dat setUseCodeAsDefaultMessage(true) khien moi loi
# tra ve chinh cai ma thay vi cau chu, vi du:
#   "title":"problemDetail.title.org.springframework.web.servlet.NoHandlerFoundException"
# Vua lam client khong doc duoc, vua lo ten class noi bo cua Spring ra API cong
# khai. Co da duoc tat; cac khoa duoi day thay the phan tieng Viet.
# =============================================================================
problemDetail.title.org.springframework.web.servlet.NoHandlerFoundException=Khong tim thay
problemDetail.org.springframework.web.servlet.NoHandlerFoundException=Duong dan khong ton tai.
problemDetail.title.org.springframework.web.servlet.resource.NoResourceFoundException=Khong tim thay
problemDetail.org.springframework.web.servlet.resource.NoResourceFoundException=Duong dan khong ton tai.
problemDetail.title.org.springframework.web.HttpRequestMethodNotSupportedException=Phuong thuc khong duoc ho tro
problemDetail.org.springframework.web.HttpRequestMethodNotSupportedException=Phuong thuc HTTP nay khong dung duoc cho duong dan da goi.
problemDetail.title.org.springframework.web.HttpMediaTypeNotSupportedException=Dinh dang khong duoc ho tro
problemDetail.org.springframework.web.HttpMediaTypeNotSupportedException=Kieu noi dung gui len khong duoc ho tro.
problemDetail.title.org.springframework.web.HttpMediaTypeNotAcceptableException=Khong dap ung duoc dinh dang yeu cau
problemDetail.org.springframework.web.HttpMediaTypeNotAcceptableException=May chu khong tra ve duoc dinh dang ma client yeu cau.
problemDetail.title.org.springframework.web.bind.MethodArgumentNotValidException=Du lieu khong hop le
problemDetail.org.springframework.web.bind.MethodArgumentNotValidException=Du lieu gui len khong hop le. Xem chi tiet o truong errors.
problemDetail.title.org.springframework.http.converter.HttpMessageNotReadableException=Khong doc duoc du lieu
problemDetail.org.springframework.http.converter.HttpMessageNotReadableException=Noi dung gui len khong doc duoc hoac sai dinh dang.
problemDetail.title.org.springframework.web.bind.MissingServletRequestParameterException=Thieu tham so
problemDetail.org.springframework.web.bind.MissingServletRequestParameterException=Yeu cau thieu mot tham so bat buoc.
problemDetail.title.org.springframework.web.bind.MissingRequestHeaderException=Thieu header
problemDetail.org.springframework.web.bind.MissingRequestHeaderException=Yeu cau thieu mot header bat buoc.
problemDetail.title.org.springframework.web.method.annotation.MethodArgumentTypeMismatchException=Tham so sai kieu
