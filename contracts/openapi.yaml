openapi: 3.1.0

info:
  title: Gia Phả Dòng Họ API
  version: 1.0.0-sprint1
  summary: REST API cho hệ thống gia phả dòng họ (Giai đoạn 1 / Phase 1 MVP).
  description: |-
    ## Tiếng Việt

    API REST của hệ thống quản lý gia phả. Truy vấn cây **lồng sâu** dùng GraphQL
    (`POST /api/v1/graphql`, schema tại `contracts/schema.graphqls`); mọi thứ còn lại dùng REST.

    Quy ước chung:

    * **Versioning theo URL**: mọi đường dẫn nằm dưới `/api/v1`.
    * **Lỗi theo RFC 7807** Problem Details, `Content-Type: application/problem+json`.
      Trường mở rộng `code` là mã máy đọc được — FE phân nhánh theo `code`, **không** theo `detail`.
    * **Phân trang thống nhất** cho mọi endpoint trả danh sách: query `page` (0-based) + `size`,
      phản hồi bọc trong `{ items: [...], page: { ... } }`.
    * **Định danh**: UUID v4/v7 dạng chuỗi.
    * **Thời điểm**: ISO-8601 có offset (`2026-03-14T08:00:00+07:00`). Múi giờ nghiệp vụ là **GMT+7**.
    * **Ngày song lịch**: mọi mốc sinh/mất đều có cả dương lịch (`solar`) và âm lịch (`lunar`).
      `death.lunar` là **nguồn chân lý** để tính ngày giỗ.
    * **Ngôn ngữ**: gửi `Accept-Language: vi` hoặc `en`; mặc định `vi`.
      Danh xưng (`title`) luôn trả bằng tiếng Việt vì đó là dữ liệu nghiệp vụ, không phải chuỗi i18n.

    ### Phân tầng riêng tư — đọc kỹ trước khi code FE (Nghị định 13/2023, BA v2 §10)

    Cùng một `PersonDto` nhưng **tập trường trả về khác nhau** theo vai người gọi, `isAlive`
    và **bản đồng thuận riêng tư** (`PrivacySettings`) của chính người đó — năm nhóm trường,
    mỗi nhóm một mức `PRIVATE` / `BRANCH` / `CLAN` do chủ thể tự chọn:

    | Đối tượng | Trường | Ai thấy |
    |---|---|---|
    | Người đã khuất | tên, ngày sinh–mất, tiểu sử, vai vế, mộ phần, vinh danh | công khai, kể cả Khách |
    | Người sống — Tầng 1 | tên, đời/vai vế, quan hệ cha–con–vợ–chồng | **thành viên đã đăng nhập**; Khách KHÔNG thấy |
    | Người sống — Tầng 2 | năm sinh, nghề nghiệp, nơi ở cấp tỉnh | thành viên cùng chi/ngành hoặc được cấp quyền |
    | Người sống — Tầng 3 | SĐT, email, địa chỉ đầy đủ, ngày sinh đầy đủ, ảnh | bản thân + Admin + người được opt-in |

    **Quy tắc kỹ thuật bắt buộc — cả BE và FE phải theo:**

    1. Trường bị ẩn được **loại bỏ khỏi JSON** (absent), **không** trả `null`, **không** trả chuỗi rỗng
       hay `"***"`. Ẩn vì thiếu quyền và ẩn vì không có dữ liệu là **không phân biệt được** — đó là chủ ý.
    2. FE **không được** render ô trống/placeholder kiểu "dữ liệu bị ẩn" cho trường vắng mặt.
    3. Khách (không có token) hỏi một **người còn sống** sẽ nhận **`404 Not Found`**, không phải `403`.
       Trả 403 là tự tố cáo người đó tồn tại.
    4. Vì lý do (3), người còn sống **không xuất hiện** trong `/tree`, `/persons/search`, `/events`
       khi người gọi là Khách — kể cả dưới dạng node ẩn danh.
    5. Trẻ vị thành niên bị ẩn tối đa theo mặc định.
    6. Xóa dữ liệu cá nhân hợp pháp = **ẩn danh hóa** (xóa Tầng 3), **giữ node phả hệ**.
       Không bao giờ xóa cứng một nhân khẩu.

    ## English

    REST API for the clan genealogy platform. Deep nested tree queries use GraphQL; everything
    else is REST. Errors are RFC 7807. Living-person fields are filtered by privacy tier —
    hidden fields are **omitted**, never nulled; guests receive no living person at all and get
    `404` rather than `403` so that existence is not disclosed.
  contact:
    name: Nhóm phát triển Gia Phả Dòng Họ
  license:
    name: Proprietary

servers:
  - url: http://localhost:8080/api/v1
    description: Local dev (docker-compose)
  - url: https://staging.giapha.example.vn/api/v1
    description: Staging
  - url: https://giapha.example.vn/api/v1
    description: Production

tags:
  - name: persons
    description: Nhân khẩu — thêm, sửa, xóa mềm, tìm kiếm. / Person records.
  - name: tree
    description: Phả đồ — projection cây, lazy theo độ sâu. / Tree projection.
  - name: directory
    description: |-
      Danh bạ dòng họ — **người còn sống đã tự mở** ít nhất một nhóm trường cho người đang xem.
      Màn hình duy nhất lấy người sống làm trung tâm; Khách nhận `401`.
      / Clan directory: living members who opted in; guests get 401.
  - name: public
    description: |-
      Cổng thông tin công khai cho **Khách vãng lai** — chỉ người đã khuất, chỉ đọc, không cần token.
      / Public guest portal: deceased persons only, read-only, no token required.
  - name: kinship
    description: Danh xưng & bộ quy tắc danh xưng. / Kinship titles & rule engine.
  - name: change-requests
    description: |-
      Luồng đề nghị – duyệt đính chính. Duyệt một `UPDATE_PERSON` nay **ghi thật** vào phả.
      / Correction request workflow; approving an UPDATE_PERSON now writes through.
  - name: events
    description: Giỗ, chạp mả, lễ dòng họ. / Ancestral events.
  - name: notifications
    description: Trung tâm thông báo in-app. / In-app notification centre.
  - name: push
    description: Web Push (VAPID). / Web Push subscriptions.
  - name: admin-reminders
    description: |-
      Vận hành đường ống nhắc giỗ (chạy tay job sinh/đẩy lịch nhắc). **Chỉ System Admin.**
      / Reminder pipeline operations, system admin only.
  - name: admin-webpush
    description: |-
      Chẩn đoán cấu hình Web Push (VAPID). **Chỉ System Admin**, và **chỉ đọc** — không có đường
      nào nhận khoá riêng qua HTTP. / Web Push configuration diagnostics, read-only, admin only.
  - name: import
    description: |-
      Nhập liệu hàng loạt từ tệp Excel của Trưởng chi — khu vực chờ, bộ kiểm, cổng duyệt.
      **Không endpoint nào ở đây ghi vào phả**; ranh giới ghi nằm ở đúng một bước.
      / Bulk Excel import: staging area, validator, approval gate.
  - name: invitations
    description: |-
      Mời người vào hệ thống — phát mã, nhận mã, thu hồi. **Cửa duy nhất để một người thứ
      tư vào được hệ thống**: dòng họ mời người vào, không ai tự đăng ký.
      Hai đường (`/lookup`, `/decline`) **không cần token** — người bấm chính là người chưa
      có tài khoản. / Invitation flow: the only door in; two endpoints need no token.
  - name: graphql
    description: Điểm vào GraphQL cho cây lồng sâu. / GraphQL entry point.

security:
  - bearerAuth: []
  - {}

paths:
  # ---------------------------------------------------------------------------
  # NHÂN KHẨU / PERSONS
  # ---------------------------------------------------------------------------
  /persons:
    post:
      tags: [persons]
      operationId: createPerson
      summary: Thêm nhân khẩu / Add a person
      description: |-
        Thêm một nhân khẩu vào gia phả và (tùy chọn) nối ngay vào cây qua `initialRelationships`.

        **Quyền**: `BRANCH_HEAD` trong phạm vi chi/ngành được giao · `COUNCIL` · `ADMIN`.
        `MEMBER` gửi request này sẽ nhận `202 Accepted` kèm một `ChangeRequest` chờ Trưởng chi duyệt
        (luồng duyệt thuộc **Giai đoạn 2** — ở Giai đoạn 1 `MEMBER` nhận `403`).

        **Kỵ húy (FR-1.6)** — luồng hai bước, FE phải hiện thực đúng:

        1. Gửi lần đầu **không** kèm `confirmTabooOverride`.
        2. Nếu tên `HUY` (tên húy) trùng tên húy của một bậc trên trong dòng họ, API trả
           **`409 Conflict`** với `code = KY_HUY_CONFLICT` và danh sách `conflicts[]` (nêu rõ cụ nào,
           đời thứ mấy, trùng tên húy nào). **Không bản ghi nào được tạo.**
        3. FE hiện hộp thoại xác nhận, liệt kê `conflicts[]`.
        4. Nếu người dùng vẫn muốn ghi, gửi lại **y hệt payload cũ** cộng `confirmTabooOverride: true`.
           Lần này API trả `201`, và việc ghi đè được lưu vào `audit_log`.

        Cảnh báo kỵ húy là **cảnh báo, không phải cấm** — dòng họ có quyền quyết định.

        Thao tác được ghi `audit_log` (actor, thời điểm, before = null, after = person).
        Cạnh AGE và dòng `relationship` được ghi trong **cùng một transaction**.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePersonRequest'
      responses:
        '201':
          description: Đã tạo nhân khẩu. / Person created.
          headers:
            Location:
              description: URI của nhân khẩu vừa tạo. / URI of the created person.
              schema:
                type: string
                format: uri-reference
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonDto'
        '202':
          description: |-
            **Giai đoạn 2.** Người gọi là `MEMBER`: hệ thống đã tạo một `ChangeRequest` trạng thái
            `PENDING` chờ Trưởng chi duyệt; chưa có nhân khẩu nào được tạo.
            Ở Giai đoạn 1 nhánh này chưa bật — `MEMBER` nhận `403`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangeRequestAccepted'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: |-
            Xung đột. Phân nhánh theo `code`:
            * `KY_HUY_CONFLICT` — trùng tên húy bậc trên; gửi lại kèm `confirmTabooOverride: true`.
            * `DUPLICATE_PERSON_SUSPECTED` — nghi trùng nhân khẩu đã có (cùng tên + năm sinh + chi);
              gửi lại kèm `confirmDuplicateOverride: true`.
            * `RELATIONSHIP_CYCLE` — quan hệ cha–con tạo chu trình trong đồ thị.

            Với hai `code` đầu, `conflicts[]` **chỉ mang khoá và loại tín hiệu** — không tên, không
            đời thứ, không chi, và `detail` cũng vậy. FE dựng thẻ đối chiếu bằng cách gọi
            `GET /api/v1/persons/{id}` cho từng khoá; xem `TabooConflict` / `DuplicateCandidate`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ConflictProblem'
              examples:
                kyHuy:
                  summary: Trùng tên húy bậc trên / Taboo-name collision
                  value:
                    type: https://giapha.example.vn/problems/ky-huy-conflict
                    title: Trùng tên húy bậc trên
                    status: 409
                    detail: >-
                      Ten huy vua nhap trung ten huy cua 1 bac tren (trung nguyen van). Vi ly do
                      rieng tu, than loi khong neu danh tinh bac tren: mo ho so theo
                      ancestorPersonId de xem phan minh duoc phep xem. Xac nhan de van ghi.
                    instance: /api/v1/persons
                    code: KY_HUY_CONFLICT
                    traceId: 00-4bf92f3577b34da6a3ce929d0e0e4736-00f067aa0ba902b7-01
                    overridable: true
                    overrideField: confirmTabooOverride
                    conflicts:
                      - ancestorPersonId: 6f1b1d6e-2f8a-4d1c-9a91-9f2c1f0b7a01
                        matchedNameType: HUY
                        matchKind: EXACT
                nghiTrung:
                  summary: Nghi trùng nhân khẩu / Suspected duplicate person
                  value:
                    type: https://giapha.example.vn/problems/conflict
                    title: Nghi trùng nhân khẩu
                    status: 409
                    detail: >-
                      Nghi trung voi 1 ho so da co trong gia pha - diem cao nhat 80, khop o: trung
                      ho ten du dau, trung nam sinh, cung chi. Vi ly do rieng tu, than loi khong
                      neu danh tinh: mo tung ho so theo personId de xem phan minh duoc phep xem.
                      Xac nhan neu day la nguoi khac.
                    instance: /api/v1/persons
                    code: DUPLICATE_PERSON_SUSPECTED
                    traceId: 00-4bf92f3577b34da6a3ce929d0e0e4736-00f067aa0ba902b7-01
                    overridable: true
                    overrideField: confirmDuplicateOverride
                    conflicts:
                      - personId: 9c2a7f10-51c4-4a2e-9b23-6c0e2a7f1a55
                        ref: null
                        score: 80
                        signals: [TEN_TRUNG_CO_DAU, NAM_SINH_KHOP, CUNG_CHI]
                        hint: 'trùng họ tên đủ dấu, trùng năm sinh, cùng chi'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /persons/{id}:
    parameters:
      - $ref: '#/components/parameters/PersonId'
      - $ref: '#/components/parameters/AcceptLanguage'
    get:
      tags: [persons]
      operationId: getPerson
      summary: Xem hồ sơ nhân khẩu / Get a person
      description: |-
        Trả hồ sơ đã **lọc theo phân tầng riêng tư** (xem `info.description`).

        * Người đã khuất: công khai, kể cả Khách.
        * Người còn sống + người gọi là Khách (không token): **`404`**, không phải `403`.
        * Người còn sống + thành viên đã đăng nhập: tối thiểu Tầng 1; Tầng 2/3 mở thêm theo
          phạm vi chi/ngành, vai trò, và **bản đồng thuận theo từng nhóm trường**
          (`PrivacySettings`) do chính chủ thể chọn.
        * Nhân khẩu đã xóa mềm: chỉ `ADMIN`/`COUNCIL` thấy; vai khác nhận `404`.

        `meta.visibleTier` cho FE biết **mình** đang ở tầng nào để bật/tắt affordance,
        chứ không tiết lộ trường nào đang bị giấu.
      security:
        - bearerAuth: []
        - {}
      responses:
        '200':
          description: OK
          headers:
            ETag:
              description: Dùng cho `If-Match` khi PATCH (optimistic locking).
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonDto'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    patch:
      tags: [persons]
      operationId: updatePerson
      summary: Sửa hồ sơ nhân khẩu / Update a person
      description: |-
        Cập nhật một phần hồ sơ.

        **Ngữ nghĩa cập nhật — chốt rõ để BE/FE không lệch:**

        * Trường **vắng mặt** trong body ⇒ **giữ nguyên**.
        * Trường có giá trị ⇒ **ghi đè**.
        * Muốn **xóa trắng** một trường ⇒ liệt kê tên trường trong mảng `clearFields`.
          (Cố ý không dùng `null` để xóa: `null` và "không gửi" quá dễ lẫn nhau qua các lớp JSON client.)
        * `names` nếu gửi là **thay thế toàn bộ** danh sách tên, không phải cộng thêm.

        **Đồng thời (optimistic locking)**: gửi `If-Match` với `ETag` lấy từ `GET`.
        Bản ghi đã bị người khác sửa ⇒ `409` `OPTIMISTIC_LOCK_CONFLICT`; FE nạp lại rồi thử lại.

        **Quyền**: `ADMIN` · `COUNCIL` · `BRANCH_HEAD` trong phạm vi chi được giao ·
        `MEMBER` chỉ sửa hồ sơ **của chính mình** (gồm khối `privacy` của mình).
        Sửa quan hệ phả hệ **không** đi qua endpoint này.

        Ghi `audit_log` đầy đủ before/after; giá trị Tầng 3 **không** được ghi vào log.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePersonRequest'
      responses:
        '200':
          description: Đã cập nhật. / Updated.
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |-
            * `OPTIMISTIC_LOCK_CONFLICT` — bản ghi đã đổi kể từ `ETag` gửi lên.
            * `KY_HUY_CONFLICT` — tên húy mới trùng bậc trên; ghi đè bằng `confirmTabooOverride: true`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ConflictProblem'
        '412':
          description: Thiếu hoặc sai `If-Match`. / Precondition failed.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags: [persons]
      operationId: softDeletePerson
      summary: Xóa mềm nhân khẩu / Soft-delete a person
      description: |-
        **Xóa mềm — bắt buộc (FR-1.5).** Đặt `is_deleted = true`.
        Node trong đồ thị AGE và các cạnh quan hệ **được giữ nguyên** để cây không gãy.
        Không có API xóa cứng, và sẽ không bao giờ có.

        Sau khi xóa mềm, nhân khẩu biến mất khỏi `/tree`, `/persons/search`, `/events`
        với mọi vai trừ `ADMIN`/`COUNCIL`.

        Khôi phục thực hiện qua `PATCH` với `isDeleted: false` (chỉ `ADMIN`/`COUNCIL`).

        Xóa dữ liệu cá nhân theo yêu cầu hợp pháp **không dùng endpoint này** — nghiệp vụ đó là
        *ẩn danh hóa* (xóa Tầng 3, giữ vai vế phả hệ); endpoint riêng cho việc đó **chưa chốt**
        (xem README, mục "Việc còn treo").

        **Quyền**: `ADMIN` · `COUNCIL` · `BRANCH_HEAD` trong phạm vi chi được giao.
      security:
        - bearerAuth: []
      parameters:
        - name: reason
          in: query
          required: false
          description: Lý do xóa, lưu vào `audit_log`. / Reason recorded in the audit log.
          schema:
            type: string
            maxLength: 500
      responses:
        '204':
          description: Đã xóa mềm. / Soft-deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: '`PERSON_ALREADY_DELETED` — đã ở trạng thái xóa mềm.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /persons/search:
    get:
      tags: [persons]
      operationId: searchPersons
      summary: Tìm kiếm nhân khẩu (không dấu) / Accent-insensitive person search
      description: |-
        Tìm theo tên, có dấu hoặc **không dấu** (FR-4.4) — `"nguyen van duc"` khớp `"Nguyễn Văn Đức"`.
        Backend dùng Postgres FTS + `unaccent` + `pg_trgm`; tìm trên **mọi lớp tên**
        (húy / tự / hiệu / thụy / thường gọi / pháp danh), không chỉ tên chính.

        Kết quả đã lọc theo phân tầng riêng tư: **Khách chỉ nhận người đã khuất**.
        Người còn sống bị lọc **trước khi** đếm, nên `page.totalElements` cũng không rò rỉ số lượng.
      security:
        - bearerAuth: []
        - {}
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
        - name: q
          in: query
          required: true
          description: Chuỗi tìm kiếm, có dấu hoặc không dấu. / Query string, accented or not.
          schema:
            type: string
            minLength: 1
            maxLength: 100
          example: nguyen van duc
        - name: generation
          in: query
          description: Lọc theo đời thứ (Thủy tổ = 1). / Filter by generation.
          schema:
            type: integer
            minimum: 1
        - name: branchId
          in: query
          description: Lọc trong một chi/ngành và toàn bộ nhánh con của nó. / Filter by branch subtree.
          schema:
            type: string
            format: uuid
        - name: nativePlace
          in: query
          description: Lọc theo nguyên quán. / Filter by native place.
          schema:
            type: string
        - name: isAlive
          in: query
          description: Lọc theo tình trạng sống/mất. Khách gửi `true` luôn nhận danh sách rỗng.
          schema:
            type: boolean
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - name: sort
          in: query
          description: |-
            `field,asc|desc`. Cho phép `relevance`, `generation`, `birthYear`, `name`.
          schema:
            type: string
            default: relevance,desc
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonSummaryPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # ---------------------------------------------------------------------------
  # PHẢ ĐỒ / TREE
  # ---------------------------------------------------------------------------
  /tree:
    get:
      tags: [tree]
      operationId: getTreeProjection
      summary: Lấy nhánh cây theo độ sâu (lazy) / Get a tree projection
      description: |-
        Trả **projection phẳng** của một nhánh cây: `nodes[]` + `edges[]`, dạng React Flow nạp
        thẳng được, không phải cây lồng nhau. Cây lồng sâu do client tự chọn hình dạng thì dùng
        GraphQL (`contracts/schema.graphqls`).

        **Lazy loading**: gọi lần đầu với `depth` nhỏ (mặc định 3). Node nào còn con chưa nạp sẽ có
        `hasMoreDescendants: true` và `descendantCount` — FE hiện nút "mở rộng" rồi gọi lại
        `/tree?rootId={nodeId}&depth=…` cho riêng node đó và ghép vào đồ thị đang có.

        **Chặn trên**: `depth` tối đa 10; ngoài ra server còn cắt theo `maxNodes`
        (mặc định 500, tối đa 2000). Khi bị cắt, `meta.truncated = true` và
        `meta.truncatedNodeIds[]` liệt kê các node bị cắt nhánh — FE **phải** xử lý,
        đừng giả định đã nhận đủ cây.

        **Cache**: phản hồi được cache ở Redis và có `ETag`. Gửi `If-None-Match` để nhận `304`.
        Cache tự invalidate khi có mutation trong nhánh.

        **Phân tầng**: người còn sống bị loại **hoàn toàn** khỏi projection khi người gọi là Khách —
        node lẫn cạnh đều không xuất hiện. Vì vậy cây mà Khách thấy có thể **đứt đoạn**;
        FE phải render được cây có lỗ, không được coi cạnh thiếu là lỗi dữ liệu.

        ### `rootId` tuỳ chọn — gốc mặc định theo vai

        Người dùng mở trang phả đồ mà chưa chọn ai thì không có `rootId` để gửi. Thiếu nó, máy chủ
        chọn **gốc của phạm vi mà người gọi chịu trách nhiệm** — một câu luật, bốn kết quả:

        | Vai | Phạm vi | Gốc mặc định |
        |---|---|---|
        | `ADMIN` · `COUNCIL` | cả dòng họ | **Thuỷ tổ** (đời nhỏ nhất trong phả) |
        | `BRANCH_HEAD` | các chi được giao | **ông tổ của chi được giao**, lấy chi nông nhất theo `ltree` |
        | `MEMBER` | chi nhà mình | **ông tổ chi mình** |
        | Khách | — | **Thuỷ tổ**, qua `GET /public/tree` |

        Cố ý **không** lấy hồ sơ của chính người dùng làm gốc: chiều mặc định là `DESCENDANTS`, nên
        một thành viên chưa có con sẽ mở ra đúng một node — chính mình. Hồ sơ cá nhân vẫn được dùng,
        nhưng để **xác định chi**, không để làm gốc. Gốc đã chọn nằm ở `rootId` của phản hồi, FE đọc
        từ đó để làm nổi bật node của người dùng nếu muốn.

        Nếu chi của người gọi chưa có nhân khẩu nào, máy chủ nới dần lên theo đường `ltree` rồi cuối
        cùng về cả dòng họ. Chỉ khi **không có nhân khẩu nào người gọi được biết là tồn tại** thì mới
        `404` — không bao giờ trả một cây rỗng `200`, vì cây rỗng nói dối rằng dòng họ không có ai.

        **Gửi `rootId` thì hành vi không đổi một ly**; phép chọn gốc mặc định thậm chí không chạy.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
        - name: rootId
          in: query
          required: false
          description: |-
            Nhân khẩu gốc của nhánh cần lấy. **Tuỳ chọn** — thiếu nó, máy chủ tự chọn gốc theo
            **vai và phạm vi chi/ngành** của người gọi (xem mô tả operation).
            / Root person of the subtree; optional — the server picks a role-scoped default.
          schema:
            type: string
            format: uuid
        - name: depth
          in: query
          description: Số đời lấy thêm tính từ gốc. / Number of generations beyond the root.
          schema:
            type: integer
            minimum: 0
            maximum: 10
            default: 3
        - name: direction
          in: query
          description: |-
            * `DESCENDANTS` — con cháu (mặc định).
            * `ANCESTORS` — tổ tiên.
            * `BOTH` — cả hai chiều, mỗi chiều `depth` đời.
          schema:
            $ref: '#/components/schemas/TreeDirection'
        - name: includeSpouses
          in: query
          description: Có kèm vợ/chồng (và cạnh `SPOUSE`) của mỗi node hay không. / Include spouses.
          schema:
            type: boolean
            default: true
        - name: includeDeleted
          in: query
          description: |-
            Kèm nhân khẩu đã xóa mềm. Chỉ `ADMIN`/`COUNCIL`; vai khác gửi `true` sẽ nhận `403`.
          schema:
            type: boolean
            default: false
        - name: maxNodes
          in: query
          description: Trần số node trả về trước khi cắt nhánh. / Hard cap before truncation.
          schema:
            type: integer
            minimum: 1
            maximum: 2000
            default: 500
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: OK
          headers:
            ETag:
              schema:
                type: string
            Cache-Control:
              schema:
                type: string
              example: private, max-age=60
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TreeProjection'
        '304':
          description: Không đổi kể từ `If-None-Match`. / Not modified.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: |-
            Không tìm thấy gốc. Gồm cả trường hợp **không gửi `rootId` và phả chưa có nhân khẩu nào**
            mà người gọi được biết là tồn tại. / Root not found, including the empty-clan case.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # ---------------------------------------------------------------------------
  # DANH BẠ DÒNG HỌ / CLAN DIRECTORY
  #
  # Người CÒN SỐNG đã tự mở ít nhất một nhóm trường cho người đang xem.
  # Đây là màn hình duy nhất trong hệ thống lấy người sống làm trung tâm.
  # ---------------------------------------------------------------------------
  /directory:
    get:
      tags: [directory]
      operationId: listDirectory
      summary: Danh bạ dòng họ / Clan directory
      description: |-
        Danh sách **người còn sống đã tự mở** ít nhất một nhóm trường riêng tư **cho đúng người
        gọi này**, kèm `coverage` và `facets`.

        ### Vì sao là endpoint riêng, không phải bộ lọc của `/persons/search`

        Điều kiện lọt vào hai danh sách khác hẳn nhau. `/persons/search` trả về mọi người mà người
        gọi *được biết là tồn tại* — gồm người đã khuất và cả người còn sống chưa mở gì. Danh bạ chỉ
        trả về người còn sống **đã đồng ý**. Nhét hai ngữ nghĩa vào một endpoint là cách chắc chắn
        nhất để một ngày nào đó tìm kiếm rò ra một người chưa hề đồng ý.

        ### Năm ràng buộc của màn này

        1. **Chỉ người còn sống.** Người đã khuất đã có `/public/persons/search`.
        2. **Chỉ người đã tự mở.** Sau `V8`, riêng tư là **năm nhóm trường × ba mức**
           (`PRIVATE`/`BRANCH`/`CLAN`) trong `person.privacy_consent`, mặc định **kín**. Lọt danh bạ
           nghĩa là ≥ 1 nhóm hiển thị được với người gọi. Trẻ vị thành niên không bao giờ lọt.
        3. **`coverage` do máy chủ đếm** — "218 / 627 người còn sống đã điền". Nó giải thích vì sao
           danh sách thưa (mặc định là kín, nên ngày đầu nó gần như rỗng) và ngầm mời người dùng
           điền. `sharedCount` **bỏ qua mọi bộ lọc**, nếu không nó sẽ tụt xuống mỗi lần người dùng
           chọn một tỉnh và câu "218 / 627" mất nghĩa.
        4. **Khách nhận `401`, không phải danh sách rỗng.** Một mảng rỗng kèm `coverage` bằng 0 là
           lời nói dối *có hình dạng dữ liệu thật*: nó bảo người dùng rằng dòng họ không có ai còn
           sống. Đây là ranh giới pháp lý (Nghị định 13/2023). Khác `GET /persons/{id}`, nơi `404` là
           bắt buộc vì câu hỏi là về **một** người cụ thể và chính sự tồn tại của người ấy là bí mật;
           ở đây câu hỏi không nhắc tới ai cả.
        5. **Đặc quyền `COUNCIL`/`ADMIN` KHÔNG áp vào danh sách này.** Nếu áp, danh bạ của quản trị
           viên luôn đầy 100% còn của mọi người thì thưa — tức đúng người chịu trách nhiệm cải thiện
           lại là người duy nhất không nhìn thấy vấn đề, và "218/627" mất nghĩa vì hai người đọc thấy
           hai thứ khác nhau. Cùng lý do, **chính chủ cũng không thấy mình vì là mình**: người vừa
           đóng hết công tắc không xuất hiện trong danh bạ của chính họ, nên màn hình nói đúng sự
           thật về thứ *người khác* nhìn thấy. Phạm vi chi/ngành thì giữ nguyên — mức `BRANCH` vẫn
           nghĩa là "người cùng chi tôi xem được".

        ### Trường vắng mặt là câu trả lời cuối cùng

        `occupation`, `currentPlaceProvince`, `avatarUrl` **biến mất khỏi JSON** khi chủ thể chưa mở
        nhóm tương ứng cho người gọi — và cũng biến mất khi họ đã mở nhưng chưa điền. Hai nguyên nhân
        ấy cố ý không phân biệt được. FE không được vẽ ô trống thay cho trường vắng.

        Phản hồi **không có `ETag`** và mang `Cache-Control: no-store`: toàn bộ thân là dữ liệu người
        còn sống đã lọc theo người gọi, và `coverage` đổi mỗi khi có người bật một công tắc.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
        - name: q
          in: query
          description: |-
            Tìm theo tên, **không dấu cũng khớp** (`vn_unaccent` + `pg_trgm`), trên **mọi lớp tên**.
            Khớp ở tên húy vẫn trả về tên chính — giống `/persons/search`.
          schema:
            type: string
            maxLength: 100
          example: nguyen van duc
        - name: province
          in: query
          description: |-
            Lọc theo tỉnh/thành nơi ở. Giá trị lấy từ `facets.provinces` của lượt gọi trước, **không**
            phải do người dùng gõ tay.
          schema:
            type: string
            maxLength: 100
        - name: occupation
          in: query
          description: Lọc theo nghề nghiệp; giá trị lấy từ `facets.occupations`.
          schema:
            type: string
            maxLength: 100
        - name: branchId
          in: query
          description: Lọc trong một chi/ngành và **toàn bộ nhánh con** của nó (`ltree`).
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - name: sort
          in: query
          description: |-
            `name` (mặc định) hoặc `generation`. So tên theo **quy tắc tiếng Việt**, không theo mã
            Unicode. Mọi thứ tự đều có khoá phụ nên tất định giữa hai lượt gọi.
          schema:
            type: string
            enum: [name, generation]
            default: name
      responses:
        '200':
          description: OK
          headers:
            Cache-Control:
              schema:
                type: string
              example: no-store, private
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DirectoryPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: |-
            Chưa đăng nhập. **Không** trả `200` kèm mảng rỗng — xem mô tả operation, ràng buộc 4.
            / Unauthenticated; never an empty list.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # ---------------------------------------------------------------------------
  # CỔNG THÔNG TIN CÔNG KHAI / PUBLIC PORTAL
  #
  # Không cần token. CHỈ trả dữ liệu người đã khuất (BA v2 §10).
  # Người còn sống không xuất hiện ở bất kỳ endpoint nào dưới đây — kể cả tên,
  # kể cả dưới dạng node ẩn danh, kể cả trong một phép đếm.
  # No token. Deceased persons only; living persons never appear, not even as a count.
  # ---------------------------------------------------------------------------
  /public/persons/{id}:
    get:
      tags: [public]
      operationId: getPublicPerson
      summary: Hồ sơ một người đã khuất (công khai) / Public profile of a deceased person
      description: |-
        Hồ sơ **người đã khuất** cho Khách vãng lai. Đây là endpoint làm cho nửa "cổng thông tin
        dòng họ" của sản phẩm mở ra: BA v2 §10 nói người đã khuất là dữ liệu công khai **kể cả với
        Khách**.

        **Hỏi một người còn sống sẽ nhận `404`** — không phải `403`, và `404` ấy **không phân biệt
        được** với `404` của một id bịa đặt (cùng `code`, cùng `title`). Trả `403` là tự xác nhận
        người đó tồn tại.

        Phản hồi **giống hệt nhau với mọi người gọi**: gửi kèm token cũng không mở thêm trường nào,
        vì bề mặt này bị ép chạy ở ngữ cảnh Khách. Đó là lý do nó được phép mang
        `Cache-Control: public`. Thành viên muốn xem đầy đủ thì dùng `GET /persons/{id}`.

        `PublicPersonDto` **hẹp hơn** `PersonDto` một cách có chủ ý — không có `contact`,
        `occupation`, `currentPlaceFull`, `attributes`, `privacy`, `version`, `access`.
        Số điện thoại ghi trong hồ sơ một cụ đã mất trên thực tế là số của người thân **đang sống**.
      security:
        - {}
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
        - $ref: '#/components/parameters/PersonId'
      responses:
        '200':
          description: OK
          headers:
            Cache-Control:
              schema:
                type: string
              description: '`public, max-age=300` — phản hồi giống nhau với mọi người gọi.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicPersonDto'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /public/persons/search:
    get:
      tags: [public]
      operationId: searchPublicPersons
      summary: Tìm kiếm công khai (chỉ người đã khuất) / Public search, deceased only
      description: |-
        Tìm theo tên, **có dấu hoặc không dấu** (FR-4.4), trên mọi lớp tên (húy / tự / hiệu / thụy /
        thường gọi / pháp danh).

        Đây là **lối liệt kê duy nhất** của cổng công khai nên nó bị siết chặt nhất:

        * `isAlive = false` bị **ghim cứng** ở phía server, không phải tham số — người còn sống bị
          loại ngay trong câu SQL. Client cũng vì thế không hỏi được `isAlive=true` để đo xem dòng
          họ có bao nhiêu người sống.
        * **Không trả `totalElements`/`totalPages`**: đó là một phép đếm dân số dòng họ. Phân trang
          bằng `page.hasNext`.
        * **Chặn phân trang sâu**: quá `page = 4` là `400`.
        * Từ khoá tối thiểu **2 ký tự**; một ký tự là phép liệt kê trá hình.
        * Không có `sort`, không có `includeDeleted`, không có `branchId`.

        Lượt gọi này **tốn hạn mức gấp 5 lần** một lượt xem hồ sơ — xem `429`.
      security:
        - {}
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
        - name: q
          in: query
          required: true
          description: Chuỗi tìm kiếm, có dấu hoặc không dấu. / Query string, accented or not.
          schema:
            type: string
            minLength: 2
            maxLength: 100
          example: nguyen phuc thuy to
        - name: generation
          in: query
          description: Lọc theo đời thứ (Thủy tổ = 1). / Filter by generation.
          schema:
            type: integer
            minimum: 1
        - name: page
          in: query
          description: |-
            Số trang, bắt đầu từ 0. **Trần là 4** — cổng công khai không cho lật trang tới khi
            hết dòng họ. / Zero-based, capped at 4.
          schema:
            type: integer
            minimum: 0
            maximum: 4
            default: 0
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicPersonSummaryPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /public/tree:
    get:
      tags: [public]
      operationId: getPublicTreeProjection
      summary: Phả đồ công khai (chỉ người đã khuất) / Public tree projection, deceased only
      description: |-
        Projection phẳng (`nodes[]` + `edges[]`) như `/tree`, nhưng **chỉ gồm người đã khuất**.

        ### Cây của Khách là cây CÓ LỖ — quyết định thiết kế, không phải khiếm khuyết

        Người còn sống bị bỏ hẳn cùng **mọi cạnh chạm vào họ**. Một người cháu đã khuất có cha còn
        sống sẽ xuất hiện **đúng đời của mình** nhưng với `parentIds` **rỗng**, và phả đồ công khai
        có thể gồm nhiều mảnh rời. FE **phải** vẽ được cây nhiều mảnh; cạnh thiếu ở đây không phải
        lỗi dữ liệu.

        Hai cách vá đã bị loại bỏ có cân nhắc:

        * **Node ẩn danh** ("một người còn sống") — vẫn tiết lộ có bao nhiêu người sống và họ đứng ở
          đâu trong phả hệ. BA v2 §10 nói Khách **không thấy gì**, kể cả một node ẩn danh.
        * **Nối tắt** cụ với cháu qua đời bị giấu — bịa ra một quan hệ cha–con không có thật; với
          một cuốn gia phả thì đó là làm sai phả hệ, tệ hơn cả thiếu.

        `meta.guestFiltered` luôn `true` để FE hiện một câu giải thích chung. Nó là **hằng số**,
        không phải phép đếm, nên không nói gì về số người bị ẩn.

        ### Trần thấp hơn hẳn bản thành viên

        `depth` tối đa **4** (bản thành viên là 10) và server cắt ở **200 node** (bản thành viên là
        2000). Không có `maxNodes`, không có `includeDeleted`. Vượt `depth` là `400` chứ không âm
        thầm cắt bớt.

        `node.expandable` thay cho `hasMoreDescendants`/`descendantCount`: số con thật **đếm cả
        người còn sống**, để lộ ra là gián tiếp nói "cụ này còn mấy người con mà bạn không được
        thấy". `expandable` chỉ suy ra từ chính tham số yêu cầu (node nằm ở rìa độ sâu) nên có thể
        `true` ở một node thực ra không còn con — bấm mở rộng chỉ tốn một lượt gọi trả về rỗng.
      security:
        - {}
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
        - name: rootId
          in: query
          required: false
          description: |-
            Gốc của nhánh cần lấy. **Tuỳ chọn** — thiếu nó, cổng công khai mở ra **Thuỷ tổ**
            (nhân khẩu đời nhỏ nhất, đã khuất).

            Trước đây tham số này bắt buộc, với lý do "không có endpoint liệt kê gốc". Lý do ấy làm
            trang phả đồ công khai — cửa vào của cả nửa *cổng thông tin dòng họ* — trả `400` cho mọi
            Khách, trong khi thứ duy nhất nó giấu là **một** định danh của **một** người đã khuất,
            vốn đã tra ra được bằng `/public/persons/search`. Chi phí quét cả phả không đổi: hai cái
            trần (`depth` ≤ 4, 200 node) và hạn mức theo IP vẫn tính tiền từng lượt gọi y như cũ.

            Gốc mặc định ở đây **không phụ thuộc token**: một thành viên lỡ mang `Authorization` tới
            cổng công khai vẫn nhận đúng cây của Khách, nếu không thì `Cache-Control: public` trên
            chính nó trở thành lỗ rò rỉ.
          schema:
            type: string
            format: uuid
        - name: depth
          in: query
          description: Số đời cần lấy. Trần công khai là 4. / Generations to fetch, capped at 4.
          schema:
            type: integer
            minimum: 0
            maximum: 4
            default: 3
        - name: direction
          in: query
          schema:
            $ref: '#/components/schemas/TreeDirection'
        - name: includeSpouses
          in: query
          description: |-
            Kèm vợ/chồng. Với Khách thì chỉ vợ/chồng **đã khuất** hiện ra, như mọi node khác.
          schema:
            type: boolean
            default: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicTreeProjection'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          description: |-
            Không có nhánh nào để trả — gốc không tồn tại, đã bị xóa mềm, **hoặc là người còn
            sống**. Ba trường hợp trả về **cùng một** phản hồi, có chủ ý.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # ---------------------------------------------------------------------------
  # DANH XƯNG / KINSHIP
  # ---------------------------------------------------------------------------
  /kinship:
    get:
      tags: [kinship]
      operationId: resolveKinship
      summary: Tra cứu danh xưng giữa hai người / Resolve the kinship title between two persons
      description: |-
        Trả **danh xưng** mà người `from` gọi người `to`, kèm **đường quan hệ** đi qua tổ chung gần nhất
        (LCA — Lowest Common Ancestor) để người dùng tự kiểm chứng.

        Luồng (TDD §8.2): LCA bằng Cypher trên AGE → tính `RelationFacts`
        (`genDelta`, `side` nội/ngoại, `gender`, `isElder`) → hợp nhất bộ quy tắc
        `DEFAULT → REGION → CLAN → BRANCH` → khớp luật → cache Redis theo khóa `from:to`.

        **Danh xưng đến từ dữ liệu `kinship_rule_set`, không hard-code** (FR-1.3a).
        Kết quả vì thế phụ thuộc bộ luật đang hiệu lực; `ruleSetId`/`ruleId` trong phản hồi cho biết
        luật nào đã khớp, dùng để truy vết khi dòng họ khiếu nại danh xưng sai.

        **Không tìm được vẫn trả `200`**, phân biệt bằng `status`:

        * `RESOLVED` — có `title`.
        * `NO_COMMON_ANCESTOR` — hai người không cùng huyết thống trong dữ liệu hiện có
          (có thể vẫn nối nhau qua hôn nhân — xem `path`).
        * `NO_MATCHING_RULE` — tìm được LCA nhưng bộ luật chưa có luật phủ trường hợp này;
          `title` vắng mặt, `facts` vẫn trả để Hội đồng bổ sung luật.
        * `SELF` — `from` trùng `to`.

        FE **không** được coi `title` vắng mặt là lỗi hệ thống; hiện thông điệp theo `status`.

        Người còn sống bị ẩn theo phân tầng vẫn có thể nằm trên đường quan hệ; khi đó phần tử tương ứng
        trong `path` chỉ có `personId` và `displayName` bị thay bằng nhãn chung (`"—"`).
        Khách gọi endpoint này với bất kỳ người còn sống nào sẽ nhận `404`.
      security:
        - bearerAuth: []
        - {}
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
        - name: from
          in: query
          required: true
          description: Người **xưng hô** (chủ ngữ) — "A gọi B là gì?". / The addressing person.
          schema:
            type: string
            format: uuid
        - name: to
          in: query
          required: true
          description: Người **được gọi** (tân ngữ). / The addressed person.
          schema:
            type: string
            format: uuid
        - name: includePath
          in: query
          description: Có trả `path` (đường quan hệ qua LCA) hay không. / Include the relation path.
          schema:
            type: boolean
            default: true
        - name: ruleSetId
          in: query
          description: |-
            Ép dùng một bộ luật cụ thể thay vì bộ luật hiệu lực của chi người `from`.
            Dùng cho màn hình thử nghiệm luật của Hội đồng Tộc biểu. Chỉ `COUNCIL`/`ADMIN`.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KinshipResult'
              examples:
                bacHo:
                  summary: Danh xưng bên nội, vai trên
                  value:
                    status: RESOLVED
                    fromPersonId: 11111111-1111-4111-8111-111111111111
                    toPersonId: 22222222-2222-4222-8222-222222222222
                    title: Bác họ
                    reciprocalTitle: Cháu
                    facts:
                      genDelta: 1
                      side: PATERNAL
                      targetGender: MALE
                      isElder: true
                      throughMarriage: false
                    lca:
                      personId: 33333333-3333-4333-8333-333333333333
                      displayName: Nguyễn Văn Đức
                      generation: 3
                      distanceFrom: 3
                      distanceTo: 2
                    ruleSetId: 44444444-4444-4444-8444-444444444444
                    ruleSetScope: BRANCH
                    ruleId: 55555555-5555-4555-8555-555555555555
                    ruleSetChain: [DEFAULT, REGION, BRANCH]
                    cached: false
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /kinship-rules:
    get:
      tags: [kinship]
      operationId: getKinshipRules
      summary: Đọc bộ quy tắc danh xưng / Read kinship rule sets
      description: |-
        Đọc các bộ quy tắc danh xưng (`kinship_rule_set` + `kinship_rule`).

        Hai chế độ:

        * `effective = false` (mặc định) — trả **từng bộ luật thô** đúng như đã lưu, kèm `parentRuleSetId`.
          Dùng cho màn hình quản trị khi Hội đồng sửa đúng một cấp.
        * `effective = true` — trả **một bộ luật đã hợp nhất** theo thứ tự
          `DEFAULT → REGION → CLAN → BRANCH`, mỗi luật kèm `inheritedFromScope` và `overridden`
          để giao diện tô màu luật nào bị chi ghi đè. Bắt buộc kèm `branchId`.

        Bộ `DEFAULT` của hệ thống là **miền Bắc** (quyết định đã chốt, plan §1).
        `REGION` cho Trung và Nam để trống ở Giai đoạn 1.

        **Quyền đọc**: mọi thành viên đã đăng nhập (`MEMBER`+). Khách nhận `401`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
        - name: scope
          in: query
          description: Lọc theo cấp áp dụng. / Filter by scope level.
          schema:
            $ref: '#/components/schemas/RuleScope'
        - name: region
          in: query
          description: Lọc bộ luật cấp vùng. / Filter region-scoped sets.
          schema:
            $ref: '#/components/schemas/Region'
        - name: branchId
          in: query
          description: Chi/ngành cần tra. Bắt buộc khi `effective=true`. / Branch, required if effective.
          schema:
            type: string
            format: uuid
        - name: effective
          in: query
          description: Trả bộ luật đã hợp nhất thay vì các bộ luật thô. / Return the merged set.
          schema:
            type: boolean
            default: false
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: |-
            Trả `KinshipRuleSetPage` khi `effective=false`, hoặc `EffectiveKinshipRuleSet`
            khi `effective=true`.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/KinshipRuleSetPage'
                  - $ref: '#/components/schemas/EffectiveKinshipRuleSet'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
    put:
      tags: [kinship]
      operationId: replaceKinshipRuleSet
      summary: Ghi đè một bộ quy tắc danh xưng / Replace a kinship rule set
      description: |-
        **Chỉ Hội đồng Tộc biểu (`COUNCIL`) và `ADMIN`.** `BRANCH_HEAD`, `MEMBER`, Khách → `403`.
        Danh xưng sai là lỗi mất mặt với dòng họ, nên quyền sửa để hẹp là có chủ ý.

        Ngữ nghĩa **replace toàn bộ một bộ luật**, không phải patch từng luật: mảng `rules` gửi lên
        thay thế trọn vẹn danh sách luật hiện có của bộ đó. Muốn xóa một luật thì gửi danh sách
        thiếu luật đó. Điều này giữ cho việc "bộ luật đang hiệu lực là gì" luôn xác định được.

        * Tạo mới bộ luật: bỏ trống `ruleSetId`, khai báo `scope` (+ `region`/`clanId`/`branchId` tương ứng).
        * Sửa bộ luật có sẵn: gửi `ruleSetId` và `expectedVersion` lấy từ `GET`
          (sai phiên bản ⇒ `409 OPTIMISTIC_LOCK_CONFLICT`).
        * **Không được sửa bộ `DEFAULT` của hệ thống** ⇒ `403 SYSTEM_RULE_SET_IMMUTABLE`.
          Muốn khác đi thì tạo bộ ghi đè ở cấp `CLAN`/`BRANCH`.

        Mọi thay đổi được ghi `audit_log` (before/after toàn bộ bộ luật) và **xóa cache danh xưng**
        ở Redis cho các chi bị ảnh hưởng.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KinshipRuleSetUpdateRequest'
      responses:
        '200':
          description: Đã ghi đè bộ luật. / Rule set replaced.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KinshipRuleSetDto'
        '201':
          description: Đã tạo bộ luật mới. / New rule set created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KinshipRuleSetDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: |-
            * `OPTIMISTIC_LOCK_CONFLICT` — `expectedVersion` không khớp.
            * `RULE_SET_CYCLE` — `parentRuleSetId` tạo vòng kế thừa.
            * `DUPLICATE_RULE` — hai luật trùng khóa `(genDelta, side, gender, isElder)` cùng `priority`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ConflictProblem'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # ---------------------------------------------------------------------------
  # ĐÍNH CHÍNH / CHANGE REQUESTS
  #
  # Duyệt một đề nghị UPDATE_PERSON nay GHI THẬT vào phả (trước đây duyệt xong
  # không đổi gì). Vì thế payload hết "dạng tự do" và phải mang mốc phiên bản.
  # Approving an UPDATE_PERSON request now really writes to the tree.
  # ---------------------------------------------------------------------------
  /change-requests:
    post:
      tags: [change-requests]
      operationId: submitChangeRequest
      summary: Gửi yêu cầu đính chính / Submit a correction request
      description: |-
        Mọi thành viên đã có tài khoản đều gửi được; **không** kiểm phạm vi chi/ngành ở bước này —
        phạm vi được kiểm lúc **duyệt**, theo chi đích của yêu cầu.

        ### `payload` hết "dạng tự do" (thay đổi phá vỡ)

        Với `requestType = UPDATE_PERSON`, khoá của `payload` phải nằm trong **đúng sáu trường**
        `death · birth · nativePlace · occupation · currentPlaceProvince · gender` — cùng danh sách
        mà FE đã chốt ở `correctable-fields.ts`. Ít nhất **một** trường. Vi phạm ⇒
        `422 VALIDATION_FAILED`, và phép kiểm chạy **ngay lúc gửi**, không phải lúc duyệt: trước đây
        một đề nghị sai khoá nằm im trong hàng đợi cả tuần rồi Trưởng chi mới phát hiện, lúc ấy
        người gửi đã quên mình gõ gì.

        `null` ở một trường là hợp lệ và có nghĩa **xoá trắng** — "bỏ ngày mất ghi nhầm" là một
        đính chính hoàn toàn bình thường.

        Việc ngoài sáu trường (đổi tên húy/tự/hiệu, sửa quan hệ cha–con, chuyển chi) gửi bằng
        `requestType = OTHER`: mô tả bằng lời cho Trưởng chi đọc và tự thao tác. Payload của các
        loại **chưa có bộ áp dụng tự động** không bị kiểm hợp đồng.

        ### `_baseVersion` — khoá điều khiển

        Đề nghị nằm chờ hàng tuần rồi mới được áp dụng. Không có mốc phiên bản thì lệnh ghi lúc
        duyệt là một cú **ghi đè mù** lên mọi thay đổi đã xảy ra trong lúc chờ.

        * **Optional trên request**, **luôn có mặt trên response**: thiếu thì backend đọc
          `person.version` ngay lúc gửi và đóng dấu vào.
        * Giá trị client gửi **luôn thắng** giá trị backend tự đọc — nó là phiên bản người dùng
          thật sự nhìn thấy trên màn hình. Lấy từ `ETag` của lần `GET /persons/{id}` gần nhất.
        * Không đọc được `person.version` mà client cũng không gửi ⇒ `422`.
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitChangeRequest'
      responses:
        '201':
          description: Đã tạo, trạng thái `PENDING`. / Created, pending review.
          headers:
            Location:
              schema:
                type: string
              description: '`/api/v1/change-requests/{id}`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangeRequestDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /change-requests/mine:
    get:
      tags: [change-requests]
      operationId: listMyChangeRequests
      summary: Yêu cầu tôi đã gửi / My correction requests
      description: |-
        Đề nghị của **chính người gọi**, mọi trạng thái.

        > **Lệch quy ước phân trang:** endpoint này trả một **mảng phẳng**, không phải bọc
        > `{ items, page }`. Đó là hình dạng hiện tại của backend chứ không phải chủ ý thiết kế;
        > ghi ra đây để FE không dựng nhầm. / Returns a bare array, not the `{items, page}` envelope.
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ChangeRequestDto'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /change-requests/pending:
    get:
      tags: [change-requests]
      operationId: listPendingChangeRequests
      summary: Hàng đợi chờ duyệt trong phạm vi được giao / Pending queue within assigned scope
      description: |-
        Chỉ những đề nghị mà người gọi **được quyền duyệt**, xét theo `ltree` của chi đích.

        **Trưởng chi chưa có phân công nào nhận danh sách rỗng** — không phải danh sách đầy đủ.
        Phạm vi rỗng nghĩa là không có phạm vi nào, tuyệt đối không phải toàn quyền.

        Cùng lệch quy ước phân trang như `/change-requests/mine`: trả mảng phẳng.
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ChangeRequestDto'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /change-requests/pending/count:
    get:
      tags: [change-requests]
      operationId: countPendingChangeRequests
      summary: Đếm yêu cầu chờ duyệt trong phạm vi / Count pending requests in scope
      description: Dữ liệu cho badge trên chuông thông báo. / Feeds the notification-bell badge.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [count]
                properties:
                  count:
                    type: integer
                    format: int64
                    minimum: 0
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /change-requests/{id}:
    get:
      tags: [change-requests]
      operationId: getChangeRequest
      summary: Chi tiết một yêu cầu / Correction request detail
      description: |-
        `payload` **chỉ hiện với người gửi và người được quyền duyệt** — nó có thể chứa dữ liệu
        Tầng 3 của một người còn sống. Ngoài hai vai đó, `payload` là object rỗng và chỉ còn
        `payloadFields` để biết đề nghị động tới trường nào.
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangeRequestDto'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags: [change-requests]
      operationId: cancelChangeRequest
      summary: Rút lại yêu cầu của chính mình / Withdraw own request
      description: |-
        **Không phải xoá** — bản ghi chuyển sang `CANCELLED` và vẫn nằm trong lịch sử. Chỉ người
        gửi rút được, và chỉ khi yêu cầu còn `PENDING`.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Đã rút lại. / Withdrawn.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangeRequestDto'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /change-requests/{id}/review:
    post:
      tags: [change-requests]
      operationId: reviewChangeRequest
      summary: Duyệt hoặc từ chối / Approve or reject
      description: |-
        ### Duyệt nay GHI THẬT vào phả

        Với `requestType = UPDATE_PERSON`, một lượt duyệt thành công **áp dụng ngay** thay đổi lên
        hồ sơ nhân khẩu, dùng `_baseVersion` của payload làm `expectedVersion`. Trước đây duyệt xong
        không đổi gì và Trưởng chi phải tự sửa tay.

        Các loại **chưa có bộ áp dụng tự động** (`OTHER`, `ADD_RELATIONSHIP`, `MOVE_BRANCH`…) vẫn
        chỉ chuyển trạng thái; Trưởng chi tự thao tác trên hồ sơ.

        ### Ba mã lỗi mới — cả ba đều ROLLBACK về `PENDING`

        | Mã | Nghĩa | Thông điệp FE nên hiện |
        |---|---|---|
        | `409 OPTIMISTIC_LOCK_CONFLICT` | Hồ sơ đã đổi kể từ lúc người gửi nhìn thấy nó | *"Đề nghị dựa trên bản cũ, tải lại rồi quyết lại"* |
        | `409 PERSON_ALREADY_DELETED` | Nhân khẩu đích đã bị xoá mềm | *"Khôi phục bản ghi trước, hoặc từ chối đề nghị"* |
        | `422 VALIDATION_FAILED` | Payload không áp dụng được (yêu cầu tồn đọng từ trước khi có hợp đồng) | Nêu rõ trường sai |

        **Yêu cầu quay lại `PENDING`, không bị đóng** — nên duyệt lại được sau khi xử lý nguyên
        nhân. Đừng hiển thị một lỗi cụt rồi bỏ mặc: người duyệt cần biết mình phải làm gì tiếp.

        Lưu ý về `OPTIMISTIC_LOCK_CONFLICT`: sau khi **một** đề nghị được áp dụng thành công,
        `person.version` nhích lên, nên mọi đề nghị khác đang chờ trên cùng hồ sơ sẽ lệch
        `_baseVersion` và bị chặn. Đó là **chủ ý** — người duyệt đọc lại rồi quyết từng cái, thay vì
        để chúng lặng lẽ đè lên nhau theo thứ tự bấm nút.

        ### Kiểm quyền

        Sai vai ⇒ `403 FORBIDDEN`. Đúng vai nhưng đối tượng ngoài chi được giao ⇒
        `403 BRANCH_SCOPE_VIOLATION` — hai mã khác nhau vì dẫn tới hai hành động khác nhau của người
        dùng. Tự duyệt đề nghị của chính mình ⇒ `403 SELF_REVIEW_FORBIDDEN`. Yêu cầu đã chốt ⇒
        `422 CHANGE_REQUEST_CLOSED`.
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewChangeRequest'
      responses:
        '200':
          description: Đã duyệt hoặc đã từ chối. / Approved or rejected.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangeRequestDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |-
            `OPTIMISTIC_LOCK_CONFLICT` hoặc `PERSON_ALREADY_DELETED`. Yêu cầu đã **rollback về
            `PENDING`** và duyệt lại được.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ConflictProblem'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # ---------------------------------------------------------------------------
  # SỰ KIỆN / EVENTS
  # ---------------------------------------------------------------------------
  /events:
    get:
      tags: [events]
      operationId: listEvents
      summary: Danh sách giỗ, chạp, lễ dòng họ / List ancestral events
      description: |-
        Liệt kê sự kiện dòng họ: giỗ tổ, giỗ họ, giỗ chi, giỗ thường, tiểu tường, đại tường,
        chạp mả, mừng thọ (FR-2.3).

        **Ngày âm là gốc.** `lunarDate` là dữ liệu được lưu; `nextOccurrenceSolar` là ngày **dương**
        của lần giỗ sắp tới, do backend quy đổi bằng thuật toán Hồ Ngọc Đức ở GMT+7 (có xử lý
        tháng nhuận). FE **không được** tự quy đổi âm–dương ở client — lệch tháng nhuận là bug
        âm thầm nhất của hệ thống này.

        Lọc theo khoảng ngày dùng `from`/`to` trên **ngày dương của lần xảy ra sắp tới**,
        vì đó là thứ người dùng nhìn trên lịch.

        Sự kiện gắn với người còn sống (ví dụ mừng thọ) tuân thủ phân tầng: Khách không thấy.
      security:
        - bearerAuth: []
        - {}
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
        - name: from
          in: query
          description: Ngày dương bắt đầu khoảng lọc (bao gồm). / Solar range start, inclusive.
          schema:
            type: string
            format: date
        - name: to
          in: query
          description: Ngày dương kết thúc khoảng lọc (bao gồm). / Solar range end, inclusive.
          schema:
            type: string
            format: date
        - name: upcomingDays
          in: query
          description: |-
            Đường tắt thay cho `from`/`to`: lấy sự kiện trong N ngày tới kể từ hôm nay (GMT+7).
            Nếu gửi cùng `from`/`to` thì `from`/`to` thắng.
          schema:
            type: integer
            minimum: 1
            maximum: 400
        - name: eventType
          in: query
          description: Lọc theo loại lễ (có thể lặp lại). / Filter by event type, repeatable.
          schema:
            type: array
            items:
              $ref: '#/components/schemas/EventType'
          style: form
          explode: true
        - name: branchId
          in: query
          description: |-
            Lọc theo chi/ngành nhận nhắc, bao gồm cả nhánh con (`ltree`).
            Sự kiện cấp dòng họ (`isClanLevel = true`) luôn xuất hiện với mọi `branchId`.
          schema:
            type: string
            format: uuid
        - name: personId
          in: query
          description: Lọc sự kiện của một nhân khẩu. / Filter by the subject person.
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - name: sort
          in: query
          description: '`field,asc|desc`. Cho phép `nextOccurrenceSolar`, `eventType`. Mặc định `nextOccurrenceSolar,asc`.'
          schema:
            type: string
            default: nextOccurrenceSolar,asc
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /events/{id}:
    get:
      tags: [events]
      operationId: getEvent
      summary: Chi tiết một sự kiện / Event detail
      description: |-
        Chi tiết một giỗ/lễ. Đây là **điểm đến của `deepLink`** trong thông báo nhắc giỗ
        (`/events/{id}`) — không có endpoint này thì bấm vào thông báo là rơi vào trang trắng.

        `nextOccurrenceSolar` là ngày **dương** của lần xảy ra sắp tới, do backend quy đổi
        (Hồ Ngọc Đức, GMT+7). Nếu sự kiện không còn lần nào ở phía trước (sự kiện một lần đã diễn
        ra) thì `nextOccurrenceSolar`, `nextOccurrenceLunarYear` và `daysUntil` đều là `null` —
        backend **không** trả một ngày trong quá khứ rồi gọi nó là "sắp tới".

        Sự kiện đã xóa mềm, và sự kiện gắn với người **còn sống** khi người gọi là Khách,
        đều trả `404` — không phải `403`, vì `403` đã xác nhận rằng id đó tồn tại.

        > **Giai đoạn 1:** chuỗi bảo mật bắt buộc đăng nhập cho mọi `/api/v1/**` ngoài
        > `/api/v1/public/**`, nên khách vãng lai nhận `401` trước khi luật phân tầng kịp chạy.
        > Luật "Khách không thấy người còn sống" vẫn được cài đặt ở tầng ứng dụng và sẽ có hiệu lực
        > ngay khi cổng thông tin công khai mở endpoint này.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
        - name: id
          in: path
          required: true
          description: Id sự kiện. / Event id.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventDto'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # ---------------------------------------------------------------------------
  # THÔNG BÁO / NOTIFICATIONS
  # ---------------------------------------------------------------------------
  /notifications:
    get:
      tags: [notifications]
      operationId: listNotifications
      summary: Hộp thư thông báo in-app / In-app notification inbox
      description: |-
        Hộp thư in-app của **chính người đang đăng nhập** (suy từ JWT — không có tham số `userId`,
        và cũng sẽ không có: hộp thư người khác không phải thứ để lộ qua tham số).

        In-app là **nguồn chân lý** của kênh thông báo MVP: người dùng từ chối quyền Web Push
        vẫn nhận đủ thông báo ở đây. Web Push chỉ là lớp đẩy thêm ra ngoài.

        `unreadCount` nằm ở **cấp phản hồi**, không phải trong `page`, và luôn là **tổng số chưa đọc
        của toàn hộp thư**, không phụ thuộc bộ lọc hay trang hiện tại — FE dùng nó cho badge chuông.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
        - name: status
          in: query
          description: |-
            * `ALL` — tất cả (mặc định).
            * `UNREAD` — chỉ chưa đọc.
            * `READ` — chỉ đã đọc.
          schema:
            type: string
            enum: [ALL, UNREAD, READ]
            default: ALL
        - name: category
          in: query
          description: Lọc theo loại thông báo. / Filter by category.
          schema:
            $ref: '#/components/schemas/NotificationCategory'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - name: sort
          in: query
          description: '`field,asc|desc`. Cho phép `createdAt`. Mặc định `createdAt,desc`.'
          schema:
            type: string
            default: createdAt,desc
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /notifications/{id}/read:
    post:
      tags: [notifications]
      operationId: markNotificationRead
      summary: Đánh dấu đã đọc / Mark a notification as read
      description: |-
        Đánh dấu một thông báo trong hộp thư của **chính mình** là đã đọc.

        **Idempotent**: gọi lại trên thông báo đã đọc vẫn trả `200` với `readAt` **giữ nguyên lần đầu**,
        không cập nhật lại. FE cứ gọi thoải mái, không cần kiểm tra trạng thái trước.

        Trả kèm `unreadCount` mới để FE cập nhật badge ngay, khỏi phải gọi lại `/notifications`.

        Thông báo của người khác ⇒ `404` (không phải `403`, để không lộ id có tồn tại).
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Id thông báo trong hộp thư. / Notification id.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationReadResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /notifications/read-all:
    post:
      tags: [notifications]
      operationId: markAllNotificationsRead
      summary: Đánh dấu đã đọc tất cả / Mark the whole inbox as read
      description: |-
        Đánh dấu **toàn bộ** hộp thư của **chính người đang đăng nhập** là đã đọc — nút "Đọc hết"
        của trung tâm thông báo.

        **Idempotent**: gọi lại khi hộp thư đã sạch trả `200` với `markedCount = 0`, không phải lỗi.

        Cố ý **không có** tham số phạm vi (danh mục, khoảng thời gian): một nút "đọc hết" chỉ xử lý
        một phần là nút mà không ai đoán được nó vừa làm gì.

        Đường dẫn là `/read-all` chứ không phải `/{id}/read` với một id đặc biệt như `all` —
        một id ma trong đường dẫn tài nguyên sớm muộn cũng va vào một UUID thật.

        `unreadCount` trả kèm để FE cập nhật badge chuông ngay, khỏi phải gọi lại `/notifications`.
        Nó được **đọc lại từ cơ sở dữ liệu** chứ không suy ra bằng 0: một thông báo mới có thể vừa
        rơi vào hộp thư giữa hai câu lệnh.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationReadAllResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # ---------------------------------------------------------------------------
  # WEB PUSH (VAPID)
  # ---------------------------------------------------------------------------
  /push/public-key:
    get:
      tags: [push]
      operationId: getVapidPublicKey
      summary: Khóa công khai VAPID / VAPID public key
      description: |-
        Trả **khóa công khai VAPID** dạng base64url không padding, để service worker truyền vào
        `PushManager.subscribe({ applicationServerKey })`.

        Không có endpoint này thì FE buộc phải nhúng cứng khóa vào build — đổi khóa là phải build lại,
        và môi trường dev/staging/prod dùng khóa khác nhau sẽ lệch. **Khóa bí mật VAPID không bao giờ
        rời server** và không xuất hiện ở bất kỳ phản hồi nào.
      security:
        - bearerAuth: []
        - {}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VapidPublicKey'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /push/subscriptions:
    post:
      tags: [push]
      operationId: registerPushSubscription
      summary: Đăng ký thiết bị nhận Web Push / Register a Web Push subscription
      description: |-
        Đăng ký một `PushSubscription` chuẩn **VAPID / Web Push (RFC 8291)** cho người đang đăng nhập.
        Body chính là kết quả `PushSubscription.toJSON()` của trình duyệt, cộng vài trường phụ trợ.

        **Idempotent theo `endpoint`**: gửi lại cùng `endpoint` sẽ **cập nhật** bản ghi cũ và trả `200`
        (không phải `201`, không tạo bản trùng). Mỗi người có thể có nhiều thiết bị.

        **Ghi chú nền tảng (FE phải xử lý, đừng để im lặng thất bại):**

        * iOS chỉ cho Web Push khi PWA **đã được cài vào màn hình chính** (iOS 16.4+). App cần
          hướng dẫn "Thêm vào màn hình chính", nếu không phần lớn người dùng iPhone sẽ không bao giờ nhận push.
        * Xin quyền **đúng lúc** (sau khi người dùng xem một hồ sơ hoặc một ngày giỗ), không phải ngay khi vào trang.
        * Người từ chối quyền vẫn nhận đủ thông báo in-app — push không phải điều kiện tiên quyết.

        Khi push gateway trả `404`/`410` (subscription bị thu hồi hoặc hết hạn), backend **tự xóa**
        bản ghi và không retry. FE có thể thấy một subscription biến mất mà không do mình gọi `DELETE`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PushSubscriptionCreateRequest'
      responses:
        '201':
          description: Đã đăng ký thiết bị mới. / New subscription registered.
          headers:
            Location:
              schema:
                type: string
                format: uri-reference
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PushSubscriptionDto'
        '200':
          description: Đã cập nhật đăng ký sẵn có cùng `endpoint`. / Existing subscription updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PushSubscriptionDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /push/subscriptions/{id}:
    delete:
      tags: [push]
      operationId: deletePushSubscription
      summary: Hủy đăng ký Web Push / Remove a Web Push subscription
      description: |-
        Xóa một đăng ký push của **chính mình** (người dùng tắt công tắc trong phần cài đặt,
        hoặc gọi `pushSubscription.unsubscribe()`).

        Đây là **xóa cứng** — quy tắc "chỉ xóa mềm" áp cho nhân khẩu trong gia phả, không áp cho
        dữ liệu kỹ thuật của thiết bị.

        Đăng ký không tồn tại hoặc thuộc người khác ⇒ `404`.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Id bản ghi đăng ký (không phải `endpoint`). / Subscription record id.
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Đã hủy đăng ký. / Subscription removed.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # ---------------------------------------------------------------------------
  # VẬN HÀNH NHẮC GIỖ / REMINDER PIPELINE OPERATIONS (System Admin)
  # ---------------------------------------------------------------------------
  /admin/reminders/generate:
    post:
      tags: [admin-reminders]
      operationId: generateReminders
      summary: Sinh lịch nhắc giỗ ngay / Generate reminder jobs now
      description: |-
        Chạy ngay job sinh `reminder_job` thay vì chờ scheduler 01:30 (GMT+7).

        **Vì sao có endpoint này.** Trên môi trường demo/staging vốn được dựng lên rồi tắt trong
        ngày, bảng `reminder_job` luôn rỗng và cả đường ống nhắc giỗ không trình diễn được
        đầu-cuối. Bấm nút vẫn tốt hơn sửa cron thành mỗi phút rồi quên trả lại.

        **Idempotent.** Gọi lại với cùng `referenceDate` trả `200` và `createdJobs = 0`; chống
        trùng do chỉ mục duy nhất `ux_reminder_job_occurrence (event_id, occurrence_year,
        offset_days)` bảo đảm — không phải do một phép kiểm tra ở tầng ứng dụng. `scannedEvents`
        vẫn giữ nguyên, nhờ đó phân biệt được "job đã có sẵn từ lượt trước" với "không có sự kiện
        nào để quét".

        **`referenceDate` đổi luôn cả mốc "bây giờ"** thành 00:00 của chính ngày đó. Nếu giữ thời
        điểm thật thì mọi mốc nhắc nằm trước hiện tại sẽ bị loại, và tham số coi như vô dụng đúng ở
        trường hợp cần nó nhất: dựng lại cả ba mốc **7 / 3 / 1** để xem chúng chạy thật.

        **Hệ quả phải biết trước:** `referenceDate` trong quá khứ sinh ra job có `fire_at` đã qua,
        và lượt đẩy kế tiếp (5 phút một lần, hoặc `POST /admin/reminders/dispatch`) sẽ **gửi thật**
        tới người trong họ. Đó là lý do endpoint này chỉ dành cho System Admin.

        Chỉ vai **System Admin** (`ADMIN`) — vai kỹ thuật toàn hệ thống, không phải chức danh dòng
        tộc. Cố ý không mở cho Hội đồng Tộc biểu: hội đồng là thẩm quyền *nội dung* của dòng họ,
        đây là bề mặt *vận hành*. Cũng không có phạm vi chi/ngành: job quét toàn bộ dòng họ nên
        không có `ltree` nào để giới hạn nó.
      security:
        - bearerAuth: []
      parameters:
        - name: referenceDate
          in: query
          description: |-
            Ngày được coi là "hôm nay" (GMT+7). Mặc định là hôm nay.
            Chỉ chấp nhận lệch tối đa **366 ngày** về mỗi phía: gõ nhầm năm mà không có chốt này
            thì job sẽ quét toàn bộ sự kiện của dòng họ để sinh lịch nhắc cho một mốc chẳng ai dùng.
          schema:
            type: string
            format: date
          example: '2026-09-05'
      responses:
        '200':
          description: Đã chạy xong (kể cả khi không tạo job nào mới).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReminderGenerationResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: |-
            Đã có một lượt sinh khác đang chạy trên instance này
            (`code` = `events.reminder-generation-in-progress`). Không phải lỗi dữ liệu — đợi lượt
            trước xong rồi bấm lại. Chốt này chỉ để một lần bấm sốt ruột không nhân đôi tải quét
            toàn bảng; việc ghi vốn đã idempotent.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /admin/reminders/dispatch:
    post:
      tags: [admin-reminders]
      operationId: dispatchDueReminders
      summary: Đẩy lịch nhắc đã tới giờ lên hàng đợi / Dispatch due reminders now
      description: |-
        Đẩy ngay các `reminder_job` đã tới giờ lên RabbitMQ, thay vì chờ lượt quét 5 phút.

        **Luồng HTTP không chờ gửi.** Ở đây chỉ ghi tin vào broker rồi trả về; việc gọi gateway
        (in-app, Web Push) diễn ra ở consumer. Gateway chết cũng không giữ lại request nào. Vì vậy
        `dispatchedJobs` là **số job đã đẩy đi**, không phải số người đã nhận được.

        Job có ngày giỗ **đã qua** không được gửi mà chuyển `CANCELLED` — nhắc một cái giỗ đã cúng
        xong là vô nghĩa và gây hoang mang. Job có sự kiện đã xóa mềm cũng vậy.

        Chỉ vai **System Admin** (`ADMIN`).
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReminderDispatchResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # ---------------------------------------------------------------------------
  # CHẨN ĐOÁN WEB PUSH / WEB PUSH DIAGNOSTICS (System Admin)
  # ---------------------------------------------------------------------------
  /admin/notifications/webpush:
    get:
      tags: [admin-webpush]
      operationId: getWebPushConfigStatus
      summary: Cấu hình Web Push đã sẵn sàng chưa / Web Push configuration status
      description: |-
        Kênh Web Push đã cấu hình xong chưa, và nếu chưa thì **thiếu đúng cái gì** cùng các bước sửa.

        **Vì sao endpoint này tồn tại.** Giao diện nói với thành viên "máy chủ chưa cấu hình khoá
        thông báo đẩy, xin báo quản trị viên". Câu đó chỉ dùng được nếu quản trị viên có chỗ để
        kiểm chứng. Trước đây không có: dấu vết duy nhất là một dòng `WARN` lúc khởi động đã trôi
        qua từ lâu, còn `GET /push/public-key` trả `422` giống hệt nhau cho ba nguyên nhân khác
        hẳn nhau — thiếu khoá công khai, thiếu khoá riêng, hay kênh bị tắt bằng tay.

        **Luôn trả `200`.** "Chưa cấu hình" là một *câu trả lời*, không phải một lỗi; trả 4xx sẽ
        biến chính công cụ chẩn đoán thành thứ cần chẩn đoán.

        **Chỉ đọc.** Không có endpoint nào nhận khoá riêng VAPID, và sẽ không có: nhận khoá qua
        HTTP thì máy chủ phải lưu nó xuống một chỗ nào đó, và chỗ đó sẽ theo bản sao lưu đi khắp
        nơi. Khoá chỉ vào hệ thống bằng biến môi trường `GIAPHA_WEBPUSH_PUBLIC_KEY` /
        `GIAPHA_WEBPUSH_PRIVATE_KEY`, đọc **một lần lúc khởi động**.

        Chỉ vai **System Admin** (`ADMIN`) — cùng ranh giới vận hành đã kẻ cho `/actuator` và
        `/admin/reminders/**`.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Tình trạng hiện tại (kể cả khi chưa cấu hình).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebPushConfigStatus'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /admin/notifications/webpush/test-send:
    post:
      tags: [admin-webpush]
      operationId: sendTestWebPush
      summary: Gửi thử một thông báo đẩy cho chính mình / Send a test push to yourself
      description: |-
        Gửi **một tin thử** qua Web Push tới đúng các thiết bị của **chính người đang gọi**.

        **Vì sao cần.** "Đã cấu hình khoá" và "thông báo tới được máy" là hai việc khác nhau: khoá
        có thể hợp lệ trong khi subscription đã bị thu hồi, hoặc push service từ chối vì claim
        `aud`. Không có nút này thì cách duy nhất để biết đường gửi còn sống là **đợi tới ngày
        giỗ** — tức là biết khi đã muộn.

        **Không nhận tham số người nhận**, cố ý. Một endpoint quản trị gửi được cho người khác sẽ
        sớm được dùng để "thử" trên điện thoại của người trong họ lúc nửa đêm.

        **Không đi qua RabbitMQ và không ghi `notification_log`.** Qua hàng đợi thì endpoint chỉ
        trả được "đã xếp hàng" — đúng cái không cần biết — còn kết quả thật nằm lại trong log của
        consumer. Đổi lại, tin thử không xuất hiện trong trung tâm thông báo: nó là phép đo hạ
        tầng, không phải một thông báo của dòng họ.

        Luôn trả `200` kèm kết quả **thật**: `outcome = PERMANENT` nghĩa là push service đã *từ
        chối* máy chủ này (gần như luôn là VAPID sai, thử lại không sửa được); `SKIPPED` kèm
        `deviceCount = 0` nghĩa là chính người gọi chưa bật công tắc trên máy nào.

        Chỉ vai **System Admin** (`ADMIN`).
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Đã chạy xong lượt gửi thử (kể cả khi không gửi được).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebPushTestSendResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # ---------------------------------------------------------------------------
  # NHẬP LIỆU HÀNG LOẠT / BULK IMPORT
  #
  # Bất biến lớn nhất của cả nhóm: KHÔNG một endpoint nào dưới đây ghi vào
  # `person`, `relationship` hay đồ thị AGE. Toàn bộ dữ liệu nằm ở khu vực chờ
  # (các bảng `import_*`) cho tới khi người nhập bấm duyệt, và ngay cả
  # `POST /commit` cũng chỉ mở cổng rồi bàn giao cho bước ghi chạy nền.
  # ---------------------------------------------------------------------------
  /import/branches:
    get:
      tags: [import]
      operationId: listImportBranches
      summary: Các chi/ngành kèm quyền nhập liệu / Branches with import permission
      description: |-
        Cây chi/ngành của dòng họ, đã sắp theo `ltree`, kèm cờ `canImport` cho **người đang gọi**.

        **Vì sao trả cả chi ngoài phạm vi.** Bốn chi nhập song song, và màn đầu của quy trình phải
        trả lời được "tôi đang ở đâu trong cả dòng họ". Danh sách chi và `ltree` của chúng là *cấu
        trúc tổ chức*, không phải dữ liệu cá nhân — nó vốn đã hiện trên phả đồ cho mọi thành viên.
        Giấu ba chi kia không bảo vệ thêm được gì.

        **Phân quyền nằm ở `canImport`, và ở phép kiểm thật tại `POST /import/batches`.** Cờ này
        tồn tại để giao diện khoá nút *trước* khi người dùng chọn tệp, thay vì để họ chọn xong rồi
        nhận `403`.

        Khách vãng lai và tài khoản chưa có `app_user` nhận `403 ACCOUNT_NOT_PROVISIONED` —
        **không** phải một danh sách rỗng. Trả danh sách rỗng là nói với họ rằng màn này có thật.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Danh sách chi, sắp theo `ltree`.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ImportBranch'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /import/duplicate-policy:
    get:
      tags: [import]
      operationId: getImportDuplicatePolicy
      summary: Ngưỡng nghi trùng do máy chủ công bố / Duplicate thresholds
      description: |-
        Hai ngưỡng của thang điểm 0–100, **do máy chủ công bố**. Giao diện không ghi cứng con số nào.

        Thang điểm là dữ liệu hiệu chỉnh của bộ dò trùng (`DuplicateScorer`), đã được đo trên một
        dòng họ mô phỏng 1.506 người và sẽ còn được chỉnh. Một bản sao ghi cứng trong giao diện chắc
        chắn sẽ trôi, và triệu chứng rất khó truy: giao diện tick sẵn "hợp nhất" cho một cặp mà máy
        chủ coi là chưa đáng nghi.

        **Ba con số đang trôi nổi trong tài liệu, và con số nào đúng:**

        | Giá trị | Nguồn | Phán xử |
        |---|---|---|
        | 60 | `plan/02-nhap-lieu §6.4` | **Sai.** Viết trước khi bộ dò được hiệu chỉnh. |
        | 70 | `DuplicateScorer.NGUONG_NGHI_TRUNG` | **Đúng** — ngưỡng thật đang chạy. |
        | 85 | `plan §6.4`, ngưỡng tick sẵn "hợp nhất" | Đúng, nhưng là quyết định *giao diện*; vẫn do backend công bố. |

        Dưới 70 bộ dò **không sinh cảnh báo nào**, nên mọi con số nhỏ hơn 70 mà giao diện dùng đều
        mô tả một trạng thái không tồn tại.

        `autoMerge` luôn `false`, và trường này tồn tại để điều đó là một **lời hứa của hợp đồng**
        chứ không phải một câu trong tài liệu.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportDuplicatePolicy'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /import/progress:
    get:
      tags: [import]
      operationId: getImportProgress
      summary: Tiến độ nhập liệu từng chi / Per-branch import progress
      description: |-
        Một dòng cho **mỗi chi trong cả dòng họ**, đã sắp theo `ltree`.

        **Đây không phải bảng xếp hạng.** Màn này trả lời *còn thiếu gì*, không trả lời *ai chậm*.
        Vì vậy lược đồ cố ý không có thứ hạng, không có phần trăm so với chi khác, không có mốc
        "đáng lẽ phải xong" — cùng lý do bản chốt phạm vi đã cắt xếp hạng đóng góp theo số tiền.

        **Luật phạm vi, ba điều đã chốt:**

        1. **Trả mọi chi** cho tài khoản đã khởi tạo. Bốn chi nhập song song; giấu ba chi kia làm
           màn này vô dụng. Cấu trúc chi và `ltree` vốn đã hiện trên phả đồ cho mọi thành viên.
        2. **Khách vãng lai và tài khoản chưa có `app_user` nhận `403`**, không phải một danh sách
           rỗng. Danh sách rỗng nói dối hai lần: rằng dòng họ này không có chi nào, và rằng màn này
           có thật với họ.
        3. **Chi ngoài phạm vi người gọi chỉ mang số liệu tổng hợp.** Năm trường `coordinatorName`,
           `openBatch`, `blockingCount`, `warningCount`, `undecidedDuplicateCount` **vắng mặt hẳn
           khỏi JSON** — *không* null hoá. Một khoá null vẫn công bố rằng trường ấy tồn tại và ở
           đâu đó có giá trị; với `coordinatorName`, vốn **là tên một người còn sống**, chừng đó đã
           là một mẩu rò rỉ.

        Trong năm trường bị cắt, chỉ `coordinatorName` là dữ liệu cá nhân. Bốn trường còn lại bị
        cắt vì lý do khác: chúng mô tả *việc đang làm dở của người khác* — bao nhiêu lỗi, bao nhiêu
        cặp nghi trùng chưa quyết — và biến màn "còn thiếu gì" thành màn "ai đang sai nhiều".

        **Client phải phân biệt "vắng mặt" với 0.** `expectedPersons` vắng nghĩa là *chưa ai đếm
        cuốn sổ giấy*, không phải "chi ấy có 0 người cần nhập"; hiểu nhầm chỗ này là báo mọi chi đã
        xong 100% ngay khi chưa ai bắt đầu.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Một dòng cho mỗi chi, sắp theo `ltree`.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ImportBranchProgress'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /import/batches:
    get:
      tags: [import]
      operationId: listImportBatches
      summary: Các lô trong phạm vi người gọi / Import batches in caller scope
      description: |-
        Các lô của một chi, hoặc của **mọi chi người gọi được phép ghi** khi bỏ trống `branchId`.
        Mới nhất trước.

        **Vì sao endpoint này không phải thứ thêm cho đủ bộ.** Nó là thứ làm cho "đóng trình duyệt
        rồi quay lại hôm sau" chạy được. Một lô 400 dòng mất vài buổi để đối soát, và trạng thái dở
        dang ấy sống ở **máy chủ**: không có danh sách này thì người nhập chỉ tìm lại được lô của
        mình nếu còn nhớ mã lô trong thanh địa chỉ. Bản nháp cục bộ của giao diện cố ý dùng
        `sessionStorage` và mất khi đóng tab — đúng cho một biểu mẫu một người, sai cho một lô mà
        cả chi đang chờ.

        **Phạm vi được quyết trước khi phân trang, không lọc sau.** Lấy 20 lô rồi bỏ đi những lô
        ngoài phạm vi sẽ trả về những trang thủng lỗ chỗ, và trang cuối có thể rỗng trong khi vẫn
        còn dữ liệu.

        `branchId` trỏ tới một chi ngoài phạm vi trả `403 BRANCH_SCOPE_VIOLATION`, **không** phải
        một danh sách rỗng: "không có lô nào" và "chi này không phải của bạn" là hai câu trả lời
        khác nhau hẳn. Người gọi không quản chi nào (và không nêu `branchId`) nhận danh sách rỗng —
        đúng, vì họ thật sự không có lô nào.
      security:
        - bearerAuth: []
      parameters:
        - name: branchId
          in: query
          required: false
          description: Bỏ trống = mọi chi người gọi được phép ghi.
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/ImportBatchStatus'
        - name: page
          in: query
          required: false
          description: Số trang, tính từ 0.
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: size
          in: query
          required: false
          description: Số lô mỗi trang. Máy chủ ghim trần 200 — trên ngưỡng đó thì đây không còn là màn đối soát mà là một bản kết xuất.
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 20
      responses:
        '200':
          description: Các lô, mới nhất trước.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ImportBatch'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags: [import]
      operationId: uploadImportBatch
      summary: Tải tệp Excel lên và chạy bộ kiểm / Upload a workbook and validate it
      description: |-
        Nhận tệp `.xlsx`, đọc thành dòng vào **khu vực chờ**, rồi chạy ngay toàn bộ bộ kiểm.

        **Trả về lô đã kiểm xong, không phải một biên nhận rỗng.** Người nhập vừa chờ tải xong thì
        thứ họ cần là kết quả đối soát, không phải một mã lô để đi hỏi tiếp. Lô trở về ở trạng thái
        `VALIDATED` (0 lỗi chặn — được phép bấm duyệt) hoặc `FAILED` (còn lỗi chặn).

        **Chưa một dòng nào vào phả.** Bất biến này được canh bằng cách đếm số dòng `person`,
        `relationship` và số đỉnh AGE trước/sau, không bằng lời hứa.

        **Tải lại là hành vi bình thường.** Sửa một ô rồi nộp lại sinh ra một lô **mới**; lô cũ của
        cùng chi chuyển `SUPERSEDED` ngay trong giao dịch ấy. Cơ chế chống sinh người trùng **không**
        phải mã băm tệp mà là `person_external_ref`: tra cột `Mã`, có thì `UPDATE`, không thì
        `CREATE`.

        **`force` chỉ vượt qua đúng một chốt** — chốt bấm-hai-lần (`IMP_ALREADY_COMMITTED`), tức
        "tệp y hệt này đã *được ghi vào phả* cho chi này rồi". Nó **không** chặn việc tải lại để
        kiểm. Giao diện chỉ đặt `force=true` sau khi người dùng đã đọc câu cảnh báo; không bao giờ
        đặt sẵn.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, branchId]
              properties:
                file:
                  type: string
                  format: binary
                  description: |-
                    Tệp `.xlsx`. Nhận diện bằng **chữ ký tệp**, không bằng đuôi. Trần 10 MB và 5.000
                    dòng Nhân khẩu — trần dòng không phải vì máy không chịu nổi mà vì *không ai đối
                    soát nổi* một tệp 5.000 dòng với cuốn sổ giấy đặt cạnh.
                branchId:
                  type: string
                  format: uuid
                  description: Chi đang nhập. Người gọi phải có quyền ghi trên chi này.
                force:
                  type: boolean
                  default: false
                  description: Bỏ qua chốt `IMP_ALREADY_COMMITTED`. Không bao giờ đặt sẵn.
      responses:
        '201':
          description: |-
            Lô đã vào khu vực chờ và đã kiểm xong. `status` là `VALIDATED` hoặc `FAILED` —
            **cả hai đều là 201**: tệp đã được nhận và đã có kết quả đối soát; "còn lỗi chặn"
            là một *kết quả*, không phải một lỗi HTTP.
          headers:
            Location:
              schema:
                type: string
              description: Đường dẫn tới lô vừa tạo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportBatch'
        '400':
          description: |-
            Tệp không đọc được hoặc không an toàn để đọc — `IMP_BAD_FORMAT` (không phải `.xlsx`
            thật), `IMP_CORRUPT_FILE`, `IMP_UNSAFE_FILE` (DOCTYPE / thực thể ngoài XML / zip bomb).
            **Chưa có dòng nào vào khu vực chờ**, nên không có số dòng nào để chỉ: giao diện hiện
            một câu xin lỗi, không hiện bảng lỗi.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |-
            `IMP_ALREADY_COMMITTED` — chi này đã có một lô **đã ghi vào phả** mang đúng mã băm ấy.
            Phản hồi mang `overridable: true` và `overrideField: "force"`: đây là chốt vượt qua
            được có ý thức, không phải lệnh cấm.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ConflictProblem'
        '413':
          description: '`IMP_FILE_TOO_LARGE` — vượt trần 10 MB.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: |-
            Tệp đọc được nhưng không dùng được: `IMP_MISSING_SHEET`, `IMP_MISSING_COLUMN`,
            `IMP_TOO_MANY_ROWS`. Khác `400` ở chỗ việc cần làm là **sửa cấu trúc tệp hoặc tách
            tệp**, không phải chọn tệp khác.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /import/batches/{batchId}:
    get:
      tags: [import]
      operationId: getImportBatch
      summary: Trạng thái lô kèm mọi con số đã đếm sẵn / Batch status with counters
      description: |-
        **Backend đếm, client không đếm lại.** Giao diện khoá/mở nút duyệt theo `canApprove` và ba
        con số `blockingCount` / `warningCount` / `undecidedDuplicateCount`. Đếm lại ở client sẽ
        lệch ngay ở lô đầu tiên có hơn một trang lỗi, và một con số lệch trên màn đối soát là con số
        phá vỡ lòng tin của Trưởng chi vào cả bộ kiểm.

        Lô của chi khác trả `403 BRANCH_SCOPE_VIOLATION`; mã lô không có thật trả `404`. Hai mã khác
        nhau vì "gõ nhầm mã lô" và "lô này không phải của tôi" dẫn tới hai việc khác nhau.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ImportBatchId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportBatch'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /import/batches/{batchId}/validate:
    post:
      tags: [import]
      operationId: revalidateImportBatch
      summary: Chạy lại bộ kiểm / Re-run the validator
      description: |-
        **Chạy lại nhiều lần là hành vi bình thường của quy trình, không phải ngoại lệ.** Mỗi lượt
        sinh lại *toàn bộ* danh sách lỗi và *toàn bộ* kết quả đối soát `CREATE`/`UPDATE`, và **không
        tích luỹ**: nếu lỗi cũ còn sót lại thì người nhập sửa xong vẫn thấy y nguyên danh sách và sẽ
        kết luận bộ kiểm hỏng — từ lúc đó mọi cảnh báo, kể cả cảnh báo đúng, đều vô giá trị.

        Hai lượt chạy trên cùng một tệp cho **danh sách giống hệt nhau**, kể cả thứ tự.

        Lô đã chốt (`COMMITTED` / `SUPERSEDED`) trả `422 IMP_BATCH_CLOSED`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ImportBatchId'
      responses:
        '200':
          description: Đã kiểm xong; các con số trong phản hồi là kết quả của lượt này.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportBatch'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: '`IMP_BATCH_CLOSED` — lô đã chốt, hãy tải lên lô mới.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /import/batches/{batchId}/issues:
    get:
      tags: [import]
      operationId: listImportIssues
      summary: Lỗi chặn và cảnh báo / Blocking errors and warnings
      description: |-
        **Hai nhóm tách bạch hoàn toàn, không phải hai mức của một danh sách.** Khác nhau ở đúng một
        điểm và điểm ấy là toàn bộ lý do tách: `BLOCKING` **không cho** bấm duyệt; `WARNING` cho,
        sau khi người nhập xác nhận đã xem.

        Đây là quyết định về **con người**: một danh sách "15 vấn đề" nghe như hỏng cả tệp và người
        nhập sẽ bấm bừa cho xong; "4 lỗi phải sửa, 11 điều nên xem" nghe là việc làm được. Vì vậy
        giao diện **không bao giờ** được hiện một con số gộp.

        **Riêng tư:** với `IMP_SUSPECT_DUPLICATE` và `IMP_TABOO_COLLISION`, `message` và `context`
        đã được **cắt sạch mọi trường dữ liệu của người đã có trong phả** — chỉ còn khoá
        (`personId`, `bacTrenId`). Bộ dò trùng quét *toàn dòng họ* nên người bị nhắc tới có thể
        đang **còn sống** ở một chi khác. Muốn biết họ là ai thì gọi `GET /persons/{id}`, nơi bộ lọc
        phân tầng riêng tư quyết định trường nào được trả và trả `404` khi người gọi không được biết
        bản ghi tồn tại.

        **Bản Excel của cùng danh sách này ở `GET /import/batches/{batchId}/issues.xlsx`** — và nút
        tải phải nằm **ngay cạnh bảng lỗi**, nếu không thì đường thoát tồn tại mà không ai tìm thấy.
        Chỗ Trưởng chi sửa được là chính tệp Excel, không phải một bảng trên web.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ImportBatchId'
        - name: severity
          in: query
          required: false
          description: Lọc theo nhóm. Bỏ trống là cả hai.
          schema:
            $ref: '#/components/schemas/ImportIssueSeverity'
      responses:
        '200':
          description: |-
            Đã sắp **tất định** theo `(sheet, rowNo, code, field, message)` — hai lượt chạy bộ kiểm
            trên cùng một tệp cho hai danh sách so sánh được từng dòng.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ImportIssue'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /import/batches/{batchId}/issues.xlsx:
    get:
      tags: [import]
      operationId: downloadImportIssues
      summary: Tải danh sách lỗi ra Excel / Download the issue list as Excel
      description: |-
        Cùng dữ liệu của `GET /import/batches/{batchId}/issues`, ở dạng tệp `.xlsx` — **đường thoát
        mà người nhập liệu thật sự cần**. Khi bộ kiểm kêu, chỗ Trưởng chi sửa được là chính tệp
        Excel, không phải một bảng trên web bắt sửa từng dòng.

        **Ba trang, hai nhóm tách bạch:** `Tổng quan` · `Lỗi phải sửa` (chỉ `BLOCKING`) ·
        `Nên xem lại` (chỉ `WARNING`). Không có cột "Mức", **không có con số gộp**. Trang rỗng vẫn
        có mặt: vắng một trang là thông tin mơ hồ.

        **Tám cột:** `Trang` · `Dòng` · `Mã` · `Cột` · `Vấn đề` · `Gợi ý mã gần giống` ·
        `Chi tiết` · `Mã lỗi`. Bốn cột đầu là bộ toạ độ để tìm lại dòng trong tệp gốc. `Trang` hiện
        **tên tab tiếng Việt** ("Nhân khẩu" · "Hôn phối" · "Cả lô"), không hiện khoá
        `NHAN_KHAU`/`HON_PHOI`/`LO` của `GET /issues`, vì thứ người dùng thấy trên thanh tab Excel
        là tên có dấu.

        **Không có tham số `severity`.** Một bản xuất chỉ có cảnh báo là một tệp mang tên "Danh sách
        cần sửa" mà thiếu phần phải sửa; bộ sinh tự tách hai nhóm ra hai trang.

        **Riêng tư — chặt hơn `GET /issues`.** Ngoài chốt chung (chỉ còn khoá `personId`,
        `bacTrenId`), bản xuất áp thêm một **danh sách khoá được phép theo từng mã lỗi** trước khi
        `context` thành chữ; khoá ngoài danh sách bị bỏ lặng lẽ. Lý do: dòng `import_issue` có thể
        do một bản nhị phân **cũ hơn** ghi ra, và một tệp Excel đã tải về **không có đường thu hồi**.

        **Phân quyền:** quyền **ghi** trên chi của lô, như mọi endpoint đọc của lô. Mỗi lần tải để
        lại một dòng `audit_log` với `action = EXPORT`.

        **Tên tệp có dấu.** `Content-Disposition` mang cả hai dạng; client phải đọc RFC 5987
        `filename*=UTF-8''` **trước**.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ImportBatchId'
      responses:
        '200':
          description: Tệp `.xlsx` ba trang.
          headers:
            Content-Disposition:
              schema:
                type: string
              description: |-
                Mang cả `filename=` (đã rụng dấu) lẫn `filename*=UTF-8''` (tên thật có dấu), ví dụ
                `Danh sách cần sửa - Chi Ất - 2026-09-12.xlsx`.
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /import/batches/{batchId}/rows:
    get:
      tags: [import]
      operationId: listImportRows
      summary: Xem trước các dòng đang chờ / Preview staged rows
      description: |-
        Từng dòng trong khu vực chờ, đúng như người nhập đã gõ — kể cả khi nó mâu thuẫn, thiếu hoặc
        sai. Đó là toàn bộ lý do khu vực chờ tồn tại.

        `plannedAction` trả lời câu hỏi duy nhất mà Trưởng chi thật sự lo khi nộp lần thứ hai: *tải
        lại có sinh ra người trùng không*. `UPDATE` nghĩa là mã này đã có chủ trong phả và sẽ cập
        nhật đúng người ấy; `CREATE` nghĩa là sẽ thêm mới. Con số suy từ `person_external_ref`, không
        suy từ tên.

        Không có dữ liệu nào của phả ở đây. `resolvedPersonId` là ngoại lệ duy nhất và nó chỉ là một
        **khoá**.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ImportBatchId'
        - name: action
          in: query
          required: false
          description: Lọc theo hành động dự kiến. Bỏ trống là tất cả.
          schema:
            $ref: '#/components/schemas/ImportPlannedAction'
      responses:
        '200':
          description: Đã sắp theo `rowNo`.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ImportRow'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /import/batches/{batchId}/duplicates:
    get:
      tags: [import]
      operationId: listImportDuplicates
      summary: Các cặp nghi trùng chờ người quyết / Suspected duplicate pairs
      description: |-
        **Máy nghi ngờ, người quyết định.** Không có ngưỡng điểm nào dẫn tới việc tự gộp hai hồ sơ:
        gộp nhầm là hợp nhất hai nhánh con cháu vào một node sai, và sau ba mươi ngày thì không hoàn
        tác được.

        ### Bất biến riêng tư — đọc kỹ trước khi dựng màn đối chiếu

        Khi bên bị nghi là người **đã có trong phả** (`existing.source = "TREE"`), phản hồi mang
        **đúng một khoá** `existing.personId` và mảng `evidence` **rỗng**. Không tên, không đời,
        không năm sinh, không ngày giỗ.

        Bộ dò quét *toàn dòng họ*, nên hồ sơ bị nghi có thể là một người **còn sống** ở một chi khác.
        Bộ lọc phân tầng riêng tư sống ở context `genealogy` và là chỗ **duy nhất** được quyết định
        trường nào của một người được trả cho ai. Nếu màn nhập liệu tự trưng tên và năm sinh lấy từ
        kết quả dò trùng thì luật lọc có hai bản, và bản thứ hai không biết gì về đồng thuận của chủ
        thể, về tuổi vị thành niên, hay về vai của người gọi.

        **Cách đúng cho giao diện:** cầm `personId` gọi `GET /persons/{id}`. Thêm một vòng gọi, đổi
        lấy việc chỉ có một luật lọc.

        Khi bên bị nghi là **một dòng khác trong chính tệp vừa nộp** (`existing.source = "FILE"`) thì
        không có gì để giấu — cả hai bên đều là thứ người nhập vừa gõ — nên `evidence` đầy đủ. Ca này
        rất hay xảy ra: một người đàn ông xuất hiện ở cả trang đời cha lẫn trang đời con trong sổ.

        ### `evidence[].existingValue = null` có đúng một nghĩa

        "Nguồn bên kia **không ghi** mục này". Nó **không bao giờ** dùng để nói "đã bị cắt theo phân
        tầng riêng tư". Dấu hiệu nào không được phép trưng ra thì **bỏ hẳn khỏi mảng**, không gửi
        sang một ô rỗng: một ô rỗng vừa rò rỉ sự tồn tại của dữ liệu đang giấu, vừa dẫn người đối
        chiếu tới quyết định gộp sai.

        ### Quyết định gửi ở đâu

        `POST /import/batches/{batchId}/duplicates/{pairId}/decision`, với `pairId` là `id` của cặp
        trong danh sách này. Khoá ấy **ổn định qua các lần kiểm lại**, nên một cặp không đổi giữ
        nguyên quyết định của nó — bắt quyết lại 40 cặp vì lần kiểm sau tìm thêm cặp thứ 41 là cách
        huấn luyện người ta bấm bừa. Lô **không duyệt được** khi còn cặp `PENDING` hoặc `DEFERRED`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ImportBatchId'
      responses:
        '200':
          description: Một phần tử cho mỗi **cặp** (dòng × hồ sơ bị nghi), không phải cho mỗi dòng.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ImportDuplicatePair'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /import/batches/{batchId}/duplicates/{pairId}/decision:
    post:
      tags: [import]
      operationId: decideImportDuplicate
      summary: Quyết một cặp nghi trùng / Decide a suspected duplicate pair
      description: |-
        **Gộp · để riêng · hoãn.** Máy nghi ngờ, người quyết định — không có ngưỡng điểm nào tự gộp.

        ### Vì sao lối gọi này là điều kiện để cả đường ống dùng được

        Không có nó thì mọi cặp vĩnh viễn `PENDING`, `undecidedDuplicateCount` không bao giờ giảm, và
        cổng duyệt chặn **mọi lô có dù chỉ một người nghi trùng** — tức là đường ống chỉ chạy được
        trên tệp không có ai nghi trùng, mà một dòng họ chép lại từ nhiều cuốn sổ thì gần như luôn
        có. Đó chính là lý do bộ dò trùng tồn tại.

        ### "Gộp" nghĩa là gì — hai ca, hai nghĩa hoàn toàn khác nhau

        **Bên kia đã có trong phả** (`existing.source = "TREE"`): dòng trong tệp **không tạo người
        mới** mà **cập nhật** hồ sơ ấy. `plannedAction` của dòng đổi từ `CREATE` sang `UPDATE`, và
        khi lô được duyệt thì `person_external_ref` trỏ mã trong tệp sang `person.id` đã tồn tại —
        nhờ vậy **lần tải lại sau nhận ra ngay** mà không hỏi lại. Không ghi khoá ấy thì cả thao tác
        gộp trở thành việc phải làm lại mỗi lần.

        **Bên kia là một dòng khác trong chính tệp** (`existing.source = "FILE"`): hai dòng cùng mô
        tả một người, nên một trong hai **biến mất trước khi ghi**, và mọi mã cha / mã mẹ / mã kế tự
        / mã hôn phối trỏ tới dòng bị bỏ được **trỏ lại** sang dòng ở lại. Dòng ở lại còn hút những ô
        mà nó bỏ trống từ dòng bị bỏ, nên gộp không làm mất một nửa dữ kiện. Dòng nào ở lại là tất
        định: dòng đã có chủ trong phả ở lại, nếu không có thì dòng có số dòng nhỏ nhất ở lại.

        ### "Hoãn" không phải "đã quyết"

        `DEFERRED` **vẫn** nằm trong `undecidedDuplicateCount` và **vẫn chặn** nút duyệt. Nó tồn tại
        để người đối chiếu không phải chọn bừa khi chưa chắc — ép chọn nhị phân lúc chưa chắc thì cái
        bấm đại trở thành sự thật trong phả. Nhưng nếu nó mở khoá nút duyệt thì nó lập tức thành nút
        "cho tôi qua" và cả cơ chế dò trùng thành trang trí.

        ### Quyết định sống sót qua các lần kiểm lại

        Kiểm lại (`POST /validate`) **không** xoá quyết định của những cặp không đổi: bắt quyết lại 40
        cặp vì lần kiểm sau tìm thêm cặp thứ 41 là cách huấn luyện người ta bấm bừa. Cặp **mới** thì
        vào với `PENDING` và chặn lô cho tới khi có người trả lời.

        ### Không rò rỉ

        Yêu cầu **không** nhận `personId`: đích của phép gộp đã nằm sẵn trong cặp mà máy chủ dò ra,
        nên người gọi chỉ chọn được trong số những cặp ấy. Phản hồi cũng chỉ mang `personId`, mã
        dòng, điểm và nhãn tín hiệu — **không một trường nhân khẩu nào** của người đã có trong phả.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ImportBatchId'
        - $ref: '#/components/parameters/ImportDuplicatePairId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImportDuplicateDecisionRequest'
      responses:
        '200':
          description: |-
            Cặp sau khi ghi quyết định, **kèm lô đã tính lại**. Một quyết định đổi bốn thứ trên màn
            hình cùng lúc — trạng thái cặp, `undecidedDuplicateCount`, `plannedCreateCount` /
            `plannedUpdateCount`, và `canApprove` — nên cả bốn về trong một vòng gọi.

            **Hai con số kế hoạch dịch chuyển thế nào.** Gộp với một hồ sơ đã có trong phả
            (`source = "TREE"`): dòng ấy thôi tạo người mới mà chuyển sang cập nhật, nên
            `plannedCreateCount` **giảm 1** và `plannedUpdateCount` **tăng 1**. Gộp với một dòng khác
            trong chính tệp (`source = "FILE"`): một dòng biến mất hẳn trước khi ghi, nên
            `plannedCreateCount` **giảm 1** và `plannedUpdateCount` **không đổi**. `DISTINCT` và
            `DEFERRED` không đụng tới hai con số ấy. Client **đừng tự tính lại** — các quyết định gom
            theo nhóm liên thông, nên một lần bấm có thể kéo theo nhiều dòng và phép trừ ở client sẽ
            lệch dần.

            **Ca bị từ chối không nằm ở đây.** Một nhóm gộp dính tới hai `person` khác nhau đã có
            trong phả vẫn được **ghi nhận bình thường** ở lối gọi này (`200`); mâu thuẫn chỉ lộ ra ở
            lần `POST /validate` kế tiếp, dưới dạng lỗi chặn `IMP_MERGE_NOT_APPLICABLE`, và lô dừng
            lại ở đó. Lý do tách hai nhịp: một quyết định đơn lẻ không sai — chỉ **tổ hợp** các quyết
            định mới sai, mà tổ hợp thì chỉ biết được khi gom cả nhóm.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportDuplicateDecisionResult'
        '400':
          description: |-
            `decision` thiếu hoặc không hợp lệ. `PENDING` **không** nhận được: rút lại một lời khai
            đã ghi không phải là xoá nó đi.

            `code` là **`VALIDATION_FAILED`** — mã dùng chung của shared kernel, **không** phải một
            mã `IMP_*`. Ba tình huống (thiếu `decision` · giá trị lạ · gửi `PENDING`) dùng **chung**
            mã ấy và chỉ khác nhau ở `detail`, vốn đã là câu tiếng Việt nói thẳng phải sửa gì. Client
            **đừng rẽ nhánh theo `code`** ở đây; hiện `detail` lên là đủ, và đó cũng là lý do ba
            tình huống không cần ba mã.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: |-
            Lô không có thật, hoặc cặp không có thật, hoặc cặp **không thuộc lô** nêu trong đường
            dẫn. Ba tình huống cùng một mã: đường dẫn là thứ duy nhất đã qua phép kiểm phạm vi chi,
            nên một cặp nằm ngoài nó được coi như không tồn tại.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: |-
            Lô đã chốt (`IMP_BATCH_CLOSED`) — gửi lô mới, đừng sửa lô cũ.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /import/batches/{batchId}/acknowledge-warnings:
    post:
      tags: [import]
      operationId: acknowledgeImportWarnings
      summary: Xác nhận đã xem cảnh báo / Acknowledge warnings
      description: |-
        "Tôi đã xem hết phần cần xem lại." Không sửa gì cả — chỉ mở khoá nút duyệt.

        **Vì sao endpoint này là điều kiện để cả đường ống dùng được.** Một cuốn gia phả thật
        **luôn** có cảnh báo: thuỷ tổ thì lần nào cũng sinh `IMP_LONE_NODE`, và đó là dữ liệu đúng
        chứ không phải lỗi. Không có lối gọi này thì mọi lô thật đều dừng ở `VALIDATED` với nút
        duyệt xám vĩnh viễn.

        **Đây là một lời khai, không phải một cái cờ.** Máy chủ ghi lại **ai** xác nhận
        (`warningsAcknowledgedBy`), **lúc nào** (`warningsAcknowledgedAt`), và — không lộ ra hợp
        đồng — **vân tay của tập cảnh báo** người ấy đã đọc.

        **Xác nhận hết hiệu lực khi lô được kiểm lại và sinh cảnh báo MỚI.** Lúc đó `canApprove`
        quay về `false` và `POST /commit` lại trả `422 IMP_WARNINGS_NOT_ACKNOWLEDGED`, dù
        `warningsAcknowledgedAt` **vẫn còn giá trị** — dấu thời gian ấy là sự thật lịch sử (đã có
        người bấm), còn hiệu lực là chuyện khác. Client vì vậy **không được** suy "đã xác nhận" từ
        việc `warningsAcknowledgedAt` khác null; câu trả lời duy nhất là `canApprove`.

        Kiểm lại mà tập cảnh báo **y nguyên** thì xác nhận vẫn còn hiệu lực: bắt tick lại một danh
        sách không đổi là cách chắc chắn để lần thứ ba người ta tick mà không đọc.

        Lô đã chốt (`COMMITTED` / `SUPERSEDED`) trả `422 IMP_BATCH_CLOSED`. Lô không có cảnh báo nào
        vẫn trả `200` — bấm nút trên một danh sách rỗng là chuyện vô hại, và ném lỗi vào mặt người
        dùng vì điều đó chỉ làm màn đối soát khó dùng hơn.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ImportBatchId'
      requestBody:
        required: false
        description: |-
          Không bắt buộc. Giao diện gửi `{ "acknowledged": true }` cho tường minh. Máy chủ **không**
          nhận `acknowledged: false` như một lệnh rút lại: rút lại một lời khai đã ghi không phải là
          xoá nó đi, và chưa ai cần nghiệp vụ ấy.
        content:
          application/json:
            schema:
              type: object
              properties:
                acknowledged:
                  type: boolean
                  const: true
      responses:
        '200':
          description: |-
            Lô sau khi ghi nhận. `canApprove` là câu trả lời cuối cùng cho câu hỏi "nút duyệt có mở
            không" — nó đã tính cả cảnh báo lẫn các cặp nghi trùng chưa quyết.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportBatch'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: '`IMP_BATCH_CLOSED` — lô đã chốt, không còn gì để xác nhận.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /import/batches/{batchId}/commit:
    post:
      tags: [import]
      operationId: commitImportBatch
      summary: Duyệt lô và xếp hàng ghi vào phả / Approve and queue the write
      description: |-
        **Ranh giới ghi duy nhất của cả đường ống.**

        Trả `202`: việc ghi chạy ở luồng nền và luồng web không bao giờ chờ nó — 400 người là vài
        giây tới vài chục giây, giữ một request mở suốt thời gian ấy là mời gọi timeout của proxy rồi
        một cú bấm lại, tức hai lần ghi cho cùng một lô. **Trạng thái cuối chỉ đến từ
        `GET /commit-progress`**; đừng suy từ phản hồi này.

        ### Cổng duyệt: bốn điều kiện, bốn mã lỗi

        | Mã | Nghĩa | Việc người nhập phải làm |
        |---|---|---|
        | `IMP_BATCH_CLOSED` | Lô đã `COMMITTED`/`SUPERSEDED` | Nộp lô mới |
        | `IMP_BLOCKING_ISSUES_PRESENT` | Còn lỗi chặn | Sửa trong tệp rồi tải lại |
        | `IMP_WARNINGS_NOT_ACKNOWLEDGED` | Chưa tick "đã xem" | Đọc rồi xác nhận |
        | `IMP_DUPLICATES_UNDECIDED` | Còn cặp nghi trùng chưa quyết | Mở màn đối chiếu |

        Bốn mã chứ không phải một, vì bốn điều kiện dẫn tới bốn việc khác nhau. Thứ tự kiểm cũng là
        thứ tự xử lý: kiểm ngược lại thì người nhập được bảo đi quyết mấy cặp nghi trùng của một lô
        mà đằng nào cũng phải nộp lại.

        **Cổng nằm ở máy chủ dù giao diện đã ẩn nút.** Nút bị ẩn không phải là một phép kiểm.

        ### Điều kiện thứ năm không đi ra bằng HTTP

        Ngay trước khi ghi còn một lượt soát nữa (`IMP_COMMIT_BLOCKED`): lô chạm một ca mà quy ước
        của dòng họ chưa trả lời. Lượt ấy chạy ở **luồng nền**, nên nó **không** thành mã HTTP của
        `POST /commit` mà thành `status = FAILED` kèm `failureReason`, đọc qua `/commit-progress`;
        danh sách vấn đề được ghi lại vào `import_issue` và nạp bằng `GET /issues`. **Chưa một dòng
        nào vào phả** khi điều đó xảy ra.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ImportBatchId'
      responses:
        '202':
          description: |-
            Đã qua cổng duyệt và bàn giao cho bước ghi. Thân phản hồi là **trạng thái tại thời điểm
            bàn giao**, chưa phải kết quả ghi.
          headers:
            Location:
              schema:
                type: string
              description: Đường dẫn để hỏi tiến độ.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportBatch'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: Chưa qua cổng duyệt — xem bảng bốn mã ở phần mô tả.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /import/batches/{batchId}/commit-progress:
    get:
      tags: [import]
      operationId: getImportCommitProgress
      summary: Tiến độ ghi vào phả / Write progress
      description: |-
        **Nguồn duy nhất của trạng thái cuối** sau khi bấm duyệt.

        `estimated` luôn `true` và giao diện **phải hiện điều đó thành chữ**: con số đếm ngoài giao
        dịch ghi nên nó là ước lượng *theo bản chất*, không phải vì hiện thực còn dở. Vẽ nó như một
        thanh tiến độ chính xác là hứa một điều hệ thống không giữ được, và khi nó nhảy từ 60% lên
        xong thì người dùng kết luận hệ thống nói dối.

        `phase = FAILED` nghĩa là lô đã cuộn lại **toàn bộ** — tất-cả-hoặc-không. Không có trạng
        thái "ghi được một nửa".
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ImportBatchId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportCommitProgress'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /import/batches/{batchId}/rollback-preflight:
    get:
      tags: [import]
      operationId: previewImportRollback
      summary: Lô này còn gỡ được không, vướng ở đâu / Rollback preflight
      description: |-
        Trả lời "gỡ được không" mà **không gỡ gì cả**.

        Phải có, vì một hộp thoại "Bạn chắc chứ?" không nói gì về việc đã có người sửa hồ sơ do lô ấy
        sinh ra là một hộp thoại **nói dối**. `blockers[]` là danh sách vướng mắc bằng tiếng Việt,
        đủ cụ thể để người bấm biết mình đang đánh đổi cái gì.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ImportBatchId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [canRollback, blockers]
                properties:
                  canRollback:
                    type: boolean
                  blockers:
                    type: array
                    description: Rỗng nghĩa là gỡ được.
                    items:
                      type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /import/batches/{batchId}/rollback:
    post:
      tags: [import]
      operationId: rollbackImportBatch
      summary: Gỡ cả lô khỏi phả / Roll a batch back out of the tree
      description: |-
        Gỡ toàn bộ lô, kể cả sau khi đã ghi vào phả. **Đây là nút quyết định người ta có dám nhập
        lần thứ hai hay không.**

        **Gỡ là xoá mềm.** Node vẫn nằm trong đồ thị — xoá cứng một nhân khẩu là cắt đứt mọi liên kết
        treo vào nó. Cạnh được gỡ **trước**, người bị xoá mềm **sau**: làm ngược lại thì trong một
        nhịp ngắn vẫn tồn tại một người đã xoá mềm mà còn nguyên cạnh.

        **Trạng thái không đổi sau khi gỡ.** Lô vẫn mang `status = COMMITTED` vì nó *đã từng* được
        ghi — đó là sự thật lịch sử, và `committedAt` là mốc mà mọi phép kiểm "ai đã động vào sau khi
        ghi" dựa vào. Việc đã gỡ là một **cột riêng**, không phải một trạng thái. Client phân biệt
        "đã gỡ" với "chưa bao giờ ghi" bằng `committedAt != null && rolledBackAt != null`.

        Từ chối với `422 IMP_ROLLBACK_REFUSED` khi đã có người khác động vào dữ liệu lô ấy sinh ra.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ImportBatchId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  description: Lý do gỡ, đi vào nhật ký kiểm toán.
      responses:
        '200':
          description: Đã gỡ xong.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportBatch'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: '`IMP_ROLLBACK_REFUSED` — thân lỗi mang `blockers[]`.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /admin/branches/{branchId}/import-template.xlsx:
    get:
      tags: [import]
      operationId: downloadImportTemplate
      summary: Tải mẫu Excel của một chi / Download a branch import template
      description: |-
        Mẫu Excel **riêng cho từng chi**, năm trang: Hướng dẫn · Nhân khẩu · Hôn phối · Ví dụ · Danh mục.

        **Vì sao mẫu theo chi chứ không phải một tệp tĩnh dùng chung.** Từ lần nhập thứ hai trở đi,
        mẫu mang sẵn *những người đã có trong phả* của chi ấy. Đó là toàn bộ cơ chế giữ cho lần nhập
        sau không sinh người trùng: người nhập sửa ngay trên dòng đã có mã, thay vì gõ lại từ đầu rồi
        nhận về 300 dòng `CREATE`.

        **Đường dẫn nằm dưới `/admin` nhưng KHÔNG phải "chỉ System Admin".** Khác với
        `/admin/reminders/**`, endpoint này phục vụ đúng Trưởng chi — người sẽ điền vào mẫu. Phép
        kiểm là **quyền ghi trên chi ấy**, giống hệt `POST /import/batches`: muốn lấy mẫu của chi
        Giáp thì phải quản chi Giáp.

        **Tên tệp có dấu.** `Content-Disposition` mang **cả hai** dạng: dạng thường đã rụng dấu cho
        trình duyệt cũ, và dạng RFC 5987 `filename*=UTF-8''` cho tên thật. Client phải đọc dạng
        RFC 5987 **trước**; bỏ qua nó thì tên tệp về tay người dùng là bản đã rụng dấu.
      security:
        - bearerAuth: []
      parameters:
        - name: branchId
          in: path
          required: true
          description: Chi cần sinh mẫu.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Tệp `.xlsx`.
          headers:
            Content-Disposition:
              schema:
                type: string
              description: |-
                Mang cả `filename=` (đã rụng dấu) lẫn `filename*=UTF-8''` (tên thật có dấu).
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # ---------------------------------------------------------------------------
  # LỜI MỜI / INVITATIONS
  # ---------------------------------------------------------------------------
  /invitations:
    post:
      tags: [invitations]
      operationId: issueInvitation
      summary: Phát lời mời cho một nhân khẩu / Issue an invitation
      description: |-
        Phản hồi chứa **mã thô**, và đó là **lần duy nhất** mã xuất hiện: CSDL chỉ lưu băm SHA-256.
        Không có endpoint nào đọc lại được mã. Màn hình phát mã phải cho Trưởng chi chép hoặc in
        ngay, và nói rõ rằng đóng màn là mất mã. Mất mã thì **phát lại** — và phát lại **tự thu hồi**
        mã cũ, vì hai mã cùng mở được một hồ sơ thì "thu hồi" mất nghĩa.

        **Quyền**: `BRANCH_HEAD` trong phạm vi chi/ngành được giao · `COUNCIL` · `ADMIN`.

        > Phạm vi của Trưởng chi ở đây là **giả định của chủ dự án, chưa phải phán quyết của Hội
        > đồng Tộc biểu**. Đường còn lại (Trưởng chi đề nghị, Hội đồng duyệt rồi mã mới sinh) đổi
        > đúng một lời gọi trong `InvitationService.issue`.
        > / Branch-head scope here is a project assumption, not a council ruling.

        ### Ba phép kiểm chạy NGAY LÚC PHÁT, không để dành tới lúc nhận

        | Tình huống | Mã lỗi |
        |---|---|
        | Nhân khẩu đã có tài khoản (`ux_app_user_person`) | `422 PERSON_ALREADY_LINKED` |
        | Người được mời đã khuất, hoặc đã xoá mềm | `422 VALIDATION_FAILED` |
        | Nhân khẩu ngoài phạm vi chi của người gọi | `403 BRANCH_SCOPE_VIOLATION` |

        Cả ba đều phát hiện được ngay khi bấm, và Trưởng chi cần biết ngay — chứ không phải sau khi
        đã in phiếu, gửi tin nhắn và chờ người được mời gọi lại bảo không vào được.
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IssueInvitationRequest'
      responses:
        '201':
          description: Đã phát. Thân phản hồi chứa mã thô — lần duy nhất. / Created, raw code inside.
          headers:
            Location:
              schema:
                type: string
              description: Đường dẫn tới bản ghi lời mời; bản ghi này **không** chứa mã.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssuedInvitation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'

    get:
      tags: [invitations]
      operationId: listInvitations
      summary: Lời mời trong phạm vi của tôi / Invitations in my scope
      description: |-
        Trưởng chi thấy lời mời của chi mình, Hội đồng thấy toàn họ. Không bản ghi nào chứa mã hay
        băm của mã.

        Giao diện nên hiển thị `usability` chứ **không** phải `status`: `PENDING` của một mã đã quá
        hạn không nói lên điều gì cho người đang nhìn danh sách.

        > **Lệch quy ước phân trang:** endpoint này trả một **mảng phẳng**, không phải bọc
        > `{ items, page }` — giống `/change-requests/mine`. / Returns a bare array.
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Invitation'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /invitations/{id}:
    delete:
      tags: [invitations]
      operationId: revokeInvitation
      summary: Thu hồi một lời mời còn mở / Revoke an invitation
      description: |-
        Đòi đúng quyền như lúc phát: `BRANCH_HEAD` trong phạm vi chi/ngành · `COUNCIL` · `ADMIN`.

        Lời mời **đã được nhận** thì không thu hồi được (`422 VALIDATION_FAILED`): lúc ấy tài khoản
        đã gắn vào nhân khẩu rồi, và gỡ mối gắn ấy là một nghiệp vụ khác hẳn, phải để lại vết riêng.
      parameters:
        - name: id
          in: path
          required: true
          description: Định danh lời mời (UUID). / Invitation id.
          schema:
            type: string
            format: uuid
        - name: reason
          in: query
          required: false
          description: Lý do thu hồi, ghi vào `audit_log`. / Revocation reason.
          schema:
            type: string
      responses:
        '204':
          description: Đã thu hồi. / Revoked.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /invitations/lookup:
    post:
      tags: [invitations]
      operationId: lookupInvitation
      summary: Xem lời mời — KHÔNG cần token / Preview an invitation (no token)
      description: |-
        Màn "Lời mời này dành cho ai". **Không cần token**: người bấm chính là người chưa có tài
        khoản, và bắt họ đăng nhập trước là bắt họ đặt mật khẩu cho một thứ họ chưa xác nhận là của
        mình.

        ### Đây là một ngoại lệ riêng tư CÓ CHỦ Ý, đã được chốt

        `inviteeDisplayName` là dữ liệu **Tầng 1 của một người đang sống** (BA v2 §10), hiện ra cho
        bất kỳ ai cầm mã — kể cả người nhặt được tờ phiếu giấy, kể cả người được chuyển tiếp tin
        nhắn. Ngoại lệ được chọn vì không hiện tên thì người nhận không xác nhận được "đúng là tôi",
        nút "Không phải tôi" mất nghĩa, và cả luồng vô nghĩa.

        Cái giá được trả bằng **ba lớp, không lớp nào thay được lớp nào**: mã dùng một lần · hạn
        ngắn (mặc định 7 ngày) · giới hạn tần suất theo người gọi (`429 RATE_LIMITED`).

        ### `POST` cho một thao tác chỉ đọc — có lý do

        Mã mời là bí mật. Đặt nó vào đường dẫn là đặt nó vào access log của reverse proxy, lịch sử
        trình duyệt, header `Referer` và mọi hệ thống giám sát đang gom URL. Thân của một `POST`
        không đi vào chỗ nào trong số đó, và `POST` cũng không được cache — điều đáng mong muốn cho
        một màn hình hiện tên người còn sống.

        ### Bốn cách một mã hỏng — ba mã lỗi, cộng một mã dùng lại

        | Tình huống | HTTP | `code` |
        |---|---|---|
        | Không khớp lời mời nào (kể cả sai định dạng) | `404` | `NOT_FOUND` |
        | Hết hạn | `410` | `INVITATION_EXPIRED` |
        | Đã được dùng | `409` | `INVITATION_ALREADY_USED` |
        | Đã bị thu hồi | `410` | `INVITATION_REVOKED` |

        FE rẽ nhánh theo **`code`**, không theo mã HTTP. Mỗi ca dẫn tới một câu chữ và một lối đi
        tiếp khác nhau, nên gộp lại là bỏ mặc một cụ đang cầm tờ phiếu thật đã quá hạn.

        Mã **sai định dạng** trả lời y hệt mã đúng định dạng mà không tồn tại — khác nhau ở đó thì
        kẻ dò đọc được độ dài và bảng chữ của mã mà không cần đoán trúng lần nào.

        **Thân lỗi không bao giờ mang tên hay số điện thoại người mời.** Một mã hỏng, theo định
        nghĩa, là mã có thể đang nằm trong tay người lạ; gắn số thật của một Trưởng chi vào phản hồi
        lỗi là biến kẻ dò mã thành kẻ quét danh bạ. FE chỉ đường về số đã nằm sẵn trong tay người
        nhận — cuối tin nhắn, đáy phiếu giấy.
      security: []
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RedeemInvitationRequest'
      responses:
        '200':
          description: Lời mời còn dùng được. / Invitation is usable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationPreview'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/InvitationNotFound'
        '409':
          $ref: '#/components/responses/InvitationAlreadyUsed'
        '410':
          $ref: '#/components/responses/InvitationGone'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /invitations/accept:
    post:
      tags: [invitations]
      operationId: acceptInvitation
      summary: Nhận lời mời — gắn ngay, KHÔNG qua chờ duyệt / Accept an invitation
      description: |-
        "Đúng là tôi — nhận lời mời". **Không cần token.** Thẩm quyền ở đây là **việc sở hữu mã**,
        và quyền đã được kiểm một lần rồi, lúc phát.

        Khi người được mời chưa có tài khoản Keycloak, backend **tạo tài khoản cho họ** rồi trả về
        `setPasswordUrl` để chính họ đặt mật khẩu. Đó là lý do lối gọi này không đòi token: đòi
        token thì người chưa có tài khoản không bao giờ nhận được lời mời — đúng cái vòng luẩn quẩn
        mà luồng mời sinh ra để phá.

        ### Điểm mấu chốt của cả luồng

        Lời mời **mang sẵn** `personId`, nên người được mời **không rơi vào trạng thái "chờ duyệt"**.
        Không một `ChangeRequest` nào được tạo, không ai phải bấm Duyệt. Phản hồi trả về
        `status: ACTIVE` kèm `personId` khác `null` — đó là bằng chứng đọc được từ phía client rằng
        không có bước chờ nào ở giữa. Trưởng chi đã chỉ đích danh người mình mời; hệ thống không hỏi
        lại một câu đã có đáp án.

        Sau bước này, client chuyển sang màn nhập môn chứ **không** vào hồ sơ cá nhân (gần như
        trống) và **không** vào phả đồ (một bức tường người lạ).
      security: []
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcceptInvitationRequest'
      responses:
        '200':
          description: Đã gắn tài khoản với nhân khẩu. / Account linked to person.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcceptedInvitation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/InvitationNotFound'
        '409':
          $ref: '#/components/responses/InvitationAlreadyUsed'
        '410':
          $ref: '#/components/responses/InvitationGone'
        '422':
          description: |-
            Tài khoản đang gọi đã gắn một nhân khẩu khác (`ACCOUNT_ALREADY_LINKED`), hoặc nhân khẩu
            vừa bị một tài khoản khác chiếm (`PERSON_ALREADY_LINKED`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          description: |-
            Không nói chuyện được với Keycloak (`IDENTITY_PROVIDER_UNAVAILABLE`). **Mã mời vẫn còn
            nguyên giá trị** — thao tác ghi chỉ diễn ra sau khi tài khoản đã tạo xong, nên mọi hỏng
            hóc ở bước này rơi về trạng thái lành và người dùng thử lại được.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /invitations/set-password:
    post:
      tags: [invitations]
      operationId: setInvitationPassword
      summary: Đặt mật khẩu qua liên kết một lần / Set password via one-time link
      description: |-
        Đích đến của `setPasswordUrl` mà `POST /invitations/accept` trả về. **Không cần token** —
        chính `token` trong thân yêu cầu là chứng chỉ.

        Mật khẩu đi **qua** lối này tới Keycloak, nơi chính sách mật khẩu của realm được áp dụng và
        nơi nó được băm. Backend **không sinh, không lưu, và không đọc lại được** mật khẩu.

        **Tính một lần neo vào trạng thái thật** — "tài khoản này đã có credential password chưa" —
        chứ không vào một cờ trong cơ sở dữ liệu. Một cờ sót lại là một lối đổi mật khẩu của người
        khác. Vì vậy gọi lại lần hai trả `410` trong khi mật khẩu vừa đặt **vẫn đăng nhập được**.

        **Client đừng tự kiểm mật khẩu bằng luật riêng rồi chặn trước.** Chính sách thuộc realm;
        dựng một bản sao ở client là tạo bản luật thứ hai sẽ lệch. Gợi ý yêu cầu thì được, phán
        quyết là việc của máy chủ — và câu từ chối ở `422` phải nói **phải sửa gì**.
      security: []
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetPasswordRequest'
      responses:
        '204':
          description: Đã đặt mật khẩu. Người dùng đăng nhập được ngay. / Password set.
        '400':
          $ref: '#/components/responses/BadRequest'
        '410':
          description: |-
            Liên kết hết hạn, sai chữ ký, hoặc **đã dùng rồi** (`SET_PASSWORD_LINK_INVALID`). Hạn là
            30 phút, nên hết hạn là ca **bình thường**: một cụ có thể để tin nhắn tới hôm sau mới
            mở. Giao diện phải cho một đường xin lại, không phải một dải đỏ.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: |-
            Realm từ chối mật khẩu (`VALIDATION_FAILED`) — quá ngắn, quá dễ đoán, trùng mật khẩu cũ.
            `detail` nói rõ phải sửa gì.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          description: Không nói chuyện được với Keycloak (`IDENTITY_PROVIDER_UNAVAILABLE`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /invitations/decline:
    post:
      tags: [invitations]
      operationId: declineInvitation
      summary: Từ chối lời mời — huỷ mã, KHÔNG cần token / Decline an invitation
      description: |-
        Nút "Không phải tôi". Huỷ mã ngay. **Không cần token** — đòi token ở đây là vô hiệu hoá nút,
        vì người bấm chính là người *không* có tài khoản.

        Đây là lớp chống đỡ thứ ba của thiết kế, ngang hàng với "dùng một lần" và "hết hạn": người
        mời gửi nhầm số không có cách nào khác để biết mình gửi nhầm. Thao tác để lại vết trong
        `audit_log`.
      security: []
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RedeemInvitationRequest'
      responses:
        '204':
          description: Mã đã chết. / Code is dead.
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/InvitationNotFound'
        '409':
          $ref: '#/components/responses/InvitationAlreadyUsed'
        '410':
          $ref: '#/components/responses/InvitationGone'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # ---------------------------------------------------------------------------
  # GRAPHQL
  # ---------------------------------------------------------------------------
  /graphql:
    post:
      tags: [graphql]
      operationId: graphql
      summary: Điểm vào GraphQL cho cây lồng sâu / GraphQL entry point
      description: |-
        Điểm vào duy nhất cho GraphQL. **Schema nằm ở `contracts/schema.graphqls`** — file này chỉ
        mô tả lớp vận chuyển HTTP.

        Dùng GraphQL khi client cần **tự chọn hình dạng và độ sâu** của cây lồng nhau (`F2` canvas
        phả đồ, hồ sơ kèm quan hệ). Dùng REST cho phần còn lại.

        * Chỉ hỗ trợ **query**, không có mutation — mọi thao tác ghi đi qua REST.
        * Server áp trần độ sâu và độ phức tạp truy vấn; vượt trần trả lỗi GraphQL với
          `extensions.code = QUERY_TOO_COMPLEX`.
        * Lỗi GraphQL trả `200` với mảng `errors`, mỗi lỗi có `extensions.code` **cùng tập mã**
          với `Problem.code` của REST — FE dùng chung một bộ xử lý lỗi.
        * Phân tầng riêng tư áp **y hệt REST**: trường bị ẩn trả `null` ở GraphQL
          (GraphQL không có khái niệm "trường vắng mặt"), và người còn sống không xuất hiện với Khách.
          Đây là **khác biệt duy nhất** giữa hai giao thức — FE phải nhớ.
      security:
        - bearerAuth: []
        - {}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GraphQLRequest'
      responses:
        '200':
          description: |-
            Phản hồi GraphQL. Có thể chứa đồng thời `data` và `errors` (partial result).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GraphQLResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

# =============================================================================
# COMPONENTS
# =============================================================================
components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |-
        JWT do **Keycloak** (OAuth2/OIDC) cấp, gồm cả social login Google/Zalo.
        Backend map `keycloak_sub → app_user → person`.

        Vai trò (`realm_access.roles`): `ADMIN` (kỹ thuật, toàn hệ thống) ·
        `COUNCIL` (Hội đồng Tộc biểu / Tộc trưởng, toàn dòng họ) ·
        `BRANCH_HEAD` (Trưởng Chi/Ngành — **chỉ trong chi được giao**) ·
        `MEMBER` · không token = Khách (`GUEST`).

        **Kiểm quyền hai chiều**: vai trò **và** phạm vi chi/ngành theo `ltree` của đối tượng.
        Có vai `BRANCH_HEAD` không đồng nghĩa được sửa mọi người trong họ.

        Chức danh dòng tộc (Tộc trưởng, Trưởng chi — theo huyết thống/đích tôn) là dữ liệu nghiệp vụ,
        **tách khỏi** vai kỹ thuật trong token; một người có thể giữ cả hai.

  parameters:
    PersonId:
      name: id
      in: path
      required: true
      description: Định danh nhân khẩu (UUID). / Person id.
      schema:
        type: string
        format: uuid
    ImportBatchId:
      name: batchId
      in: path
      required: true
      description: Định danh lô nhập liệu (UUID). / Import batch id.
      schema:
        type: string
        format: uuid
    ImportDuplicatePairId:
      name: pairId
      in: path
      required: true
      description: |-
        Định danh cặp nghi trùng (UUID), lấy từ `GET /import/batches/{batchId}/duplicates`.
        Khoá này **ổn định qua các lần kiểm lại**: bấm "kiểm lại" không đổi khoá của những cặp
        không đổi. / Suspected duplicate pair id.
      schema:
        type: string
        format: uuid
    AcceptLanguage:
      name: Accept-Language
      in: header
      required: false
      description: |-
        Ngôn ngữ cho nhãn và thông điệp lỗi — `vi` (mặc định) hoặc `en`.
        Danh xưng (`title`) **luôn** tiếng Việt: đó là dữ liệu nghiệp vụ, không phải chuỗi i18n.
      schema:
        type: string
        enum: [vi, en]
        default: vi
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: '`ETag` lấy từ `GET` — optimistic locking. / ETag from a prior GET.'
      schema:
        type: string
    IfNoneMatch:
      name: If-None-Match
      in: header
      required: false
      description: '`ETag` đã có ở client; trùng thì nhận `304`. / Conditional GET.'
      schema:
        type: string
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: |-
        Khóa chống trùng do client sinh (UUID). Gửi lại cùng khóa trong 24h sẽ trả **đúng phản hồi cũ**
        thay vì tạo bản ghi thứ hai. Nên dùng cho form thêm nhân khẩu trên mạng di động chập chờn.
      schema:
        type: string
        format: uuid
    Page:
      name: page
      in: query
      required: false
      description: Số trang, **bắt đầu từ 0**. / Zero-based page index.
      schema:
        type: integer
        minimum: 0
        default: 0
    Size:
      name: size
      in: query
      required: false
      description: Số phần tử mỗi trang. / Page size.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

  responses:
    BadRequest:
      description: Tham số hoặc body không hợp lệ. / Malformed request.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ValidationProblem'
    Unauthorized:
      description: Thiếu hoặc sai token. / Missing or invalid token.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: |-
        Đã xác thực nhưng không đủ quyền — sai vai trò **hoặc** đối tượng nằm ngoài phạm vi
        chi/ngành được giao (`BRANCH_SCOPE_VIOLATION`).

        Lưu ý: với **người còn sống bị ẩn theo phân tầng**, API trả `404` chứ không `403`,
        để không xác nhận rằng người đó tồn tại.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: |-
        Không tồn tại, **hoặc** người gọi không được phép biết là nó tồn tại
        (người còn sống với Khách, nhân khẩu đã xóa mềm với người không phải quản trị,
        thông báo của người khác). Hai trường hợp cố ý không phân biệt được.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    UnprocessableEntity:
      description: Body đúng cú pháp nhưng vi phạm ràng buộc nghiệp vụ. / Business rule violation.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ValidationProblem'
    InvitationNotFound:
      description: |-
        Mã không khớp lời mời nào — `code: NOT_FOUND`. Cố ý dùng lại mã sẵn có thay vì đẻ mã thứ tư:
        `ProblemCode` là danh sách đóng và ca này không mang thêm nghĩa nào.
        / Code matches no invitation.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    InvitationAlreadyUsed:
      description: |-
        Mã đã được dùng — `code: INVITATION_ALREADY_USED`. Bí mật một lần: dùng xong thì chết.
        / Invitation already redeemed.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    InvitationGone:
      description: |-
        Mã hết hạn (`INVITATION_EXPIRED`) hoặc đã bị thu hồi (`INVITATION_REVOKED`). `410 Gone` vì
        thử lại không bao giờ đổi kết quả. / Invitation expired or revoked.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    TooManyRequests:
      description: Vượt hạn mức gọi. / Rate limit exceeded.
      headers:
        Retry-After:
          schema:
            type: integer
          description: Số giây nên chờ trước khi thử lại. / Seconds to wait.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    InternalServerError:
      description: |-
        Lỗi hệ thống. `detail` **không bao giờ** chứa stack trace hay giá trị dữ liệu;
        dùng `traceId` để tra log (Loki/OTel).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

  schemas:

    # -------------------------------------------------------------------------
    # LỖI / ERRORS — RFC 7807 Problem Details
    # -------------------------------------------------------------------------
    Problem:
      type: object
      title: Problem (RFC 7807)
      description: |-
        Định dạng lỗi dùng chung cho **toàn bộ** API, theo RFC 7807 Problem Details,
        trả với `Content-Type: application/problem+json`.

        FE phân nhánh xử lý theo `code` (mã máy đọc, ổn định), **không** theo `title`/`detail`
        (là văn bản cho người, đổi theo `Accept-Language`).
      required: [type, title, status, code]
      properties:
        type:
          type: string
          format: uri
          description: URI định danh loại lỗi. / URI identifying the problem type.
          default: about:blank
        title:
          type: string
          description: Tiêu đề ngắn cho người đọc. / Short human-readable summary.
        status:
          type: integer
          description: Mã HTTP, lặp lại để tiện log. / HTTP status code.
        detail:
          type: string
          description: |-
            Diễn giải cho người dùng cuối. **Không bao giờ** chứa dữ liệu nhạy cảm (SĐT, email,
            địa chỉ), stack trace, hay câu SQL/Cypher.
        instance:
          type: string
          format: uri-reference
          description: Đường dẫn đã gọi. / The request path.
        code:
          $ref: '#/components/schemas/ProblemCode'
        traceId:
          type: string
          description: |-
            Trace id (W3C traceparent) để đối chiếu log OTel/Loki. FE nên hiện cho người dùng khi
            báo lỗi hệ thống. / Trace id for log correlation.
        timestamp:
          type: string
          format: date-time
          description: Thời điểm phát sinh lỗi (GMT+7). / When the error occurred.
      examples:
        - type: https://giapha.example.vn/problems/branch-scope-violation
          title: Ngoài phạm vi chi/ngành được giao
          status: 403
          detail: Bạn chỉ được sửa nhân khẩu thuộc chi Nhất.
          instance: /api/v1/persons/6f1b1d6e-2f8a-4d1c-9a91-9f2c1f0b7a01
          code: BRANCH_SCOPE_VIOLATION
          traceId: 00-4bf92f3577b34da6a3ce929d0e0e4736-00f067aa0ba902b7-01

    ProblemCode:
      type: string
      description: |-
        Mã lỗi máy đọc. **Danh sách đóng** — thêm mã mới là thay đổi contract, phải báo cả BE và FE.
        GraphQL dùng **cùng tập mã này** trong `errors[].extensions.code`.
      enum:
        - VALIDATION_FAILED
        - UNAUTHENTICATED
        - FORBIDDEN
        - BRANCH_SCOPE_VIOLATION
        - NOT_FOUND
        - KY_HUY_CONFLICT
        - DUPLICATE_PERSON_SUSPECTED
        - RELATIONSHIP_CYCLE
        - INVALID_RELATIONSHIP
        - PERSON_ALREADY_DELETED
        - CHANGE_REQUEST_CLOSED
        - SELF_REVIEW_FORBIDDEN
        - ACCOUNT_NOT_PROVISIONED
        - ACCOUNT_NOT_ACTIVE
        - INVALID_ROLE_ASSIGNMENT
        - INVITATION_EXPIRED
        - INVITATION_ALREADY_USED
        - INVITATION_REVOKED
        - PERSON_ALREADY_LINKED
        - ACCOUNT_ALREADY_LINKED
        - ACCOUNT_NOT_LINKED
        - SET_PASSWORD_LINK_INVALID
        - IDENTITY_PROVIDER_UNAVAILABLE
        - REMINDER_GENERATION_IN_PROGRESS
        - WEBPUSH_NOT_CONFIGURED
        - OPTIMISTIC_LOCK_CONFLICT
        - PRECONDITION_REQUIRED
        - SYSTEM_RULE_SET_IMMUTABLE
        - RULE_SET_CYCLE
        - DUPLICATE_RULE
        - LUNAR_CONVERSION_FAILED
        - DEPTH_LIMIT_EXCEEDED
        - QUERY_TOO_COMPLEX
        - RATE_LIMITED
        - INTERNAL_ERROR
        - IMP_BAD_FORMAT
        - IMP_CORRUPT_FILE
        - IMP_UNSAFE_FILE
        - IMP_MISSING_SHEET
        - IMP_MISSING_COLUMN
        - IMP_TOO_MANY_ROWS
        - IMP_FILE_TOO_LARGE
        - IMP_ALREADY_COMMITTED
        - IMP_BLOCKING_ISSUES_PRESENT
        - IMP_WARNINGS_NOT_ACKNOWLEDGED
        - IMP_DUPLICATES_UNDECIDED
        - IMP_BATCH_CLOSED
        - IMP_COMMIT_BLOCKED
        - IMP_ROLLBACK_REFUSED
      x-code-notes:
        VALIDATION_FAILED: Sai kiểu, thiếu trường bắt buộc, vi phạm ràng buộc — xem `errors[]`.
        BRANCH_SCOPE_VIOLATION: Đủ vai trò nhưng đối tượng ngoài `ltree` scope được giao.
        KY_HUY_CONFLICT: Trùng tên húy bậc trên — ghi đè được bằng `confirmTabooOverride`.
        RELATIONSHIP_CYCLE: Quan hệ cha–con sẽ tạo chu trình (A là tổ tiên của chính A).
        INVALID_RELATIONSHIP: Ví dụ `spouseOrder` cho cạnh không phải `SPOUSE`, hoặc tự kết hôn với chính mình.
        ACCOUNT_NOT_LINKED: Tài khoản đã đăng nhập nhưng chưa ghép với nhân khẩu nào trong gia phả.
        REMINDER_GENERATION_IN_PROGRESS: Một lượt sinh lịch nhắc giỗ đang chạy — thử lại sau.
        WEBPUSH_NOT_CONFIGURED: Máy chủ thiếu khoá VAPID nên Web Push tắt; giao diện nên ẩn công tắc.
        CHANGE_REQUEST_CLOSED: Yêu cầu đính chính đã duyệt/từ chối/huỷ — không thao tác thêm được.
        SELF_REVIEW_FORBIDDEN: Người gửi không được tự duyệt yêu cầu đính chính của chính mình.
        ACCOUNT_NOT_PROVISIONED: Đăng nhập Keycloak hợp lệ nhưng chưa có `app_user` tương ứng.
        ACCOUNT_NOT_ACTIVE: Tài khoản tồn tại nhưng đang bị khoá hoặc chờ duyệt.
        INVALID_ROLE_ASSIGNMENT: Ví dụ gán Trưởng Chi mà không kèm chi, hoặc tự nâng vai của mình.
        DEPTH_LIMIT_EXCEEDED: '`depth` vượt trần cho phép.'
        LUNAR_CONVERSION_FAILED: Ngày âm không tồn tại trong năm quy đổi (thường do tháng nhuận).
        IMP_BAD_FORMAT: Không phải `.xlsx` thật — nhận diện bằng chữ ký tệp, không bằng đuôi.
        IMP_CORRUPT_FILE: Tệp hỏng, thư viện đọc bảng tính không mở nổi.
        IMP_UNSAFE_FILE: Chứa DOCTYPE / thực thể ngoài XML, hoặc bung ra quá tỉ lệ cho phép (zip bomb).
        IMP_MISSING_SHEET: Thiếu hẳn trang Nhân khẩu.
        IMP_MISSING_COLUMN: Thiếu một cột bắt buộc của mẫu.
        IMP_TOO_MANY_ROWS: |-
          Vượt trần 5.000 dòng Nhân khẩu. Trần tồn tại **không phải** vì máy không chịu nổi mà vì
          không ai đối soát nổi một tệp 5.000 dòng với cuốn sổ giấy đặt cạnh — hãy tách tệp.
        IMP_FILE_TOO_LARGE: Vượt trần 10 MB; thường là có ảnh nhúng.
        IMP_ALREADY_COMMITTED: |-
          Chi này đã có một lô **đã ghi vào phả** mang đúng mã băm ấy. Vượt qua được bằng `force`
          sau khi người dùng xác nhận. Không phải "tệp trùng": tải lại một tệp giống hệt để *kiểm*
          thì không bị chặn, và đó là bước đối soát bình thường.
        IMP_BLOCKING_ISSUES_PRESENT: Bấm duyệt khi còn lỗi chặn. Backend chặn lại dù giao diện đã ẩn nút.
        IMP_WARNINGS_NOT_ACKNOWLEDGED: Còn cảnh báo mà người nhập chưa tick "tôi đã xem hết phần cần xem lại".
        IMP_DUPLICATES_UNDECIDED: Còn cặp nghi trùng chưa ai quyết — máy nghi ngờ, người quyết định.
        IMP_BATCH_CLOSED: Lô đã `COMMITTED`/`SUPERSEDED` — gửi lô mới, đừng sửa lô cũ.
        IMP_COMMIT_BLOCKED: |-
          Bước ghi dừng lại **trước khi ghi** vì lô chạm một ca mà quy ước của dòng họ chưa trả lời
          (ví dụ dâu/rể ghi `Đời` theo chồng hay theo họ gốc). **Chưa một dòng nào vào phả.**
          Chi tiết nằm trong `GET /import/batches/{batchId}/issues`, không nhân đôi vào thân lỗi.
        IMP_ROLLBACK_REFUSED: |-
          Không gỡ được lô, vì đã có người khác động vào dữ liệu mà lô ấy sinh ra. Điều kiện thật là
          `person.version` tại lúc ghi, **không** chỉ là một cửa sổ thời gian: một nút gỡ làm mất
          công người khác còn tệ hơn không có nút gỡ, vì nó tạo cảm giác an toàn giả. Thân lỗi mang
          `blockers[]` — danh sách vướng mắc bằng tiếng Việt, vì "12 người đã được sửa sau khi ghi"
          dẫn tới một hành động hoàn toàn khác với "đã quá hạn gỡ".

    ValidationProblem:
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          description: |-
            Problem kèm chi tiết lỗi từng trường, cho FE tô đỏ đúng ô nhập.
          properties:
            errors:
              type: array
              description: Danh sách lỗi theo trường. / Per-field violations.
              items:
                type: object
                required: [field, message]
                properties:
                  field:
                    type: string
                    description: |-
                      Đường dẫn trường theo JSON Pointer rút gọn, ví dụ `names[0].fullName`.
                  message:
                    type: string
                    description: Mô tả lỗi cho người dùng. / Human-readable message.
                  rejectedValue:
                    description: |-
                      Giá trị bị từ chối. **Bỏ trống với dữ liệu Tầng 3** (SĐT, email, địa chỉ) —
                      không dội giá trị nhạy cảm trở lại và cũng không ghi vào log.

    ConflictProblem:
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          description: |-
            Problem cho nhóm `409`, có thêm thông tin để FE dựng hộp thoại xác nhận ghi đè.
          properties:
            overridable:
              type: boolean
              description: |-
                `true` ⇒ client được phép gửi lại kèm cờ xác nhận ở `overrideField` để vẫn ghi.
                `false` ⇒ xung đột cứng (ví dụ `OPTIMISTIC_LOCK_CONFLICT`), phải nạp lại dữ liệu.
            overrideField:
              type: string
              description: |-
                Tên trường cờ xác nhận cần gửi lại, ví dụ `confirmTabooOverride`.
              examples: [confirmTabooOverride, confirmDuplicateOverride]
            conflicts:
              type: array
              description: |-
                Chi tiết các va chạm. Với `KY_HUY_CONFLICT` mỗi phần tử là một `TabooConflict` —
                một bậc trên có tên húy trùng. Với `DUPLICATE_PERSON_SUSPECTED` mỗi phần tử là một
                `DuplicateCandidate`.

                **Cả hai kiểu chỉ mang khoá + loại tín hiệu, không mang một trường nhân khẩu nào
                đọc từ phả.** Xem phần mô tả của từng schema để biết vì sao, và đọc kỹ trước khi
                "bổ sung" lại một trường trông như bị thiếu. FE dựng hộp thoại đối chiếu bằng cách
                cầm khoá gọi `GET /api/v1/persons/{id}` cho từng phần tử — đó là nơi bộ lọc phân
                tầng riêng tư thật sự chạy. / Keys and signal types only; hydrate via
                `GET /api/v1/persons/{id}`.
              items:
                oneOf:
                  - $ref: '#/components/schemas/TabooConflict'
                  - $ref: '#/components/schemas/DuplicateCandidate'

    TabooConflict:
      type: object
      title: Va chạm kỵ húy / Taboo-name collision
      description: |-
        Một bậc trên có **tên húy** trùng với tên đang định đặt (FR-1.6).
        Kỵ húy là tục kiêng gọi tên thật của người trên; trùng tên húy bậc trên bị xem là thất kính.

        ### Vì sao ở đây không có tên, không có đời thứ của bậc trên
        Phép dò kỵ húy chọn bậc trên theo **đời thứ** (`generation <` đời của người mới), **không**
        theo sống-mất và **không** có điều kiện chi/ngành nào. Vì vậy "bậc trên" hoàn toàn có thể
        là một ông bác **còn sống ở một chi khác** mà người đang thêm nhân khẩu không có quyền xem
        tên húy / năm sinh / nguyên quán của họ. Thân lỗi 409 đi thẳng ra HTTP, **không** đi qua bộ
        lọc phân tầng riêng tư, nên nó không được phép chở giá trị đọc từ phả.

        Bốn trường đã **bị bỏ có chủ ý** (đừng thêm lại):
        `ancestorDisplayName`, `ancestorGeneration`, `tabooName`, `relationHint`
        (chuỗi này nhúng chính đời thứ của bậc trên). Riêng `tabooName` là `person_name.full_name`
        **đọc từ phả** chứ không phải ô người dùng vừa gõ: với `GIVEN_NAME` nó là tên húy đầy đủ,
        với `UNACCENTED` nó là bản **có dấu** — hai ca mà giá trị trả về khác hẳn thứ người dùng đã
        biết.

        **Không mất gì trong ca thường gặp:** bậc trên gần như luôn là người đã khuất, mà người đã
        khuất là dữ liệu công khai (BA v2 §10), nên `GET /api/v1/persons/{ancestorPersonId}` trả
        lại đầy đủ tên húy và đời thứ để hộp thoại hiện y như trước. Khi bậc trên còn sống thì
        endpoint ấy trả đúng phần người gọi được phép xem — và đó là hành vi mong muốn.
      required: [ancestorPersonId, matchedNameType, matchKind]
      properties:
        ancestorPersonId:
          type: string
          format: uuid
          description: |-
            Nhân khẩu bậc trên bị trùng. **Khoá là thứ duy nhất nói về bậc trên**: gọi
            `GET /api/v1/persons/{id}` để lấy phần được phép xem.
            / The ancestor key; hydrate through the filtered endpoint.
        matchedNameType:
          $ref: '#/components/schemas/NameType'
        matchKind:
          type: string
          description: |-
            Kiểu khớp — nói **ô của chính người dùng** đã khớp tới mức nào, không nói giá trị bên kia.

            * `EXACT` — trùng toàn bộ tên húy.
            * `GIVEN_NAME` — trùng phần tên chính (bỏ họ và chữ đệm).
            * `UNACCENTED` — chỉ trùng khi bỏ dấu (`Đức` vs `Duc`) — cảnh báo yếu hơn.
          enum: [EXACT, GIVEN_NAME, UNACCENTED]

    DuplicateCandidate:
      type: object
      title: Ứng viên trùng bản ghi / Suspected duplicate person
      description: |-
        Một nhân khẩu **có thể đã có sẵn** trùng với nhân khẩu đang định thêm
        (`DUPLICATE_PERSON_SUSPECTED`). Đây là **cảnh báo**, không phải lệnh cấm: gửi lại kèm
        `confirmDuplicateOverride` để vẫn ghi.

        Mảng `conflicts` giữ **thứ tự giảm dần theo `score`** — phần tử đầu tiên đáng ngờ nhất.

        ### Vì sao ở đây không có tên, đời thứ, chi hay tên đã khớp
        Bộ dò quét **toàn dòng họ**, không chỉ chi của người gọi, và nó **không biết người gọi là
        ai**. Ứng viên hoàn toàn có thể là một người **còn sống** mà người đang thêm nhân khẩu
        không được xem tên húy / năm sinh / nguyên quán (khối ấy chỉ mở cho chính chủ, Hội đồng Tộc
        biểu, Admin và người đã khuất — Trưởng chi cũng không). Thân lỗi 409 **không** đi qua bộ
        lọc phân tầng riêng tư, nên bốn trường sau **bị bỏ có chủ ý** (đừng thêm lại):
        `displayName`, `generation`, `branchId`, `matchedName`.

        `matchedName` là cái bẫy kín nhất: nó là `person_name.full_name` của **hồ sơ bên kia**, nên
        khi khớp ở mức bỏ dấu (`TEN_TRUNG_KHONG_DAU`) nó phát ra bản **có dấu** mà người gọi chưa
        từng biết; phép khớp lại chạy chéo mọi lớp tên nên nó có thể chính là **tên húy**.

        ### Ranh giới
        **Được phép nói trường nào của chính người gọi vừa nhập đã khớp; không bao giờ nói một giá
        trị đọc từ phả.** `score`, `signals` và `hint` ở lại vì chúng chỉ làm đúng vế thứ nhất —
        chúng trả lời "vì sao nghi" mà không nói "người ấy là ai". Cắt nốt chúng thì người nhập
        liệu mất khả năng đối chiếu và sẽ bấm ghi đè theo phản xạ, tức là bịt lỗ rò bằng cách phá
        chính cơ chế chống trùng. / Keys and signal types only; never a value read from the tree.
      required: [score]
      properties:
        personId:
          type: [string, 'null']
          format: uuid
          description: |-
            Nhân khẩu đã có trong CSDL, và là **thứ duy nhất nói về hồ sơ bên kia**: FE gọi
            `GET /api/v1/persons/{id}` để lấy phần người gọi được phép xem (hoặc `404` khi họ không
            được biết bản ghi tồn tại).

            **`null` là bình thường**: ứng viên có thể là một dòng **chưa được ghi** trong cùng lô
            nhập liệu, khi đó định danh duy nhất là `ref`.
        ref:
          type: [string, 'null']
          description: |-
            Mã tham chiếu dòng trong lô nhập liệu (ví dụ số dòng của file Excel).
            Dùng để chỉ về đúng chỗ cho người đang nhập sửa — **dữ liệu của chính người nhập**, nên
            nó được phép có mặt. / Row reference inside an import batch.
        score:
          type: integer
          description: |-
            Điểm nghi ngờ, thang `0–100+`. Càng cao càng đáng ngờ; không có ngưỡng cứng nào được
            contract bảo đảm, backend tự chọn ngưỡng phát cảnh báo. / Suspicion score.
        signals:
          type: array
          description: |-
            Các tín hiệu góp vào `score` — cho FE giải thích cho người dùng *vì sao* nghi ngờ,
            thay vì chỉ ném ra một con số.
          items:
            type: string
            enum: [TEN_TRUNG_CO_DAU, TEN_TRUNG_KHONG_DAU, GIO_TRUNG_KHIT, NAM_SINH_KHOP,
                   NAM_SINH_LECH_IT, NAM_MAT_KHOP, CUNG_CHI, CUNG_DOI, KHAC_DOI,
                   CUNG_NGUYEN_QUAN, KHAC_GIOI]
        hint:
          type: [string, 'null']
          description: |-
            Câu giải thích sẵn cho người dùng, ví dụ "cùng chi, cùng đời, giỗ trùng khít".
            **Chỉ để hiển thị — đừng phân tích chuỗi này**; nội dung và ngôn ngữ có thể đổi bất cứ
            lúc nào. Cần logic thì đọc `signals`. / Display-only, do not parse.

    # -------------------------------------------------------------------------
    # PHÂN TRANG / PAGINATION
    # -------------------------------------------------------------------------
    PageMeta:
      type: object
      title: Thông tin phân trang / Page metadata
      description: |-
        Khối phân trang **dùng chung cho mọi endpoint trả danh sách**. Kiểu offset (`page`/`size`),
        không phải cursor — đủ cho quy mô hàng vạn nhân khẩu và cho phép nhảy trang trong UI quản trị.
      required: [page, size, totalElements, totalPages, hasNext]
      properties:
        page:
          type: integer
          description: Trang hiện tại, **bắt đầu từ 0**. / Zero-based page index.
        size:
          type: integer
          description: Số phần tử mỗi trang. / Page size.
        totalElements:
          type: integer
          format: int64
          description: |-
            Tổng số phần tử **sau khi đã lọc theo phân tầng riêng tư**. Con số này cố ý không phản ánh
            dữ liệu người gọi không được thấy. / Total after privacy filtering.
        totalPages:
          type: integer
          description: Tổng số trang. / Total page count.
        hasNext:
          type: boolean
          description: Còn trang sau hay không — FE dùng cho infinite scroll. / Whether more pages exist.
        sort:
          type: [string, 'null']
          description: Tiêu chí sắp xếp đang áp dụng. / Applied sort.

    # -------------------------------------------------------------------------
    # ENUM DÙNG CHUNG / SHARED ENUMS
    # -------------------------------------------------------------------------
    Gender:
      type: string
      description: Giới tính. / Gender.
      enum: [MALE, FEMALE, UNKNOWN]

    NameType:
      type: string
      description: |-
        Lớp tên của người Việt truyền thống — một nhân khẩu có **nhiều tên**, không chỉ một.

        * `HUY` — **tên húy**: tên thật, kiêng gọi khi người đó là bậc trên (căn cứ cảnh báo kỵ húy).
        * `TU` — **tên tự**: tên chữ, đặt khi trưởng thành.
        * `HIEU` — **tên hiệu**: bút hiệu, biệt hiệu tự đặt.
        * `THUY` — **tên thụy**: tên đặt **sau khi mất**, dùng trong tế lễ và văn khấn.
        * `THUONG_GOI` — tên thường gọi hằng ngày, thường trùng tên khai sinh hiện đại.
        * `PHAP_DANH` — pháp danh (người quy y Phật giáo).
      enum: [HUY, TU, HIEU, THUY, THUONG_GOI, PHAP_DANH]

    ShareScope:
      type: string
      title: Mức chia sẻ của một nhóm trường / Share scope of one field group
      description: |-
        Mức chia sẻ **do chính chủ thể chọn**, đặt **độc lập cho từng nhóm trường**
        (xem `PrivacySettings`).

        * `PRIVATE` — **Riêng tư**: chỉ chính chủ và Hội đồng Tộc biểu / `ADMIN`.
        * `BRANCH` — **Cùng chi**: thành viên đã đăng nhập nằm trong phạm vi `ltree` của chi/ngành.
        * `CLAN` — **Cả họ xem**: mọi thành viên đã đăng nhập.

        **Mặc định là KÍN.** Không có giá trị nào mang nghĩa "theo mặc định hệ thống": thiếu lựa
        chọn ⇒ `PRIVATE`. Một nhóm trường được thêm ở phiên bản sau cũng bắt đầu ở `PRIVATE`.

        **Đây là ý chí của chủ thể, không phải kết quả cuối.** Ba luật sau nằm ngoài tay người dùng
        và luôn thắng: Khách vãng lai không thấy **bất kỳ** người còn sống nào kể cả khi chọn
        `CLAN`; trẻ vị thành niên ẩn tối đa bất kể chọn gì; người đã khuất công khai và **không**
        bị áp mô hình đồng thuận (trừ khối `contact`, vốn là số của người thân đang sống).
      enum: [PRIVATE, BRANCH, CLAN]

    PrivacySettings:
      type: object
      title: Bản đồng thuận riêng tư / Privacy consent, per field group
      description: |-
        Năm nhóm trường, **mỗi nhóm một mức độc lập** (Nghị định 13/2023, BA v2 §10).
        Thay cho `privacyLevel` cũ — vốn là **một** mức áp cho cả con người và chỉ nới/siết được
        toàn bộ Tầng 3 một lượt.

        **Ai đọc được khối này:** chỉ **chính chủ** và `ADMIN`. Với mọi người gọi khác nó **vắng
        mặt hoàn toàn** khỏi JSON — biết người khác đang siết quyền riêng tư cũng là một dạng rò rỉ.

        **Ngữ nghĩa khi ghi:**

        * `POST /persons` — nhóm vắng mặt ⇒ `PRIVATE`. Hệ thống không tự mở hộ ai bao giờ.
        * `PATCH /persons/{id}` — **hợp nhất, không thay thế**: nhóm vắng mặt giữ nguyên mức hiện
          có, nên giao diện năm công tắc chỉ cần gửi công tắc vừa gạt. Muốn đóng hết thì đưa
          `"privacy"` vào `clearFields`.
      properties:
        occupation:
          allOf:
            - $ref: '#/components/schemas/ShareScope'
          description: Nghề nghiệp và nơi làm việc. / Occupation and workplace.
        residenceProvince:
          allOf:
            - $ref: '#/components/schemas/ShareScope'
          description: Nơi ở cấp tỉnh. / Province of residence.
        residenceFull:
          allOf:
            - $ref: '#/components/schemas/ShareScope'
          description: Địa chỉ trú quán đầy đủ. / Full address.
        contact:
          allOf:
            - $ref: '#/components/schemas/ShareScope'
          description: |-
            Điện thoại · email · Zalo — **đi thành một khối, không tách lẻ**. Ba giá trị này dẫn
            tới cùng một con người và ai có một cái thường suy ra được cái kia; tách lẻ chỉ tạo
            ảo giác kiểm soát. / Phone, email and Zalo move together as one block.
        birthDetailAndPhoto:
          allOf:
            - $ref: '#/components/schemas/ShareScope'
          description: |-
            Ngày sinh **đầy đủ** (ngày + tháng) và ảnh chân dung. Đóng nhóm này thì với người
            còn sống, thành viên thường **không thấy `birth` ở bất kỳ mức nào — kể cả người cùng
            chi, kể cả chỉ riêng năm**. Năm sinh nằm trong nhóm trường không có công tắc, và luật
            cho nhóm ấy là kín nhất có thể: người đã khuất · chính chủ · Hội đồng Tộc biểu/Admin.
            Mở nhóm này thì `birth` hiện ra ở dạng **ngày đầy đủ**, không phải riêng năm.
            / Full date of birth and portrait.

    VisibleTier:
      type: string
      description: |-
        Tầng dữ liệu mà **người gọi hiện tại** nhận được cho hồ sơ này.
        Cho FE biết mình đang ở đâu để bật/tắt affordance — **không** tiết lộ trường nào bị giấu.

        * `PUBLIC` — người đã khuất, công khai.
        * `T1` — chưa nhóm trường nào mở cho người gọi này.
        * `T2` — đã mở ít nhất một trong hai nhóm nhẹ (`occupation`, `residenceProvince`).
        * `T3` — đã mở ít nhất một nhóm nhạy cảm (`residenceFull`, `contact`,
          `birthDetailAndPhoto`), hoặc người gọi là chính chủ / Hội đồng / `ADMIN`.

        Giá trị này là **tóm tắt suy ra từ kết quả lọc thật**, không phải đầu vào của phép lọc:
        quyết định nằm ở `PrivacySettings` theo từng nhóm. Đừng dùng nó để đoán trường nào có mặt —
        `T2` không hứa `occupation` tồn tại, nó chỉ nói người gọi được phép đọc nếu có.
      enum: [PUBLIC, T1, T2, T3]

    Role:
      type: string
      description: |-
        Vai kỹ thuật trong hệ thống, lấy từ JWT. **Tách khỏi** chức danh dòng tộc
        (Tộc trưởng, Trưởng chi theo huyết thống/đích tôn) — một người có thể giữ cả hai.
      enum: [ADMIN, COUNCIL, BRANCH_HEAD, MEMBER, GUEST]

    Region:
      type: string
      description: |-
        Vùng miền, quyết định bộ quy tắc danh xưng ở cấp `REGION`.
        Giai đoạn 1 chỉ có bộ **miền Bắc**; `TRUNG` và `NAM` để trống, bổ sung ở GĐ2–3.
      enum: [BAC, TRUNG, NAM]

    RelType:
      type: string
      description: |-
        Loại cạnh quan hệ. Nguồn chân lý là cạnh trong đồ thị AGE; bảng `relationship` là bản chiếu,
        **ghi trong cùng một transaction**.

        Hướng cạnh là `from → to`:

        * `PARENT_BIO` — cha/mẹ **ruột** → con. `from` là cha/mẹ, `to` là con.
        * `PARENT_ADOPT` — cha/mẹ **nuôi** → con nuôi. Cùng hướng như trên.
        * `SPOUSE` — vợ/chồng. Cạnh **vô hướng về ngữ nghĩa** nhưng lưu một chiều;
          `spouseOrder` ghi thứ tự vợ/chồng cho trường hợp **đa thê/đa phu**
          (1 = vợ cả/chồng cả). `validFrom`/`validTo` mô tả **tái hôn, ly hôn, goá**.
        * `HEIR` — quan hệ **thừa kế hương hỏa**: `from` là người để lại, `to` là người nối dõi.
          Xem `heirKind` để biết là **đích tôn**, **thừa tự** hay **kế tự**.

        **Dâu / rể không phải một loại cạnh** — chúng được **suy ra** từ `SPOUSE` cộng huyết thống
        (vợ của con trai = con dâu). Đừng tạo cạnh riêng cho dâu/rể; rule engine danh xưng
        đã xử lý qua `side = IN_LAW`.
      enum: [PARENT_BIO, PARENT_ADOPT, SPOUSE, HEIR]

    HeirKind:
      type: string
      description: |-
        Phân loại quan hệ thừa kế hương hỏa, chỉ có nghĩa với `relType = HEIR`.

        * `DICH_TON` — **đích tôn**: cháu đích tôn, con trai trưởng của con trai trưởng,
          người chịu trách nhiệm thờ tự chính.
        * `THUA_TU` — **thừa tự**: người được chỉ định tiếp nối việc thờ cúng.
        * `KE_TU` — **kế tự**: lập người nối dõi khi một chi **tuyệt tự** (không có người nối).
      enum: [DICH_TON, THUA_TU, KE_TU]

    RelationSide:
      type: string
      description: |-
        Bên quan hệ, đầu vào của rule engine danh xưng.

        * `PATERNAL` — bên **nội** (đường cha).
        * `MATERNAL` — bên **ngoại** (đường mẹ). Ghi nhận đầy đủ, ngang bằng bên nội (FR-1.8).
        * `BLOOD` — huyết thống trực hệ, chưa/không cần phân nội–ngoại.
        * `IN_LAW` — quan hệ qua hôn nhân (dâu, rể, thông gia).
      enum: [PATERNAL, MATERNAL, BLOOD, IN_LAW]

    TreeDirection:
      type: string
      description: Chiều duyệt cây. / Traversal direction.
      enum: [DESCENDANTS, ANCESTORS, BOTH]
      default: DESCENDANTS

    RuleScope:
      type: string
      description: |-
        Cấp áp dụng của bộ quy tắc danh xưng. Hợp nhất theo thứ tự
        `DEFAULT → REGION → CLAN → BRANCH`, cấp sau **ghi đè** cấp trước khi trùng khóa luật.
      enum: [DEFAULT, REGION, CLAN, BRANCH]

    EventType:
      type: string
      description: |-
        Phân loại lễ (FR-2.3).

        * `GIO_TO` — giỗ Thủy tổ.
        * `GIO_HO` — giỗ cấp dòng họ.
        * `GIO_CHI` — giỗ cấp chi/ngành.
        * `GIO_THUONG` — giỗ thường của một cá nhân.
        * `TIEU_TUONG` — giỗ đầu (tròn 1 năm).
        * `DAI_TUONG` — giỗ hết (tròn 2 năm).
        * `CHAP_MA` — chạp mả, tảo mộ cuối năm.
        * `MUNG_THO` — mừng thọ **bậc cao niên** (người **còn sống** — chịu phân tầng riêng tư).
          **Đổi nghĩa:** trước đây gộp cả sinh nhật thường; nay sinh nhật có mã riêng.
        * `SINH_NHAT` — sinh nhật người **còn sống**. Chịu phân tầng riêng tư: ngày sinh đầy đủ
          thuộc nhóm `birthDetailAndPhoto` của `PrivacySettings`, nên sự kiện này chỉ hiện với
          người mà chủ thể đã mở nhóm đó.
        * `KHANH_THANH` — khánh thành hoặc tu bổ từ đường.
        * `HOP_HO` — họp họ.
        * `CUOI_HOI` — cưới hỏi.
        * `KHAC` — loại khác. **Đổi nghĩa:** không còn gộp họp họ / cưới hỏi / khánh thành.
      enum: [GIO_TO, GIO_HO, GIO_CHI, GIO_THUONG, TIEU_TUONG, DAI_TUONG, CHAP_MA, MUNG_THO,
             SINH_NHAT, KHANH_THANH, HOP_HO, CUOI_HOI, KHAC]

    NotificationCategory:
      type: string
      description: |-
        * `GIO_REMINDER` — nhắc giỗ (mốc 7/3/1 ngày).
        * `EVENT` — thông báo sự kiện dòng họ khác.
        * `CHANGE_REQUEST` — yêu cầu đính chính (Giai đoạn 2).
        * `SYSTEM` — thông báo hệ thống.
      enum: [GIO_REMINDER, EVENT, CHANGE_REQUEST, SYSTEM]

    # -------------------------------------------------------------------------
    # VALUE OBJECT: NGÀY SONG LỊCH / DUAL CALENDAR DATES
    # -------------------------------------------------------------------------
    LunarDate:
      type: object
      title: Ngày âm lịch / Lunar date
      description: |-
        Ngày âm lịch Việt Nam, quy đổi theo thuật toán **Hồ Ngọc Đức** ở múi giờ **GMT+7**.

        Lưu ý múi giờ: lịch âm Việt Nam (GMT+7) **có năm lệch** lịch âm Trung Quốc (GMT+8).
        Mọi quy đổi phải do backend thực hiện — FE không tự tính.
      required: [year, month, day]
      properties:
        year:
          type: integer
          description: Năm âm lịch. / Lunar year.
          examples: [1957]
        month:
          type: integer
          minimum: 1
          maximum: 12
          description: Tháng âm lịch 1–12. / Lunar month.
        day:
          type: integer
          minimum: 1
          maximum: 30
          description: Ngày âm lịch 1–30 (tháng âm không có ngày 31). / Lunar day.
        leap:
          type: boolean
          default: false
          description: |-
            `true` nếu là **tháng nhuận**. Bỏ qua cờ này là nguồn bug số một của hệ thống:
            giỗ sẽ lệch nguyên một tháng mà không có lỗi nào được ném ra.
        canChi:
          type: [string, 'null']
          description: |-
            Can chi của **năm** (chỉ đọc, backend sinh), ví dụ `Đinh Dậu`. / Sexagenary year name.
        yearLabel:
          type: [string, 'null']
          description: Nhãn hiển thị đầy đủ, ví dụ `Mùng 3 tháng 8 nhuận, năm Đinh Dậu`. / Display label.

    DateDual:
      type: object
      title: Ngày song lịch / Dual-calendar date
      description: |-
        Một mốc thời gian ghi **cả hai lịch**. Backend tự điền phần còn thiếu khi ghi
        (gửi `solar` thì `lunar` được tính ra và ngược lại).

        Với ngày **mất**, `lunar` là **nguồn chân lý** để tính ngày giỗ hằng năm — dòng họ giỗ theo
        ngày âm, không theo ngày dương.

        Dữ liệu gia phả cổ thường **chỉ có ngày âm**, đôi khi chỉ có năm. Cả hai nhánh đều nullable,
        và `precision` cho biết mức chính xác thật sự.
      properties:
        solar:
          type: [string, 'null']
          format: date
          description: Ngày dương lịch `YYYY-MM-DD`. / Gregorian date.
        lunar:
          oneOf:
            - $ref: '#/components/schemas/LunarDate'
            - type: 'null'
          description: Ngày âm lịch. / Lunar date.
        precision:
          type: string
          description: |-
            Mức chính xác của dữ liệu gốc: `DAY` đủ ngày · `MONTH` chỉ biết tháng ·
            `YEAR` chỉ biết năm · `UNKNOWN` không rõ. FE hiển thị theo mức này,
            đừng bịa ngày `01` rồi trình bày như thể đã biết chắc.
          enum: [DAY, MONTH, YEAR, UNKNOWN]
          default: DAY

    # -------------------------------------------------------------------------
    # TÊN ĐA LỚP / MULTI-LAYER NAMES
    # -------------------------------------------------------------------------
    PersonName:
      type: object
      title: Một lớp tên / One name layer
      description: |-
        Một trong nhiều tên của một nhân khẩu (bảng `person_name`, quan hệ 1–N).
      required: [nameType, fullName, isPrimary]
      properties:
        id:
          type: string
          format: uuid
          description: Id bản ghi tên (chỉ đọc). / Name record id, read-only.
        nameType:
          $ref: '#/components/schemas/NameType'
        fullName:
          type: string
          maxLength: 200
          description: Tên Quốc ngữ, có dấu. / Vietnamese name in Latin script.
          examples: [Nguyễn Văn Đức]
        nameHanNom:
          type: [string, 'null']
          maxLength: 200
          description: |-
            Tên chữ **Hán–Nôm** nếu có (từ gia phả giấy, bia đá, hoành phi).
            Đây là chuỗi Unicode CJK, không phải phiên âm. / Optional Han-Nom form.
          examples: [阮文德]
        nameUnaccented:
          type: [string, 'null']
          description: |-
            Dạng **không dấu**, do backend sinh (generated column), phục vụ tìm kiếm.
            **Chỉ đọc** — client gửi lên sẽ bị bỏ qua. / Server-generated, read-only.
          examples: [nguyen van duc]
        isPrimary:
          type: boolean
          description: |-
            Tên hiển thị mặc định. Mỗi nhân khẩu có **đúng một** tên `isPrimary = true`.
            / Exactly one primary name per person.
        note:
          type: [string, 'null']
          maxLength: 500
          description: Ghi chú xuất xứ tên (ví dụ "chép theo bia mộ"). / Provenance note.

    PersonNameInput:
      type: object
      description: Dữ liệu tạo/sửa một lớp tên. / Input form of a name layer.
      required: [nameType, fullName]
      properties:
        nameType:
          $ref: '#/components/schemas/NameType'
        fullName:
          type: string
          minLength: 1
          maxLength: 200
        nameHanNom:
          type: [string, 'null']
          maxLength: 200
        isPrimary:
          type: boolean
          default: false
          description: |-
            Nếu cả danh sách không có tên nào đặt `true`, backend chọn tên đầu tiên làm tên chính.
        note:
          type: [string, 'null']
          maxLength: 500

    # -------------------------------------------------------------------------
    # CHI / NGÀNH — BRANCH
    # -------------------------------------------------------------------------
    BranchRef:
      type: object
      title: Tham chiếu chi/ngành / Branch reference
      description: |-
        Dạng rút gọn của **chi / ngành / cành / nhánh** — bốn cấp phân nhánh trong gia phả Việt.
        Không dịch sang "branch/sub-branch" trong dữ liệu vì thứ bậc bốn cấp không có tương đương tiếng Anh.
      required: [id, name, path]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          description: Tên hiển thị, **có dấu**. / Display name, accented.
          examples: [Chi Nhất — Ngành Trưởng]
        path:
          type: string
          description: |-
            Đường dẫn `ltree`, dùng cho phạm vi RBAC và truy vấn nhánh con.
            **Nhãn `ltree` không nhận dấu tiếng Việt** nên path sinh từ slug không dấu;
            tên hiển thị có dấu nằm ở `name`. / ltree path built from an unaccented slug.
          pattern: '^[A-Za-z0-9_]+(\.[A-Za-z0-9_]+)*$'
          examples: [root.chi_nhat.nganh_truong]
        region:
          oneOf:
            - $ref: '#/components/schemas/Region'
            - type: 'null'
          description: Vùng miền của chi, chọn bộ quy tắc danh xưng cấp `REGION`.

    # -------------------------------------------------------------------------
    # NHÂN KHẨU / PERSON
    # -------------------------------------------------------------------------
    PersonDto:
      type: object
      title: Hồ sơ nhân khẩu / Person
      description: |-
        Hồ sơ một nhân khẩu, **đã lọc theo phân tầng riêng tư**.

        ### Đọc kỹ: cùng một schema, khác tập trường

        Mọi trường ngoài `id`, `isAlive`, `names`, `meta` đều **có thể vắng mặt**. Vắng mặt có
        **hai nguyên nhân không phân biệt được** (cố ý):

        1. Dữ liệu không tồn tại (gia phả cổ thiếu thông tin).
        2. Người gọi không đủ quyền xem trường đó.

        Vì vậy FE **không được** render placeholder kiểu "dữ liệu bị ẩn" cho trường vắng mặt —
        làm thế là tự tay tiết lộ điều mà việc lọc đang cố giấu.

        Trường bị ẩn được **loại khỏi JSON**, không trả `null`, không trả chuỗi rỗng, không trả `"***"`.
        (Ở GraphQL thì trả `null`, vì GraphQL không có khái niệm trường vắng mặt.)

        ### Tầng nào chứa gì (BA v2 §10)

        | Tầng | Trường trong DTO |
        |---|---|
        | Công khai (người đã khuất) | tất cả các trường phả hệ dưới đây |
        | T1 | `id` `names` `generation` `gender` `isAlive` `primaryBranch` `meta` |
        | T2 | thêm `birth` **chỉ phần năm**, `occupation`, `currentPlaceProvince`, `nativePlace` |
        | T3 | thêm `contact`, `birth` đầy đủ, `currentPlaceFull`, `avatarUrl`, `attributes`, `biography` |
      required: [id, isAlive, names, meta]
      properties:
        id:
          type: string
          format: uuid
        names:
          type: array
          description: |-
            Các lớp tên. Với người còn sống ở Tầng 1, danh sách có thể **chỉ gồm tên chính** —
            tên húy/tự/hiệu là dữ liệu nhạy cảm về lễ nghi, chỉ mở cho vai có quyền.
          items:
            $ref: '#/components/schemas/PersonName'
        displayName:
          type: string
          description: |-
            Tên hiển thị đã chọn sẵn (tên có `isPrimary = true`), để FE khỏi phải tự dò.
            / Convenience field, the primary name.
        gender:
          $ref: '#/components/schemas/Gender'
        generation:
          type: [integer, 'null']
          description: |-
            Đời thứ, tính từ **Thủy tổ = 1**. `null` khi nhân khẩu chưa được nối vào cây.
            Backend suy ra từ quan hệ cha–con; client **không** gửi lên.
        isAlive:
          type: boolean
          description: |-
            Còn sống hay đã khuất. Quyết định toàn bộ tầng hiển thị.
            Người đã khuất là dữ liệu công khai theo mục đích gia phả.
        isDeleted:
          type: boolean
          description: |-
            Đã **xóa mềm**. Chỉ xuất hiện với `ADMIN`/`COUNCIL`; vai khác không thấy cả bản ghi.
            Node vẫn nằm trong đồ thị để cây không gãy.
        birth:
          oneOf:
            - $ref: '#/components/schemas/DateDual'
            - type: 'null'
          description: |-
            Ngày sinh song lịch. **Người còn sống**: Tầng 2 chỉ nhận phần **năm**
            (`precision = YEAR`); ngày đầy đủ là Tầng 3.
        death:
          oneOf:
            - $ref: '#/components/schemas/DateDual'
            - type: 'null'
          description: |-
            Ngày mất song lịch. `death.lunar` là **nguồn chân lý để tính giỗ**.
            Luôn vắng mặt khi `isAlive = true`.
        nativePlace:
          type: [string, 'null']
          description: |-
            **Nguyên quán** — quê gốc của dòng họ, khác nơi ở hiện tại.
            Là dữ liệu phả hệ nên công khai với người đã khuất. / Ancestral home.
        currentPlaceProvince:
          type: [string, 'null']
          description: |-
            Nơi ở hiện tại **cấp tỉnh/thành** — Tầng 2. Cố ý tách khỏi địa chỉ đầy đủ
            để mở được mức "đang sống ở đâu" mà không lộ địa chỉ nhà.
        currentPlaceFull:
          type: [string, 'null']
          description: Địa chỉ trú quán **đầy đủ** — Tầng 3. / Full address, Tier 3.
        occupation:
          type: [string, 'null']
          description: Nghề nghiệp — Tầng 2. / Occupation, Tier 2.
        biography:
          type: [string, 'null']
          description: Tiểu sử. Công khai với người đã khuất; với người còn sống là Tầng 3.
        avatarUrl:
          type: [string, 'null']
          format: uri
          description: |-
            URL ảnh chân dung, trỏ tới **MinIO qua presigned URL có hạn dùng** — không phải blob.
            Ảnh của người còn sống là **Tầng 3**. / Presigned MinIO URL.
        primaryBranch:
          oneOf:
            - $ref: '#/components/schemas/BranchRef'
            - type: 'null'
          description: Chi/ngành chính, dùng cho phạm vi RBAC. / Primary branch, drives RBAC scope.
        contact:
          oneOf:
            - $ref: '#/components/schemas/ContactInfo'
            - type: 'null'
          description: |-
            **Toàn bộ khối này là Tầng 3.** Vắng mặt hoàn toàn (không phải object rỗng)
            khi người gọi không đủ quyền.
        attributes:
          type: [object, 'null']
          additionalProperties: true
          description: |-
            Thuộc tính mở rộng dạng JSONB (học vị, chức tước, khoa bảng, quân hàm…).
            Khóa do dòng họ tự đặt, contract không ràng buộc.
            Với người còn sống, khối này là Tầng 3 vì nội dung không kiểm soát trước được.
        privacy:
          oneOf:
            - $ref: '#/components/schemas/PrivacySettings'
            - type: 'null'
          description: |-
            Bản đồng thuận riêng tư của chủ thể — năm nhóm trường, năm mức độc lập. Chỉ
            **chính chủ** và `ADMIN` nhận được khối này; với vai khác nó **vắng mặt hoàn toàn**,
            vì biết người khác đang siết quyền riêng tư cũng là một dạng rò rỉ.
        createdAt:
          type: [string, 'null']
          format: date-time
        updatedAt:
          type: [string, 'null']
          format: date-time
        version:
          type: [integer, 'null']
          format: int64
          description: |-
            Phiên bản cho optimistic locking; cũng là giá trị dùng sinh `ETag`.
            / Optimistic-lock version, mirrored in the ETag.
        relationships:
          type: array
          description: |-
            Quan hệ lõi cha–con–vợ–chồng của nhân khẩu này (thuộc **Tầng 1**, nên thành viên đã
            đăng nhập luôn thấy). Chỉ chứa cạnh mà **đầu kia cũng được phép hiển thị** với người gọi —
            quan hệ tới một người còn sống bị ẩn sẽ **không xuất hiện**, đúng như ở `/tree`.

            Đây là quan hệ trực tiếp một bậc, **không** phải cả cây; muốn nhiều bậc thì gọi `/tree`
            hoặc GraphQL.
          items:
            $ref: '#/components/schemas/RelationshipDto'
        meta:
          $ref: '#/components/schemas/PersonAccessMeta'

    ContactInfo:
      type: object
      title: Liên hệ — Tầng 3 / Contact — Tier 3
      description: |-
        **Dữ liệu nhạy cảm theo Nghị định 13/2023.** Toàn khối được điều khiển bởi đúng một công
        tắc — `privacy.contact` (xem `PrivacySettings`). Mở cho: **chính chủ**, Hội đồng Tộc biểu /
        `ADMIN`, và người nằm trong phạm vi mà chủ thể đã chọn. Trưởng chi được xem để liên hệ
        **chỉ khi** `privacy.contact` ở mức `BRANCH` trở lên.

        Trong hồ sơ một **người đã khuất**, khối này vẫn bị giấu với Khách và thành viên thường:
        số ghi ở đó trên thực tế là số của người thân **đang sống**.

        Không bao giờ ghi các giá trị này vào `audit_log`, log ứng dụng, hay `rejectedValue` của lỗi.
      properties:
        phone:
          type: [string, 'null']
          description: Số điện thoại. / Phone number.
        email:
          type: [string, 'null']
          format: email
        zaloId:
          type: [string, 'null']
          description: Zalo id, dùng cho kênh nhắc giỗ ở Giai đoạn 2. / Zalo id, Phase 2 channel.

    PersonAccessMeta:
      type: object
      title: Ngữ cảnh truy cập / Access context
      description: |-
        Cho FE biết **người gọi hiện tại** được làm gì với hồ sơ này, để render đúng affordance
        thay vì gọi thử rồi ăn `403`. Đây là thông tin về **quyền của người gọi**,
        không phải về dữ liệu bị giấu.
      required: [visibleTier, canEdit, canDelete]
      properties:
        visibleTier:
          $ref: '#/components/schemas/VisibleTier'
        canEdit:
          type: boolean
          description: Người gọi được `PATCH` hồ sơ này. / Caller may PATCH.
        canDelete:
          type: boolean
          description: Người gọi được xóa mềm hồ sơ này. / Caller may soft-delete.
        canRequestCorrection:
          type: boolean
          default: false
          description: |-
            Người gọi được gửi yêu cầu đính chính (Giai đoạn 2). Giai đoạn 1 luôn `false`.
        isSelf:
          type: boolean
          default: false
          description: Hồ sơ này chính là người đang đăng nhập. / This is the caller's own profile.
        callerRole:
          $ref: '#/components/schemas/Role'

    PersonSummaryDto:
      type: object
      title: Nhân khẩu rút gọn / Person summary
      description: |-
        Dạng gọn cho danh sách, kết quả tìm kiếm và node trên phả đồ.
        Chỉ chứa dữ liệu **Tầng 1 trở xuống** — an toàn để hiển thị hàng loạt.
      required: [id, displayName, isAlive]
      properties:
        id:
          type: string
          format: uuid
        displayName:
          type: string
          description: Tên chính có dấu. / Primary name.
        nameHanNom:
          type: [string, 'null']
        gender:
          $ref: '#/components/schemas/Gender'
        generation:
          type: [integer, 'null']
        isAlive:
          type: boolean
        birthYear:
          type: [integer, 'null']
          description: |-
            Chỉ **năm** sinh — Tầng 2 với người còn sống, công khai với người đã khuất.
        deathYear:
          type: [integer, 'null']
        primaryBranch:
          oneOf:
            - $ref: '#/components/schemas/BranchRef'
            - type: 'null'
        nativePlace:
          type: [string, 'null']
        avatarUrl:
          type: [string, 'null']
          format: uri
          description: Ảnh đại diện; với người còn sống là Tầng 3 nên thường vắng mặt.
        matchedNameType:
          oneOf:
            - $ref: '#/components/schemas/NameType'
            - type: 'null'
          description: |-
            Chỉ có trong kết quả `/persons/search`: lớp tên nào đã khớp truy vấn.
            Cho phép FE hiện "khớp ở tên tự" thay vì để người dùng bối rối vì tên hiện ra khác tên đã gõ.

    PersonSummaryPage:
      type: object
      description: Trang kết quả nhân khẩu. / A page of person summaries.
      required: [items, page]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PersonSummaryDto'
        page:
          $ref: '#/components/schemas/PageMeta'

    # -------------------------------------------------------------------------
    # QUAN HỆ / RELATIONSHIPS
    # -------------------------------------------------------------------------
    RelationshipDto:
      type: object
      title: Quan hệ / Relationship
      description: |-
        Một cạnh quan hệ. Hướng luôn là `fromPersonId → toPersonId`; ý nghĩa của hướng
        phụ thuộc `relType` (xem mô tả `RelType`).
      required: [id, fromPersonId, toPersonId, relType]
      properties:
        id:
          type: string
          format: uuid
        fromPersonId:
          type: string
          format: uuid
        toPersonId:
          type: string
          format: uuid
        relType:
          $ref: '#/components/schemas/RelType'
        heirKind:
          oneOf:
            - $ref: '#/components/schemas/HeirKind'
            - type: 'null'
          description: Chỉ có nghĩa khi `relType = HEIR`. / Only meaningful for HEIR.
        spouseOrder:
          type: [integer, 'null']
          minimum: 1
          description: |-
            Thứ tự vợ/chồng cho **đa thê/đa phu** — `1` là vợ cả/chồng cả.
            Chỉ có nghĩa khi `relType = SPOUSE`.
        validFrom:
          type: [string, 'null']
          format: date
          description: |-
            Hiệu lực từ (ngày cưới). Với `SPOUSE`, cùng `validTo` mô tả **tái hôn, ly hôn, goá**;
            một người có thể có nhiều cạnh `SPOUSE` với khoảng hiệu lực không giao nhau.
        validTo:
          type: [string, 'null']
          format: date
          description: |-
            Hiệu lực đến (ly hôn hoặc một bên mất). `null` = còn hiệu lực.
        note:
          type: [string, 'null']
          maxLength: 500
          description: |-
            Ghi chú, ví dụ "con riêng của vợ", "nhận nuôi năm 1975", "lập kế tự do chi trên tuyệt tự".
        otherPerson:
          oneOf:
            - $ref: '#/components/schemas/PersonSummaryDto'
            - type: 'null'
          description: |-
            Tóm tắt của **đầu kia** xét theo hồ sơ đang xem, đã qua đúng bộ lọc phân tầng riêng tư
            của người gọi. Vắng mặt ở lối ra không có khái niệm "hồ sơ đang xem" (GraphQL).
            Cạnh nào có đầu kia không hiển thị được thì **cả cạnh** đã bị loại, nên trường này
            không bao giờ là một tóm tắt "đã che".

    RelationshipLinkInput:
      type: object
      title: Nối quan hệ khi tạo nhân khẩu / Relationship link on create
      description: |-
        Nối nhân khẩu **đang được tạo** vào cây. Vì id của người mới chưa tồn tại lúc gửi request,
        cạnh được mô tả bằng "người kia là ai" (`otherPersonId`) và "người kia đứng ở đầu nào của cạnh"
        (`otherPersonRole`).

        Ví dụ thường gặp:

        * Thêm **con** của ông X: `{ relType: PARENT_BIO, otherPersonId: X, otherPersonRole: SOURCE }`
          (X là cha ⇒ X ở đầu `from`).
        * Thêm **cha** của anh Y: `{ relType: PARENT_BIO, otherPersonId: Y, otherPersonRole: TARGET }`
          (người mới là cha ⇒ người mới ở đầu `from`, Y ở đầu `to`).
        * Thêm **vợ thứ hai** của ông Z:
          `{ relType: SPOUSE, otherPersonId: Z, otherPersonRole: SOURCE, spouseOrder: 2 }`.
        * Thêm **con nuôi**: dùng `PARENT_ADOPT`. Con nuôi và con ruột là **hai loại cạnh khác nhau**,
          không phải một cờ trên cùng cạnh, vì suy luận danh xưng đối xử khác nhau.

        Backend ghi cạnh AGE và dòng `relationship` trong **cùng một transaction**;
        rollback thì cả hai cùng biến mất.
      required: [relType, otherPersonId, otherPersonRole]
      properties:
        relType:
          $ref: '#/components/schemas/RelType'
        otherPersonId:
          type: string
          format: uuid
          description: Nhân khẩu đã tồn tại ở đầu kia của cạnh. / The existing person on the other end.
        otherPersonRole:
          type: string
          description: |-
            Người kia đứng ở đầu nào của cạnh `from → to`:
            `SOURCE` = người kia là `from`; `TARGET` = người kia là `to` (người mới là `from`).
          enum: [SOURCE, TARGET]
        heirKind:
          oneOf:
            - $ref: '#/components/schemas/HeirKind'
            - type: 'null'
        spouseOrder:
          type: [integer, 'null']
          minimum: 1
        validFrom:
          type: [string, 'null']
          format: date
        validTo:
          type: [string, 'null']
          format: date
        note:
          type: [string, 'null']
          maxLength: 500

    # -------------------------------------------------------------------------
    # REQUEST BODY: TẠO / SỬA NHÂN KHẨU
    # -------------------------------------------------------------------------
    CreatePersonRequest:
      type: object
      title: Thêm nhân khẩu / Create person
      description: |-
        Dữ liệu thêm một nhân khẩu. `generation` **không** nhận từ client — backend suy ra từ
        quan hệ cha–con để không bao giờ lệch với đồ thị.
      required: [names, gender, isAlive]
      properties:
        names:
          type: array
          minItems: 1
          description: |-
            Ít nhất một lớp tên. Nếu có tên `HUY`, backend kiểm tra **kỵ húy** trước khi ghi.
          items:
            $ref: '#/components/schemas/PersonNameInput'
        gender:
          $ref: '#/components/schemas/Gender'
        isAlive:
          type: boolean
          description: |-
            `false` thì nên có `death`. Con gái và bên ngoại được ghi nhận **đầy đủ, ngang bằng**
            con trai — đây là mặc định hệ thống (FR-1.8), không phải tùy chọn.
        birth:
          oneOf:
            - $ref: '#/components/schemas/DateDual'
            - type: 'null'
          description: |-
            Gửi `solar` hoặc `lunar` hoặc cả hai — backend tự điền phần còn thiếu.
            Gửi cả hai mà **mâu thuẫn** ⇒ `422 VALIDATION_FAILED`, không tự ý chọn bên nào.
        death:
          oneOf:
            - $ref: '#/components/schemas/DateDual'
            - type: 'null'
          description: |-
            Bắt buộc phải có phần `lunar` (hoặc `solar` để backend quy đổi ra `lunar`) nếu muốn
            hệ thống sinh nhắc **giỗ** — `death.lunar` là gốc tính giỗ.
        nativePlace:
          type: [string, 'null']
        currentPlaceProvince:
          type: [string, 'null']
        currentPlaceFull:
          type: [string, 'null']
        occupation:
          type: [string, 'null']
        biography:
          type: [string, 'null']
        primaryBranchId:
          type: [string, 'null']
          format: uuid
          description: |-
            Chi/ngành chính. Bỏ trống thì backend kế thừa chi của cha/mẹ trong `initialRelationships`.
            Người tạo phải có quyền trong chi này (`BRANCH_SCOPE_VIOLATION` nếu không).
        contact:
          oneOf:
            - $ref: '#/components/schemas/ContactInfo'
            - type: 'null'
          description: Dữ liệu Tầng 3 — chỉ gửi khi thật sự cần và có sự đồng ý của chủ thể.
        attributes:
          type: [object, 'null']
          additionalProperties: true
        privacy:
          oneOf:
            - $ref: '#/components/schemas/PrivacySettings'
            - type: 'null'
          description: |-
            Nhóm vắng mặt (hoặc cả khối vắng mặt) ⇒ `PRIVATE`. **Mặc định là KÍN.**
            Trẻ vị thành niên ⇒ backend ép kín hoàn toàn bất kể client gửi gì.
        initialRelationships:
          type: array
          description: |-
            Nối ngay vào cây trong **cùng transaction** với việc tạo nhân khẩu.
            Để trống thì nhân khẩu tồn tại nhưng **chưa nằm trong cây** (`generation = null`)
            và sẽ không xuất hiện trên phả đồ cho tới khi được nối.
          items:
            $ref: '#/components/schemas/RelationshipLinkInput'
        confirmTabooOverride:
          type: boolean
          default: false
          description: |-
            **Cờ xác nhận kỵ húy.** Gửi `true` để chấp nhận ghi đè cảnh báo trùng tên húy bậc trên
            đã nhận ở lần gọi trước (`409 KY_HUY_CONFLICT`).

            FE **không được** mặc định `true` để "cho tiện" — mất cảnh báo là mất luôn giá trị của FR-1.6.
            Việc ghi đè được lưu vào `audit_log` kèm danh sách va chạm.
        confirmDuplicateOverride:
          type: boolean
          default: false
          description: |-
            Cờ xác nhận cho `409 DUPLICATE_PERSON_SUSPECTED` — người dùng khẳng định đây là người khác,
            không phải bản trùng.
        note:
          type: [string, 'null']
          maxLength: 1000
          description: Ghi chú nguồn dữ liệu (ví dụ "chép từ gia phả giấy 1998, trang 12").

    UpdatePersonRequest:
      type: object
      title: Sửa nhân khẩu / Update person
      description: |-
        Cập nhật một phần. **Trường vắng mặt = giữ nguyên**; muốn xóa trắng thì dùng `clearFields`.
        Không dùng `null` để xóa (xem mô tả của `PATCH /persons/{id}`).
      properties:
        names:
          type: array
          description: |-
            Nếu gửi, **thay thế toàn bộ** danh sách tên. Muốn thêm một tên thì gửi lại cả danh sách cũ
            cộng tên mới. Thêm/sửa tên `HUY` sẽ kích hoạt kiểm tra kỵ húy.
          items:
            $ref: '#/components/schemas/PersonNameInput'
        gender:
          $ref: '#/components/schemas/Gender'
        isAlive:
          type: boolean
          description: |-
            Chuyển `true → false` là **báo mất**: nên gửi kèm `death`. Backend sẽ sinh sự kiện giỗ
            từ `death.lunar` và ẩn các trường Tầng 2/3 khỏi luồng lọc người sống.

            **Suy diễn (quyết định của Hội đồng).** Gửi `death` mà KHÔNG gửi `isAlive` trên một
            người đang sống thì backend tự đặt `isAlive = false` và lưu ngày mất — không từ chối,
            không im lặng vứt đi. `audit_log.note` được đánh dấu là suy diễn để về sau còn phân biệt
            với trường hợp người nhập liệu tuyên bố tường minh.

            **Mâu thuẫn tường minh bị từ chối.** Gửi `isAlive: true` KÈM `death` có giá trị thì trả
            `422 VALIDATION_FAILED` — client đang nói hai điều trái ngược, khác hẳn với việc quên
            gửi `isAlive`.

            **Đính chính "thật ra còn sống":** gửi `isAlive: true` và đưa `death` vào `clearFields`.

            > ⚠️ Báo mất không chỉ đổi một cờ. Theo BA v2 §10, hồ sơ chuyển từ "ẩn mặc định" sang
            > **công khai với cả Khách chưa đăng nhập**, đồng thời sinh lịch nhắc giỗ. Giao diện
            > phải xác nhận với người dùng trước khi gửi.
        isDeleted:
          type: boolean
          description: |-
            Chỉ `ADMIN`/`COUNCIL`. Dùng để **khôi phục** bản ghi đã xóa mềm (`false`).
            Đặt `true` qua đây tương đương `DELETE`.
        birth:
          $ref: '#/components/schemas/DateDual'
        death:
          allOf:
            - $ref: '#/components/schemas/DateDual'
          description: |-
            `death.lunar` là **nguồn sự thật** cho ngày giỗ.

            Đưa `death` vào `clearFields` trên một người đã mất chỉ **gỡ ngày giỗ**, KHÔNG đặt lại
            `isAlive = true` — ràng buộc `ck_person_alive_vs_death` chỉ cấm chiều ngược lại (người
            còn sống mà có ngày mất). Gia phả cổ thường ghi nhận một cụ đã mất mà không rõ ngày.
        nativePlace:
          type: string
        currentPlaceProvince:
          type: string
        currentPlaceFull:
          type: string
        occupation:
          type: string
        biography:
          type: string
        primaryBranchId:
          type: string
          format: uuid
          description: |-
            Chuyển chi/ngành. Người gọi phải có quyền ở **cả chi cũ và chi mới**.
        contact:
          $ref: '#/components/schemas/ContactInfo'
        attributes:
          type: object
          additionalProperties: true
          description: Nếu gửi, **thay thế toàn bộ** object `attributes`.
        privacy:
          allOf:
            - $ref: '#/components/schemas/PrivacySettings'
          description: |-
            **Hợp nhất, không thay thế** — khác hẳn `names` và `attributes`. Nhóm trường vắng mặt
            giữ nguyên mức hiện có. Đưa `"privacy"` vào `clearFields` để đóng cả năm nhóm về
            `PRIVATE`.

            Chỉ **chính chủ** (hoặc `ADMIN` thay mặt) được đổi; vai khác nhận `403 FORBIDDEN`.
        clearFields:
          type: array
          description: |-
            Danh sách tên trường cần **xóa trắng** (đặt về `null`), ví dụ
            `["occupation", "contact.phone"]`. Trường vừa nằm trong `clearFields` vừa có giá trị
            trong body ⇒ `422`.
          items:
            type: string
        confirmTabooOverride:
          type: boolean
          default: false
        note:
          type: string
          maxLength: 1000
          description: Lý do sửa, ghi vào `audit_log`. / Reason, recorded in the audit log.

    ChangeRequestAccepted:
      type: object
      title: Đã tạo yêu cầu đính chính (GĐ2) / Change request created (Phase 2)
      description: |-
        Phản hồi `202` khi người gọi chưa đủ quyền ghi trực tiếp: thay đổi được xếp hàng chờ
        Trưởng chi duyệt.

        **Lối `202` từ `/persons` vẫn chưa bật ở Giai đoạn 1.** Nhưng luồng đính chính *đứng riêng*
        thì đã sống: gửi bằng `POST /change-requests`, và duyệt một `UPDATE_PERSON` nay **ghi thật**
        vào phả. Xem tag `change-requests`.
      required: [changeRequestId, status]
      properties:
        changeRequestId:
          type: string
          format: uuid
        status:
          type: string
          enum: [PENDING]
        targetPersonId:
          type: [string, 'null']
          format: uuid
          description: Nhân khẩu bị ảnh hưởng; `null` khi là yêu cầu **thêm mới**.
        submittedAt:
          type: string
          format: date-time
        message:
          type: string
          description: Thông điệp hiển thị cho người gửi. / Message to show the requester.

    # -------------------------------------------------------------------------
    # PHẢ ĐỒ / TREE PROJECTION
    # -------------------------------------------------------------------------
    TreeProjection:
      type: object
      title: Projection cây / Tree projection
      description: |-
        Đồ thị **phẳng** (`nodes` + `edges`), không lồng nhau — nạp thẳng vào React Flow.
        Cần cây lồng theo hình dạng tự chọn thì dùng GraphQL.

        FE gọi nhiều lần cho nhiều nhánh rồi **ghép** vào cùng một đồ thị; `nodes` và `edges`
        có thể trùng lặp giữa các lần gọi nên phải khử trùng theo `id`.
      required: [rootId, nodes, edges, meta]
      properties:
        rootId:
          type: string
          format: uuid
          description: Nhân khẩu gốc của lần gọi này. / Root of this projection.
        nodes:
          type: array
          items:
            $ref: '#/components/schemas/TreeNode'
        edges:
          type: array
          description: |-
            Chỉ chứa cạnh mà **cả hai đầu** đều nằm trong `nodes`. Cạnh có một đầu bị lọc
            vì phân tầng riêng tư sẽ **không xuất hiện** — cây có thể đứt đoạn một cách hợp lệ.
          items:
            $ref: '#/components/schemas/TreeEdge'
        meta:
          $ref: '#/components/schemas/TreeMeta'

    TreeNode:
      type: object
      title: Node trên phả đồ / Tree node
      description: |-
        Node hiển thị. Chỉ chứa dữ liệu Tầng 1 để render hàng nghìn node mà không kéo theo
        dữ liệu nhạy cảm; bấm vào node thì FE gọi `GET /persons/{id}` để lấy hồ sơ đầy đủ.
      required: [id, person, depth, hasMoreDescendants]
      properties:
        id:
          type: string
          format: uuid
          description: Trùng `person.id`; tách ra cho khớp mô hình node/edge của React Flow.
        person:
          $ref: '#/components/schemas/PersonSummaryDto'
        depth:
          type: integer
          description: |-
            Khoảng cách đời tính từ `rootId`: `0` là gốc, số dương là đời dưới,
            **số âm là đời trên** (khi `direction = ANCESTORS` hoặc `BOTH`).
        parentIds:
          type: array
          description: Cha/mẹ (ruột hoặc nuôi) có mặt trong projection này. / Parents present here.
          items:
            type: string
            format: uuid
        spouseIds:
          type: array
          description: Vợ/chồng có mặt trong projection này. / Spouses present here.
          items:
            type: string
            format: uuid
        childCount:
          type: [integer, 'null']
          description: |-
            **Tổng** số con trong CSDL (đã lọc riêng tư), kể cả phần chưa nạp — để FE hiện
            "còn 12 người con" trên nút mở rộng. / Total children, including not-yet-loaded ones.
        hasMoreDescendants:
          type: boolean
          description: |-
            `true` ⇒ node còn con cháu **chưa nạp** vì chạm `depth` hoặc `maxNodes`.
            FE hiện nút mở rộng và gọi lại `/tree?rootId={id}`.
        badges:
          type: array
          description: |-
            Nhãn nghiệp vụ để canvas vẽ badge, tính sẵn ở backend để FE không phải suy luận
            từ quan hệ:

            * `DICH_TON` — cháu đích tôn.
            * `THUA_TU` / `KE_TU` — người thừa tự / kế tự.
            * `CON_NUOI` — con nuôi (`PARENT_ADOPT`).
            * `DAU` / `RE` — con dâu / con rể (suy từ `SPOUSE` + huyết thống).
            * `TUYET_TU` — chi tuyệt tự (không có người nối dõi).
            * `TRUONG_CHI` — đang giữ chức Trưởng chi.
            * `DECEASED` — đã khuất (canvas phân biệt thị giác với người còn sống).
          items:
            type: string
            enum: [DICH_TON, THUA_TU, KE_TU, CON_NUOI, DAU, RE, TUYET_TU, TRUONG_CHI, DECEASED]

    TreeEdge:
      type: object
      title: Cạnh trên phả đồ / Tree edge
      required: [id, source, target, relType]
      properties:
        id:
          type: string
          description: Id cạnh, ổn định giữa các lần gọi. / Stable edge id.
        source:
          type: string
          format: uuid
          description: Đầu `from` của cạnh. / Edge source.
        target:
          type: string
          format: uuid
          description: Đầu `to` của cạnh. / Edge target.
        relType:
          $ref: '#/components/schemas/RelType'
        heirKind:
          oneOf:
            - $ref: '#/components/schemas/HeirKind'
            - type: 'null'
        spouseOrder:
          type: [integer, 'null']
          description: Thứ tự vợ/chồng — canvas dùng để xếp thứ tự vợ cả/vợ thứ.
        validTo:
          type: [string, 'null']
          format: date
          description: |-
            Có giá trị ⇒ quan hệ **đã kết thúc** (ly hôn hoặc một bên mất);
            canvas nên vẽ nét đứt thay vì nét liền.

    TreeMeta:
      type: object
      title: Siêu dữ liệu projection / Projection metadata
      required: [depth, direction, nodeCount, truncated]
      properties:
        depth:
          type: integer
          description: Độ sâu đã áp dụng (có thể nhỏ hơn yêu cầu nếu chạm trần).
        direction:
          $ref: '#/components/schemas/TreeDirection'
        nodeCount:
          type: integer
        edgeCount:
          type: integer
        truncated:
          type: boolean
          description: |-
            `true` ⇒ projection **đã bị cắt** vì chạm `maxNodes`. FE phải xử lý, đừng coi là
            đã nhận đủ cây. / The projection was truncated.
        truncatedNodeIds:
          type: array
          description: Các node bị cắt nhánh — chính là nơi cần nút mở rộng. / Where truncation happened.
          items:
            type: string
            format: uuid
        generatedAt:
          type: string
          format: date-time
        fromCache:
          type: boolean
          description: Phản hồi lấy từ cache Redis hay dựng mới. / Served from cache or freshly built.

    # -------------------------------------------------------------------------
    # DANH XƯNG / KINSHIP
    # -------------------------------------------------------------------------
    KinshipResult:
      type: object
      title: Kết quả tra danh xưng / Kinship resolution result
      description: |-
        Danh xưng mà `from` gọi `to`, kèm bằng chứng để người dùng tự kiểm chứng.
        **Danh xưng luôn là tiếng Việt** và đến từ dữ liệu `kinship_rule`, không hard-code.
      required: [status, fromPersonId, toPersonId]
      properties:
        status:
          type: string
          description: |-
            * `RESOLVED` — có `title`.
            * `NO_COMMON_ANCESTOR` — không tìm được tổ chung trong dữ liệu hiện có.
            * `NO_MATCHING_RULE` — có LCA nhưng bộ luật chưa phủ; `facts` vẫn trả để Hội đồng bổ sung luật.
            * `SELF` — `from` trùng `to`.
          enum: [RESOLVED, NO_COMMON_ANCESTOR, NO_MATCHING_RULE, SELF]
        fromPersonId:
          type: string
          format: uuid
        toPersonId:
          type: string
          format: uuid
        title:
          type: [string, 'null']
          description: |-
            **Danh xưng** — cách `from` gọi `to`, ví dụ `Bác họ`, `Cô ruột`, `Chú`, `Cháu`.
            Vắng mặt khi `status` khác `RESOLVED`.
          examples: [Bác họ]
        reciprocalTitle:
          type: [string, 'null']
          description: |-
            Danh xưng ngược lại — cách `to` gọi `from`. Tiện cho UI hiện cả hai chiều
            ("A gọi B là Bác họ, B gọi A là Cháu").
        titleEn:
          type: [string, 'null']
          description: |-
            Diễn giải tiếng Anh gần đúng (`paternal uncle, elder`) cho giao diện EN.
            **Chỉ tham khảo** — hệ danh xưng Việt không ánh xạ 1–1 sang tiếng Anh.
        facts:
          oneOf:
            - $ref: '#/components/schemas/RelationFacts'
            - type: 'null'
        lca:
          oneOf:
            - $ref: '#/components/schemas/LcaInfo'
            - type: 'null'
        path:
          type: array
          description: |-
            Đường quan hệ từ `from` lên LCA rồi xuống `to`. FE vẽ để người dùng tự kiểm chứng —
            đây là thứ tạo niềm tin cho tính năng, đừng ẩn đi.
          items:
            $ref: '#/components/schemas/KinshipPathStep'
        ruleSetId:
          type: [string, 'null']
          format: uuid
          description: Bộ luật đã dùng. / The rule set used.
        ruleSetScope:
          oneOf:
            - $ref: '#/components/schemas/RuleScope'
            - type: 'null'
          description: Cấp của luật đã khớp — cho biết chi này có ghi đè hay đang dùng mặc định.
        ruleId:
          type: [string, 'null']
          format: uuid
          description: |-
            Luật cụ thể đã khớp. Dùng để truy vết khi dòng họ báo danh xưng sai —
            biết ngay phải sửa luật nào.
        ruleSetChain:
          type: array
          description: Chuỗi kế thừa đã hợp nhất, theo thứ tự áp dụng. / Merge chain applied.
          items:
            $ref: '#/components/schemas/RuleScope'
        cached:
          type: boolean
          description: Kết quả lấy từ cache Redis. / Served from cache.

    RelationFacts:
      type: object
      title: Dữ kiện quan hệ / Relation facts
      description: |-
        Đầu vào chuẩn hóa của rule engine, tính từ kết quả LCA. Trả về cho client để màn hình quản trị
        của Hội đồng biết **luật cần viết cho tổ hợp nào**.
      required: [genDelta, side]
      properties:
        genDelta:
          type: integer
          description: |-
            `distFrom - distTo`, với `dist*` là số đời từ mỗi người đi lên tới LCA:
            **dương** = `to` ở đời TRÊN (bố, bác, ông…), `0` = cùng đời,
            **âm** = `to` ở đời DƯỚI (con, cháu, chắt…).

            Quy ước dấu này do `V3__kinship_rules.sql` định nghĩa và 111 luật trong
            `R__seed_kinship_rules_default.sql` đã seed theo đúng nó (`CHA` = `1`,
            `CON_TRAI` = `-1`). Trường này và `KinshipRule.genDelta` luôn hiển thị
            cạnh nhau trên màn hình sửa luật của Hội đồng, nên hai chỗ **bắt buộc**
            cùng dấu.
          examples: [1]
        side:
          $ref: '#/components/schemas/RelationSide'
        targetGender:
          $ref: '#/components/schemas/Gender'
        isElder:
          type: [boolean, 'null']
          description: |-
            Vai trên/dưới **trong cùng một đời** — phân biệt `bác` (anh của cha) với `chú` (em của cha).
            `null` khi không xác định được thứ tự sinh trong dữ liệu.
        throughMarriage:
          type: boolean
          default: false
          description: |-
            Quan hệ đi qua hôn nhân (dâu/rể/thông gia) chứ không thuần huyết thống.
        throughAdoption:
          type: boolean
          default: false
          description: Đường quan hệ có ít nhất một cạnh `PARENT_ADOPT` (con nuôi).
        collateralDegree:
          type: [integer, 'null']
          description: |-
            Bậc bàng hệ `collateral_degree = min(dist_a, dist_b)` — suy thẳng từ kết quả LCA.
            `0` = trực hệ (một người là tổ tiên của người kia) · `1` = ruột · `2` = họ
            (con chú con bác) · `>=3` = họ xa. Đây là chiều phân biệt `bác ruột` với `bác họ`.
            Khớp cột `kinship_rule.collateral_degree` trong migration V3.

    LcaInfo:
      type: object
      title: Tổ chung gần nhất / Lowest common ancestor
      description: |-
        Kết quả truy vấn LCA bằng Cypher trên AGE (TDD §6).
      required: [personId, distanceFrom, distanceTo]
      properties:
        personId:
          type: string
          format: uuid
        displayName:
          type: [string, 'null']
          description: |-
            Tên tổ chung. Bị thay bằng nhãn chung khi người đó còn sống và bị ẩn theo phân tầng.
        generation:
          type: [integer, 'null']
        distanceFrom:
          type: integer
          description: Số bậc từ `from` lên tới LCA. / Generations from `from` up to the LCA.
        distanceTo:
          type: integer
          description: Số bậc từ `to` lên tới LCA. / Generations from `to` up to the LCA.

    KinshipPathStep:
      type: object
      title: Một chặng trên đường quan hệ / One step of the relation path
      required: [personId, direction]
      properties:
        personId:
          type: string
          format: uuid
        displayName:
          type: [string, 'null']
          description: |-
            Tên hiển thị; với người còn sống bị ẩn theo phân tầng, backend trả nhãn chung
            (ví dụ `"—"`) thay vì tên thật, **không** bỏ chặng đó khỏi đường đi
            (bỏ chặng sẽ làm sai độ dài đường quan hệ).
        generation:
          type: [integer, 'null']
        direction:
          type: string
          description: |-
            Chiều đi của chặng: `UP` lên đời trên · `DOWN` xuống đời dưới ·
            `ACROSS` sang ngang qua hôn nhân (vợ/chồng) · `SELF` điểm xuất phát.
          enum: [SELF, UP, DOWN, ACROSS]
        viaRelType:
          oneOf:
            - $ref: '#/components/schemas/RelType'
            - type: 'null'
          description: Loại cạnh đã đi qua để tới chặng này. / The edge type traversed.

    KinshipRuleDto:
      type: object
      title: Một luật danh xưng / One kinship rule
      description: |-
        Một dòng trong bảng `kinship_rule`. **Khóa khớp** là bộ
        `(genDelta, collateralDegree, side, gender, isElder)` cộng nhóm `link*` khi
        `side = IN_LAW` và nhóm `directLink*` khi khớp thẳng theo cạnh; nhiều luật cùng
        khớp thì `priority` nhỏ hơn thắng.

        `collateralDegree` là chiều **bắt buộc**: thiếu nó thì không phân biệt được
        `bác ruột` với `bác họ`, cũng như `anh ruột` với `anh họ`.

        ⚠️ `PUT /kinship-rules` có ngữ nghĩa **replace trọn vẹn**, không phải patch —
        danh sách gửi lên thay thế toàn bộ luật của bộ đó. Trường nào không gửi sẽ bị
        **xoá**, nên client phải gửi lại đủ mọi trường dưới đây, kể cả những trường nó
        không hiển thị.
      required: [relationCode, title]
      properties:
        id:
          type: string
          format: uuid
        relationCode:
          type: string
          maxLength: 48
          description: |-
            Mã quan hệ ổn định (`kinship_rule.relation_code`, `NOT NULL`) — ví dụ
            `BAC_RUOT_NOI`, `CHU_RUOT`, `THIM`, `CHAU_HO`. Đây là **khoá ghi đè** giữa các
            cấp `DEFAULT → REGION → CLAN → BRANCH`: luật của bộ con thay thế luật cùng mã
            của bộ cha. Trong một bộ luật mỗi mã chỉ xuất hiện một lần (unique index
            `ux_kinship_rule_code`).
          examples: [BAC_HO_NOI]
        genDelta:
          type: integer
          description: |-
            Chênh lệch đời cần khớp, cùng quy ước dấu với `RelationFacts.genDelta`:
            **dương** = người được gọi ở đời trên. `null` = không xét chiều này.
            / Generation delta; positive means the addressee is an older generation.
        side:
          $ref: '#/components/schemas/RelationSide'
        gender:
          oneOf:
            - $ref: '#/components/schemas/Gender'
            - type: 'null'
          description: Giới tính **người được gọi**. `null` = luật áp cho mọi giới.
        isElder:
          type: [boolean, 'null']
          description: |-
            Vai trên/dưới trong cùng đời. `null` = luật không phân biệt
            (dùng cho vùng miền không tách `bác`/`chú`).
        collateralDegree:
          type: [integer, 'null']
          description: |-
            Áp cho một bậc bàng hệ cụ thể; `null` = mọi bậc.
            `0` = trực hệ · `1` = ruột · `2` = họ · `>=3` = họ xa.
            Khớp cột `kinship_rule.collateral_degree` (migration V3).
        genDeltaMin:
          type: [integer, 'null']
          description: |-
            Cận dưới của `genDelta` cho luật mở (ví dụ "tổ tiên từ đời 6 trở lên").
            Dùng thay cho `genDelta` khi luật áp cho một dải, không phải một giá trị.
        genDeltaMax:
          type: [integer, 'null']
          description: Cận trên của `genDelta`.
        collateralDegreeMin:
          type: [integer, 'null']
          description: Cận dưới của `collateralDegree` — dùng cho luật "họ xa" (`>= 3`).
        collateralDegreeMax:
          type: [integer, 'null']
          description: Cận trên của `collateralDegree`.
        linkSide:
          oneOf:
            - $ref: '#/components/schemas/RelationSide'
            - type: 'null'
          description: |-
            **Chỉ có nghĩa khi `side = IN_LAW`.** Bên nội/ngoại của *người nối* — người vừa
            là ruột thịt của `from`, vừa là vợ/chồng của `to`. Ràng buộc
            `ck_kinship_rule_in_law_shape` bắt buộc trường này `null` với mọi `side` khác.
        linkGender:
          oneOf:
            - $ref: '#/components/schemas/Gender'
            - type: 'null'
          description: |-
            **Chỉ có nghĩa khi `side = IN_LAW`.** Giới tính của *người nối*. Ví dụ `thím`
            = vợ của em trai bố → `linkGender: MALE`, `gender: FEMALE`.
        inLawDirection:
          type: [string, 'null']
          enum: [ALTER_IS_SPOUSE, EGO_IS_SPOUSE, null]
          description: |-
            **Chỉ có nghĩa khi `side = IN_LAW`.** Chiều của quan hệ hôn nhân:
            `ALTER_IS_SPOUSE` — `to` là dâu/rể của họ nhà `from` (thím, mợ, chị dâu, con dâu,
            con rể) · `EGO_IS_SPOUSE` — `from` là dâu/rể, `to` là ruột thịt bên vợ/chồng
            (bố chồng, mẹ vợ).
        directLink:
          type: [string, 'null']
          enum: [SPOUSE, PARENT_BIO, PARENT_ADOPT, HEIR, null]
          description: |-
            Khớp thẳng theo **cạnh** thay vì theo LCA — dùng cho quan hệ mà LCA vô nghĩa
            hoặc cần ưu tiên tuyệt đối (vợ/chồng, bố mẹ nuôi/con nuôi, đích tôn/thừa tự).
            Luật có `directLink` được xét trước (đặt `priority` nhỏ).
        directLinkSubtype:
          type: [string, 'null']
          enum: [DICH_TON, THUA_TU, KE_TU, BIO, ADOPT, null]
          description: |-
            Phân loại cạnh. `HEIR` → `DICH_TON`/`THUA_TU`/`KE_TU` ·
            `PARENT_BIO`/`PARENT_ADOPT` → `BIO`/`ADOPT`. Tổ hợp khác bị
            `ck_kinship_rule_direct_subtype` từ chối.
        directLinkReversed:
          type: boolean
          default: false
          description: |-
            `true` = cạnh đi từ `to` sang `from`. Ví dụ luật "con nuôi": cạnh `PARENT_ADOPT`
            xuất phát từ `to` (bố mẹ nuôi) trỏ về `from`.
        throughMarriage:
          type: [boolean, 'null']
          description: Áp riêng cho quan hệ qua hôn nhân (dâu/rể). `null` = không phân biệt.
        title:
          type: string
          description: |-
            **Danh xưng kết quả** — chuỗi tiếng Việt hiển thị cho người dùng, ví dụ `Bác họ`.
          examples: [Bác họ]
        titleShort:
          type: [string, 'null']
          maxLength: 32
          description: |-
            Dạng rút gọn để vẽ trên node của phả đồ, nơi không đủ chỗ cho danh xưng đầy đủ.
            Khớp cột `kinship_rule.title_short`.
        reciprocalTitle:
          type: [string, 'null']
          description: |-
            Danh xưng chiều ngược lại, ví dụ `Cháu`. / Reciprocal title.

            **Lưu ý ánh xạ:** khi ghi xuống, trường này vào cột `kinship_rule.ego_self_term`
            — "`from` tự xưng là gì khi nói với `to`" (gọi `bác` thì xưng `cháu`). Đây là dữ
            liệu của chính luật này. Còn `KinshipResult.reciprocalTitle` trong phản hồi tra
            cứu là thứ khác: nó do rule engine tính bằng cách đảo vai rồi khớp lại, và chỉ
            lùi về `egoSelfTerm` khi không luật nào khớp chiều ngược.
        priority:
          type: integer
          default: 100
          description: |-
            Số **nhỏ hơn thắng** khi nhiều luật cùng khớp. / Lower wins.
            Quy ước: luật khớp chính xác `10–40` · luật khái quát `50–90` · luật vét `900+`.
        active:
          type: boolean
          default: true
          description: |-
            Tắt một luật mà không xoá nó (`kinship_rule.is_active`). Luật tắt bị bỏ qua khi
            hợp nhất, nhưng vẫn giữ chỗ để bộ con không vô tình "mở lại" luật của bộ cha.
        note:
          type: [string, 'null']
          maxLength: 500
          description: Ghi chú của Hội đồng về xuất xứ luật. / Council note.

    KinshipRuleSetDto:
      type: object
      title: Bộ quy tắc danh xưng / Kinship rule set
      required: [id, scope, rules, version]
      properties:
        id:
          type: string
          format: uuid
        scope:
          $ref: '#/components/schemas/RuleScope'
        name:
          type: [string, 'null']
          description: Tên gọi bộ luật, ví dụ `Mặc định miền Bắc`. / Display name.
        region:
          oneOf:
            - $ref: '#/components/schemas/Region'
            - type: 'null'
          description: Chỉ có nghĩa khi `scope = REGION`.
        clanId:
          type: [string, 'null']
          format: uuid
          description: Chỉ có nghĩa khi `scope = CLAN`.
        branchId:
          type: [string, 'null']
          format: uuid
          description: Chỉ có nghĩa khi `scope = BRANCH`.
        parentRuleSetId:
          type: [string, 'null']
          format: uuid
          description: |-
            Bộ luật cha để kế thừa. Bỏ trống thì backend tự nối theo chuỗi chuẩn
            `DEFAULT → REGION → CLAN → BRANCH`.
        isSystemDefault:
          type: boolean
          default: false
          description: |-
            Bộ `DEFAULT` do hệ thống seed (**miền Bắc**). **Không sửa được** —
            `PUT` vào đây trả `403 SYSTEM_RULE_SET_IMMUTABLE`; muốn khác thì tạo bộ ghi đè cấp dưới.
        rules:
          type: array
          items:
            $ref: '#/components/schemas/KinshipRuleDto'
        version:
          type: integer
          format: int64
          description: Phiên bản cho optimistic locking, gửi lại ở `expectedVersion`.
        updatedAt:
          type: [string, 'null']
          format: date-time
        updatedBy:
          type: [string, 'null']
          description: Người sửa gần nhất (hiển thị tên, không phải id định danh cá nhân).

    KinshipRuleSetPage:
      type: object
      required: [items, page]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/KinshipRuleSetDto'
        page:
          $ref: '#/components/schemas/PageMeta'

    EffectiveKinshipRuleSet:
      type: object
      title: Bộ luật hiệu lực đã hợp nhất / Merged effective rule set
      description: |-
        Kết quả hợp nhất `DEFAULT → REGION → CLAN → BRANCH` cho một chi cụ thể — chính là bộ luật
        mà `/kinship` thực sự dùng. Mỗi luật kèm nguồn gốc để UI tô màu luật nào bị ghi đè.
      required: [branchId, chain, rules]
      properties:
        branchId:
          type: string
          format: uuid
        chain:
          type: array
          description: Các bộ luật đã hợp nhất, theo thứ tự áp dụng. / Merge chain, in order.
          items:
            type: object
            required: [ruleSetId, scope]
            properties:
              ruleSetId:
                type: string
                format: uuid
              scope:
                $ref: '#/components/schemas/RuleScope'
              name:
                type: [string, 'null']
        rules:
          type: array
          items:
            allOf:
              - $ref: '#/components/schemas/KinshipRuleDto'
              - type: object
                properties:
                  inheritedFromScope:
                    $ref: '#/components/schemas/RuleScope'
                  inheritedFromRuleSetId:
                    type: string
                    format: uuid
                  overridden:
                    type: boolean
                    description: |-
                      `true` ⇒ luật này đã bị một cấp thấp hơn ghi đè và **không** còn hiệu lực;
                      trả về chỉ để UI hiển thị lịch sử ghi đè.

    KinshipRuleSetUpdateRequest:
      type: object
      title: Ghi đè bộ quy tắc / Replace rule set
      description: |-
        Thay thế **toàn bộ** danh sách luật của một bộ. Chỉ `COUNCIL`/`ADMIN`.
      required: [scope, rules]
      properties:
        ruleSetId:
          type: [string, 'null']
          format: uuid
          description: Bỏ trống ⇒ tạo bộ mới (`201`). Có giá trị ⇒ ghi đè bộ đó (`200`).
        scope:
          $ref: '#/components/schemas/RuleScope'
        name:
          type: [string, 'null']
        region:
          oneOf:
            - $ref: '#/components/schemas/Region'
            - type: 'null'
          description: Bắt buộc khi `scope = REGION`.
        clanId:
          type: [string, 'null']
          format: uuid
          description: Bắt buộc khi `scope = CLAN`.
        branchId:
          type: [string, 'null']
          format: uuid
          description: Bắt buộc khi `scope = BRANCH`.
        parentRuleSetId:
          type: [string, 'null']
          format: uuid
        rules:
          type: array
          description: |-
            **Thay thế trọn vẹn** danh sách luật hiện có. Gửi mảng rỗng = xóa hết luật của bộ này
            (bộ vẫn tồn tại và kế thừa nguyên vẹn từ cha).
          items:
            $ref: '#/components/schemas/KinshipRuleDto'
        expectedVersion:
          type: [integer, 'null']
          format: int64
          description: |-
            Phiên bản đọc được từ `GET`. Bắt buộc khi sửa bộ có sẵn; sai ⇒ `409 OPTIMISTIC_LOCK_CONFLICT`.
        note:
          type: [string, 'null']
          maxLength: 1000
          description: Lý do thay đổi, ghi vào `audit_log`. / Reason, recorded in the audit log.

    # -------------------------------------------------------------------------
    # SỰ KIỆN / EVENTS
    # -------------------------------------------------------------------------
    EventDto:
      type: object
      title: Sự kiện dòng họ / Clan event
      description: |-
        Một sự kiện giỗ/lễ. Ngày **âm** là dữ liệu gốc; ngày dương là kết quả quy đổi của backend.
      required: [id, eventType, lunarDate, isClanLevel]
      properties:
        id:
          type: string
          format: uuid
        eventType:
          $ref: '#/components/schemas/EventType'
        title:
          type: [string, 'null']
          description: |-
            Tên hiển thị, ví dụ `Giỗ cụ Nguyễn Văn Đức`. Backend sinh sẵn theo `Accept-Language`
            để FE khỏi ghép chuỗi (ghép ở client sẽ sai với người bị ẩn theo phân tầng).
        person:
          oneOf:
            - $ref: '#/components/schemas/PersonSummaryDto'
            - type: 'null'
          description: |-
            Nhân khẩu chủ thể (người được giỗ, hoặc người mừng thọ).
            `null` với sự kiện cấp dòng họ không gắn cá nhân.
        lunarDate:
          $ref: '#/components/schemas/LunarDate'
        nextOccurrenceSolar:
          type: [string, 'null']
          format: date
          description: |-
            Ngày **dương** của lần xảy ra sắp tới, backend quy đổi (Hồ Ngọc Đức, GMT+7, có xử lý
            tháng nhuận). FE **không tự quy đổi** — sai tháng nhuận là lệch giỗ nguyên một tháng
            mà không có lỗi nào được ném ra.
        nextOccurrenceLunarYear:
          type: [integer, 'null']
          description: Năm âm lịch tương ứng của lần xảy ra sắp tới. / Lunar year of next occurrence.
        daysUntil:
          type: [integer, 'null']
          description: Số ngày còn lại tính từ hôm nay (GMT+7). Âm = đã qua trong khoảng lọc.
        targetBranch:
          oneOf:
            - $ref: '#/components/schemas/BranchRef'
            - type: 'null'
          description: |-
            Chi/ngành được nhắc. Người nhận nhắc là thành viên thuộc chi này **và các nhánh con**.
        isClanLevel:
          type: boolean
          description: |-
            `true` ⇒ sự kiện cấp **toàn dòng họ** (giỗ Tổ, chạp mả chung): mọi thành viên đều nhận nhắc,
            bỏ qua `targetBranch`.
        reminderOffsets:
          type: array
          description: |-
            Các mốc nhắc trước, tính bằng ngày. Mặc định `[7, 3, 1]` theo FR-2.2.
          items:
            type: integer
          examples:
            - [7, 3, 1]
        graveId:
          type: [string, 'null']
          format: uuid
          description: |-
            Mộ phần liên quan (Giai đoạn 3) — dùng cho nhắc chạp mả kèm bản đồ.
        note:
          type: [string, 'null']

    EventPage:
      type: object
      required: [items, page]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/EventDto'
        page:
          $ref: '#/components/schemas/PageMeta'

    # -------------------------------------------------------------------------
    # THÔNG BÁO / NOTIFICATIONS
    # -------------------------------------------------------------------------
    NotificationDto:
      type: object
      title: Thông báo in-app / In-app notification
      description: |-
        Một dòng trong hộp thư in-app (`notification_inbox`). In-app là **nguồn chân lý** của
        thông báo; Web Push chỉ là bản đẩy thêm và có thể không tới nơi.
      required: [id, category, title, createdAt, isRead]
      properties:
        id:
          type: string
          format: uuid
        category:
          $ref: '#/components/schemas/NotificationCategory'
        title:
          type: string
          description: Tiêu đề, ví dụ `Còn 3 ngày tới giỗ cụ Nguyễn Văn Đức`.
        body:
          type: [string, 'null']
          description: |-
            Nội dung. **Không bao giờ** chứa dữ liệu Tầng 3 (SĐT, email, địa chỉ) — thông báo
            có thể hiện trên màn hình khoá của thiết bị.
        eventId:
          type: [string, 'null']
          format: uuid
          description: Sự kiện liên quan, để FE điều hướng. / Related event, for deep-linking.
        personId:
          type: [string, 'null']
          format: uuid
          description: Nhân khẩu liên quan. / Related person.
        deepLink:
          type: [string, 'null']
          description: |-
            Đường dẫn tương đối trong ứng dụng để mở khi bấm, ví dụ `/events/{id}`.
            Dùng chung cho cả in-app và Web Push. / Relative in-app link.
        createdAt:
          type: string
          format: date-time
        isRead:
          type: boolean
        readAt:
          type: [string, 'null']
          format: date-time
        reminderOffsetDays:
          type: [integer, 'null']
          description: Mốc nhắc đã sinh ra thông báo này (7 / 3 / 1). / Which reminder offset fired.

    NotificationPage:
      type: object
      description: |-
        Trang thông báo, kèm `unreadCount` cho badge chuông.
      required: [items, page, unreadCount]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/NotificationDto'
        page:
          $ref: '#/components/schemas/PageMeta'
        unreadCount:
          type: integer
          description: |-
            **Tổng số chưa đọc của toàn hộp thư**, không phụ thuộc bộ lọc hay trang hiện tại.
            / Total unread across the whole inbox, filter-independent.

    NotificationReadResult:
      type: object
      required: [id, isRead, unreadCount]
      properties:
        id:
          type: string
          format: uuid
        isRead:
          type: boolean
        readAt:
          type: string
          format: date-time
          description: |-
            Thời điểm đọc **lần đầu**. Gọi lại không cập nhật giá trị này (idempotent).
        unreadCount:
          type: integer
          description: Số chưa đọc còn lại, để FE cập nhật badge ngay. / Remaining unread count.

    NotificationReadAllResult:
      type: object
      description: |-
        Kết quả "đánh dấu đã đọc tất cả". `markedCount = 0` là kết quả hợp lệ (hộp thư đã sạch),
        không phải lỗi.
      required: [markedCount, unreadCount]
      properties:
        markedCount:
          type: integer
          description: Số tin thực sự chuyển sang đã đọc ở lượt gọi này. / Rows actually flipped.
        unreadCount:
          type: integer
          description: |-
            Số chưa đọc còn lại của **toàn** hộp thư, đọc lại từ cơ sở dữ liệu chứ không suy ra
            bằng 0 — một tin mới có thể vừa rơi vào giữa hai câu lệnh.

    # -------------------------------------------------------------------------
    # VẬN HÀNH NHẮC GIỖ / REMINDER PIPELINE OPS
    # -------------------------------------------------------------------------
    ReminderGenerationResult:
      type: object
      description: |-
        Kết quả một lượt chạy tay job sinh lịch nhắc giỗ.

        Đọc cặp `scannedEvents` / `createdJobs` cùng nhau: `createdJobs = 0` mà
        `scannedEvents > 0` nghĩa là **lịch nhắc đã có sẵn từ lượt trước** (chống trùng đang chạy
        đúng), còn `scannedEvents = 0` nghĩa là không có sự kiện lặp lại nào để quét.
      required: [referenceDate, scannedEvents, createdJobs]
      properties:
        referenceDate:
          type: string
          format: date
          description: Ngày được coi là "hôm nay" của lượt chạy (GMT+7). / Reference "today".
        lunarYears:
          type: array
          description: |-
            Các năm **âm lịch** đã quy đổi. Luôn gồm năm âm hiện tại và năm kế tiếp: giỗ tháng Chạp
            rơi vào tháng 1–2 **dương lịch của năm sau**, chỉ sinh cho năm âm hiện tại thì nó chỉ có
            lịch nhắc sau khi đã qua.
          items:
            type: integer
          examples: [[2026, 2027]]
        solarYears:
          type: array
          description: Các năm **dương lịch** đã quy đổi (cho sự kiện theo dương lịch).
          items:
            type: integer
          examples: [[2026, 2027]]
        scannedEvents:
          type: integer
          description: Số sự kiện lặp lại, chưa xóa mềm, đã quét. / Recurring events scanned.
        createdJobs:
          type: integer
          description: |-
            Số `reminder_job` **thực sự ghi mới**. Job đã tồn tại không được tính — đó là điều làm
            cho endpoint này idempotent.
        startedAt:
          type: string
          format: date-time
        durationMs:
          type: integer
          format: int64
          description: Thời gian chạy, mili giây. / Wall-clock duration.

    ReminderDispatchResult:
      type: object
      description: |-
        Kết quả một lượt đẩy lịch nhắc đã tới giờ lên RabbitMQ.
      required: [dispatchedJobs, dispatchedAt]
      properties:
        dispatchedJobs:
          type: integer
          description: |-
            Số `reminder_job` đã đẩy lên hàng đợi. **Không phải** số người đã nhận được: việc gửi
            thật diễn ra bất đồng bộ ở consumer, và luồng HTTP không bao giờ chờ nó.
            Job quá hạn hoặc thuộc sự kiện đã xóa mềm bị chuyển `CANCELLED` và không tính vào đây.
        dispatchedAt:
          type: string
          format: date-time

    # -------------------------------------------------------------------------
    # WEB PUSH
    # -------------------------------------------------------------------------
    VapidPublicKey:
      type: object
      required: [publicKey]
      properties:
        publicKey:
          type: string
          description: |-
            Khóa công khai VAPID, **base64url không padding**, truyền thẳng vào
            `applicationServerKey` của `PushManager.subscribe`.
          examples: [BEl62iUYgUivxIkv69yViEuiBIa-Ib9-SkvMeAtA3LFgDzkrxZJjSgSnfckjBJuBkr3qBUYIHBQFLXYp5Nksh8U]

    WebPushConfigStatus:
      type: object
      title: Tình trạng cấu hình Web Push / Web Push configuration status
      description: |-
        **Không có trường nào mang khoá riêng VAPID, và sẽ không bao giờ có.** `privateKeySet` chỉ
        là một cờ boolean. Khoá công khai thì trả nguyên văn — nó vốn đã công khai qua
        `GET /push/public-key`, và là thứ quản trị viên cần để đối chiếu khi truy nguyên lỗi 401.
      required: [ready, enabled, publicKeySet, privateKeySet, subject, ttlSeconds, summary, remediation]
      properties:
        ready:
          type: boolean
          description: |-
            Đã gửi được chưa. `true` nghĩa là cặp khoá đã giải mã xong **và đã qua phép tự kiểm
            "hai khoá cùng một cặp"** lúc khởi động — mạnh hơn "hai biến môi trường khác rỗng".
        enabled:
          type: boolean
          description: Công tắc `giapha.webpush.enabled` (tắt tay mà không phải xoá khoá).
        publicKeySet:
          type: boolean
          description: Đã đặt `GIAPHA_WEBPUSH_PUBLIC_KEY`.
        privateKeySet:
          type: boolean
          description: |-
            Đã đặt `GIAPHA_WEBPUSH_PRIVATE_KEY`. **Chỉ cờ có/không** — giá trị không bao giờ rời
            khỏi tiến trình.
        publicKey:
          type: [string, 'null']
          description: Khoá công khai đang phục vụ; `null` khi chưa sẵn sàng.
          examples: [BEl62iUYgUivxIkv69yViEuiBIa-Ib9-SkvMeAtA3LFgDzkrxZJjSgSnfckjBJuBkr3qBUYIHBQFLXYp5Nksh8U]
        subject:
          type: string
          description: Claim `sub` của JWT VAPID. Để trống là lý do phổ biến khiến Firefox trả 400.
          examples: ['mailto:admin@giapha.vn']
        ttlSeconds:
          type: integer
          description: Thời gian push service giữ tin khi thiết bị offline.
          examples: [86400]
        summary:
          type: string
          description: Một câu nói rõ tình trạng, đã phân biệt "tắt tay" với "thiếu khoá".
        remediation:
          type: array
          description: |-
            Các bước cần làm, viết cho người sẽ thực sự gõ lệnh. **Rỗng khi đã sẵn sàng.** Luôn có
            bước "khởi động lại": khoá chỉ được đọc một lần lúc khởi động, nên đặt biến môi trường
            cho một tiến trình đang chạy không có tác dụng gì.
          items:
            type: string

    WebPushTestSendResult:
      type: object
      title: Kết quả gửi thử Web Push / Test push result
      required: [sent, outcome, deviceCount]
      properties:
        sent:
          type: boolean
          description: Có ít nhất một thiết bị nhận được hay không.
        outcome:
          type: string
          enum: [SENT, RETRYABLE, PERMANENT, SKIPPED]
          description: |-
            `PERMANENT` = push service **từ chối** máy chủ này (400/401/403) — gần như luôn là
            VAPID sai, và thử lại không sửa được. `SKIPPED` = không có gì để gửi (chưa có thiết bị,
            hoặc kênh chưa cấu hình).
        detail:
          type: [string, 'null']
          description: Mô tả từ adapter, gồm cả mã HTTP mà push service trả về.
        deviceCount:
          type: integer
          description: |-
            Số thiết bị đang hoạt động của người gọi. `0` là lý do phổ biến nhất khiến lượt gửi thử
            không thấy gì mà cũng không báo lỗi nào.

    PushSubscriptionCreateRequest:
      type: object
      title: Đăng ký Web Push / Web Push subscription
      description: |-
        Chính là `PushSubscription.toJSON()` của trình duyệt (chuẩn Web Push / RFC 8291),
        cộng vài trường phụ trợ để quản trị thiết bị.
      required: [endpoint, keys]
      properties:
        endpoint:
          type: string
          format: uri
          description: |-
            Endpoint do push service của trình duyệt cấp. **Đây là khóa định danh duy nhất**
            của một đăng ký — gửi lại cùng `endpoint` là cập nhật, không tạo bản mới.
        keys:
          type: object
          required: [p256dh, auth]
          description: Khóa mã hóa payload (RFC 8291). / Payload encryption keys.
          properties:
            p256dh:
              type: string
              description: Khóa công khai ECDH của client, base64url. / Client ECDH public key.
            auth:
              type: string
              description: Bí mật xác thực, base64url. / Auth secret.
        expirationTime:
          type: [integer, 'null']
          format: int64
          description: |-
            Thời điểm hết hạn do trình duyệt cấp (epoch milliseconds), thường `null`.
        userAgent:
          type: [string, 'null']
          description: |-
            User-Agent để người dùng nhận ra thiết bị trong màn hình cài đặt
            ("iPhone của Bố"). Không dùng cho mục đích khác.
        locale:
          type: [string, 'null']
          description: Ngôn ngữ mong muốn của thông báo đẩy tới thiết bị này (`vi`/`en`).
          examples: [vi]

    PushSubscriptionDto:
      type: object
      required: [id, endpoint, createdAt]
      properties:
        id:
          type: string
          format: uuid
          description: Id bản ghi — dùng cho `DELETE /push/subscriptions/{id}`.
        endpoint:
          type: string
          format: uri
          description: |-
            Endpoint đã đăng ký. **Không trả về `keys`** — khóa mã hóa chỉ nằm ở server,
            trả ra là rò rỉ vô ích.
        userAgent:
          type: [string, 'null']
        locale:
          type: [string, 'null']
        createdAt:
          type: string
          format: date-time
        lastUsedAt:
          type: [string, 'null']
          format: date-time
          description: Lần cuối gửi push thành công qua đăng ký này. / Last successful push.
        isCurrentDevice:
          type: boolean
          default: false
          description: |-
            Đăng ký này khớp `endpoint` mà client vừa gửi lên — giúp màn hình cài đặt đánh dấu
            "thiết bị này". / Marks the caller's own device.

    # -------------------------------------------------------------------------
    # GRAPHQL TRANSPORT
    # -------------------------------------------------------------------------
    GraphQLRequest:
      type: object
      required: [query]
      properties:
        query:
          type: string
          description: Văn bản truy vấn GraphQL. / The GraphQL query document.
        operationName:
          type: [string, 'null']
        variables:
          type: [object, 'null']
          additionalProperties: true

    GraphQLResponse:
      type: object
      description: |-
        Phản hồi GraphQL chuẩn. Có thể vừa có `data` vừa có `errors` (kết quả một phần) —
        FE phải kiểm tra `errors` kể cả khi `data` khác `null`.
      properties:
        data:
          type: [object, 'null']
          additionalProperties: true
        errors:
          type: array
          items:
            type: object
            required: [message]
            properties:
              message:
                type: string
              path:
                type: array
                items: {}
              locations:
                type: array
                items:
                  type: object
                  properties:
                    line:
                      type: integer
                    column:
                      type: integer
              extensions:
                type: object
                description: |-
                  `code` dùng **cùng tập mã** với `Problem.code` của REST, kèm `status` và `traceId`.
                properties:
                  code:
                    $ref: '#/components/schemas/ProblemCode'
                  status:
                    type: integer
                  traceId:
                    type: string

    # -------------------------------------------------------------------------
    # CỔNG THÔNG TIN CÔNG KHAI / PUBLIC PORTAL
    #
    # Các schema dưới đây hẹp hơn bản dành cho thành viên MỘT CÁCH CÓ CHỦ Ý.
    # Không có trường nào để chứa dữ liệu Tầng 2/Tầng 3, nên không lỗi lập trình
    # nào làm rò rỉ chúng qua bề mặt không cần đăng nhập được.
    # Deliberately narrower than the member-facing schemas: there is simply no
    # field for Tier-2/Tier-3 data to travel in.
    # -------------------------------------------------------------------------
    PublicPersonDto:
      type: object
      title: Nhân khẩu (công khai) / Person, public view
      description: |-
        Hồ sơ một **người đã khuất** như Khách vãng lai nhìn thấy.

        So với `PersonDto`, các trường sau **không tồn tại** (không phải "bị ẩn"):
        `contact`, `occupation`, `currentPlaceProvince`, `currentPlaceFull`, `attributes`,
        `privacy`, `version`, `createdAt`, `updatedAt`, `isDeleted`, `access`.

        `isAlive` luôn `false`. Trường này được giữ có chủ ý — nó là mệnh đề mà chốt chặn phía
        server và bộ test ghim vào, không phải thông tin cho giao diện.
      required: [id, names, displayName, isAlive]
      properties:
        id:
          type: string
          format: uuid
        names:
          type: array
          description: |-
            Mọi lớp tên: húy / tự / hiệu / thụy / thường gọi / pháp danh. Với người đã khuất, tên
            húy đã hết vai trò kiêng kỵ đối với người ngoài và trở thành dữ liệu phả hệ công khai.
          items:
            $ref: '#/components/schemas/PersonName'
        displayName:
          type: string
          examples: [Nguyễn Phúc Thuỷ Tổ]
        gender:
          $ref: '#/components/schemas/Gender'
        generation:
          type: integer
          description: Đời thứ mấy, Thủy tổ = 1. / Generation index, founder = 1.
          minimum: 1
        isAlive:
          type: boolean
          description: Luôn `false` trên bề mặt công khai. / Always false here.
          const: false
        birth:
          $ref: '#/components/schemas/DateDual'
        death:
          $ref: '#/components/schemas/DateDual'
        nativePlace:
          type: string
          description: Nguyên quán. / Ancestral home place.
        biography:
          type: string
          description: Tiểu sử — BA v2 §10 liệt kê là dữ liệu công khai của người đã khuất.
        avatarKey:
          type: string
          description: |-
            **Khoá đối tượng trên MinIO**, không phải URL đã ký và không phải blob. Giai đoạn 1 chưa
            mở endpoint phát media công khai nên khoá này tự nó không mở được tệp nào.
        primaryBranch:
          $ref: '#/components/schemas/BranchRef'
        relations:
          type: array
          description: |-
            Quan hệ trực tiếp một bậc, **chỉ những cạnh mà đầu kia cũng đã khuất**. Nếu không thì
            chỉ cần đếm số cạnh là suy ra được có một người còn sống đang bị ẩn ở đầu bên kia.
          items:
            $ref: '#/components/schemas/PublicRelation'

    PublicRelation:
      type: object
      title: Quan hệ (công khai) / Relationship, public view
      description: |-
        Giữ `heirKind` vì `đích tôn` / `thừa tự` là dữ liệu phả hệ đúng nghĩa. **Bỏ**
        `validFrom`/`validTo` (mốc kết thúc hôn nhân là chuyện ly hôn hoặc tang chế của gia đình)
        và `note` (văn bản tự do, không ai kiểm duyệt trước khi nó ra tới người lạ).
      required: [id, fromPersonId, toPersonId, relType]
      properties:
        id:
          type: string
          format: uuid
        fromPersonId:
          type: string
          format: uuid
        toPersonId:
          type: string
          format: uuid
        relType:
          $ref: '#/components/schemas/RelType'
        heirKind:
          $ref: '#/components/schemas/HeirKind'
        spouseOrder:
          type: integer
          description: Thứ tự vợ/chồng (đa thê). / Spouse order for polygamy.
          minimum: 1

    PublicPersonSummaryDto:
      type: object
      title: Nhân khẩu dạng gọn (công khai) / Person summary, public view
      required: [id, displayName, isAlive]
      properties:
        id:
          type: string
          format: uuid
        displayName:
          type: string
        nameHanNom:
          type: string
        gender:
          $ref: '#/components/schemas/Gender'
        generation:
          type: integer
          minimum: 1
        isAlive:
          type: boolean
          const: false
        birthYear:
          type: integer
        deathYear:
          type: integer
        primaryBranch:
          $ref: '#/components/schemas/BranchRef'
        nativePlace:
          type: string
        avatarKey:
          type: string
        matchedNameType:
          $ref: '#/components/schemas/NameType'

    PublicPageMeta:
      type: object
      title: Phân trang (công khai) / Page meta, public view
      description: |-
        **Không có `totalElements`/`totalPages`.** Bản dành cho thành viên trả tổng đã lọc; ở đây
        ngay cả con số đã lọc cũng bị bỏ, vì với Khách nó là *tổng số người đã khuất khớp truy vấn*
        — một phép đếm dân số dòng họ mà kẻ quét dò dần được bằng cách đổi từ khoá.
        Phân trang bằng `hasNext`, đúng kiểu con trỏ.
      required: [page, size, hasNext]
      properties:
        page:
          type: integer
          minimum: 0
          maximum: 4
        size:
          type: integer
        hasNext:
          type: boolean
          description: |-
            `false` cũng có nghĩa là **đã chạm trần trang công khai**, không chỉ "hết kết quả".

    PublicPersonSummaryPage:
      type: object
      description: Trang kết quả công khai. / A public page of person summaries.
      required: [items, page]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PublicPersonSummaryDto'
        page:
          $ref: '#/components/schemas/PublicPageMeta'

    PublicTreeProjection:
      type: object
      title: Phả đồ (công khai) / Tree projection, public view
      description: |-
        Chỉ gồm người đã khuất. `edges` chỉ chứa cạnh mà **cả hai đầu** đều có trong `nodes`, nên
        cây có thể gồm nhiều mảnh rời — xem mô tả của `GET /public/tree`.
      required: [rootId, nodes, edges, meta]
      properties:
        rootId:
          type: string
          format: uuid
        nodes:
          type: array
          items:
            $ref: '#/components/schemas/PublicTreeNode'
        edges:
          type: array
          items:
            $ref: '#/components/schemas/PublicTreeEdge'
        meta:
          $ref: '#/components/schemas/PublicTreeMeta'

    PublicTreeNode:
      type: object
      required: [id, person, depth, parentIds, spouseIds, expandable]
      properties:
        id:
          type: string
          format: uuid
        person:
          $ref: '#/components/schemas/PublicPersonSummaryDto'
        depth:
          type: integer
          description: '`0` là gốc, dương là đời dưới, **âm là đời trên**.'
        parentIds:
          type: array
          description: |-
            Cha/mẹ **có mặt trong chính projection này**. Rỗng **không** có nghĩa là mồ côi — rất
            có thể cha/mẹ còn sống nên đã bị lọc.
          items:
            type: string
            format: uuid
        spouseIds:
          type: array
          items:
            type: string
            format: uuid
        expandable:
          type: boolean
          description: |-
            Node nằm ở rìa độ sâu đã xin, có thể gọi lại `/public/tree?rootId={id}` để đi tiếp.
            Suy ra **chỉ từ tham số yêu cầu**, không từ số con thật (số ấy đếm cả người còn sống).
            Có thể `true` ở một node thực ra không còn con.

    PublicTreeEdge:
      type: object
      required: [id, source, target, relType]
      properties:
        id:
          type: string
          description: Ổn định giữa các lần gọi, để FE khử trùng khi ghép nhiều nhánh.
        source:
          type: string
          format: uuid
        target:
          type: string
          format: uuid
        relType:
          $ref: '#/components/schemas/RelType'
        heirKind:
          $ref: '#/components/schemas/HeirKind'
        spouseOrder:
          type: integer
          minimum: 1

    PublicTreeMeta:
      type: object
      required: [depth, direction, nodeCount, edgeCount, truncated, guestFiltered]
      properties:
        depth:
          type: integer
        direction:
          $ref: '#/components/schemas/TreeDirection'
        nodeCount:
          type: integer
        edgeCount:
          type: integer
        truncated:
          type: boolean
          description: Đã chạm trần 200 node nên cây bị cắt. / Capped at 200 nodes.
        guestFiltered:
          type: boolean
          description: |-
            Luôn `true`: đây là bản đã lọc cho Khách, không phải cây đầy đủ. Là **hằng số**, không
            phải phép đếm — nó không nói gì về số người bị ẩn.
          const: true

    # -------------------------------------------------------------------------
    # ĐÍNH CHÍNH / CHANGE REQUESTS
    # -------------------------------------------------------------------------
    CorrectionPayload:
      type: object
      title: Nội dung đề nghị đính chính / Correction payload
      description: |-
        Hợp đồng **đóng** của `payload` khi `requestType = UPDATE_PERSON`.

        Khoá = **tên trường của `UpdatePersonRequest`**, đúng sáu trường mà FE đã chốt ở
        `correctable-fields.ts`. Sáu trường ấy phủ gần hết những gì người trong nhà thật sự phát
        hiện được, dẫn đầu là **ngày mất** — ghi sai ngày giỗ là sai lệch nặng nhất một cuốn gia phả
        có thể mắc.

        `null` ở một trường nghĩa là **xoá trắng**, không phải "không đổi": muốn giữ nguyên thì
        đừng gửi khoá đó.

        Khoá lạ, hoặc khoá điều khiển khác `_baseVersion`, đều bị từ chối bằng
        `422 VALIDATION_FAILED` **ngay lúc gửi**. Tiền tố `_` tách khoá điều khiển khỏi không gian
        tên trường hồ sơ: không có trường nào của `UpdatePersonRequest` bắt đầu bằng gạch dưới.
      additionalProperties: false
      anyOf:
        - required: [death]
        - required: [birth]
        - required: [nativePlace]
        - required: [occupation]
        - required: [currentPlaceProvince]
        - required: [gender]
      properties:
        _baseVersion:
          type: integer
          format: int64
          minimum: 0
          description: |-
            `person.version` tại thời điểm người gửi **nhìn thấy** hồ sơ — lấy từ `ETag` của lần
            `GET /persons/{id}` gần nhất.

            **Optional khi gửi, luôn có mặt khi đọc lại**: thiếu thì backend tự đọc `person.version`
            lúc gửi và đóng dấu. Giá trị client gửi luôn thắng.

            Lúc duyệt, nó trở thành `expectedVersion` của lệnh ghi; lệch ⇒
            `409 OPTIMISTIC_LOCK_CONFLICT` chứ **không** âm thầm ghi đè.
        death:
          oneOf:
            - $ref: '#/components/schemas/DateDual'
            - type: 'null'
          description: |-
            Ngày mất song lịch. `death.lunar` là **nguồn chân lý** để tính giỗ — sửa nó là sửa ngày
            giỗ của cả dòng họ, nên đây là trường được đính chính nhiều nhất.
        birth:
          oneOf:
            - $ref: '#/components/schemas/DateDual'
            - type: 'null'
        nativePlace:
          type: [string, 'null']
          maxLength: 255
          description: Nguyên quán. / Ancestral home place.
        occupation:
          type: [string, 'null']
          maxLength: 255
        currentPlaceProvince:
          type: [string, 'null']
          maxLength: 255
          description: Nơi ở **cấp tỉnh** (Tầng 2), không phải địa chỉ đầy đủ.
        gender:
          oneOf:
            - $ref: '#/components/schemas/Gender'
            - type: 'null'
          description: |-
            **Chỉ `MALE` / `FEMALE` / `UNKNOWN`.** Ràng buộc `ck_person_gender` của `V2__core.sql`
            không có `OTHER` dù enum `Gender` trong domain thì có; cho `OTHER` lọt qua thì đề nghị
            chết ở CHECK và **Postgres huỷ cả transaction**, người duyệt nhận một lỗi 500 không hiểu
            nổi. Schema `Gender` của contract vốn đã chỉ khai ba giá trị — không có gì phải sửa,
            nhưng đừng nới ra.

    SubmitChangeRequest:
      type: object
      title: Gửi yêu cầu đính chính / Submit correction request
      required: [requestType]
      properties:
        requestType:
          type: string
          enum:
            - CREATE_PERSON
            - UPDATE_PERSON
            - SOFT_DELETE_PERSON
            - ADD_RELATIONSHIP
            - REMOVE_RELATIONSHIP
            - ADD_NAME
            - MOVE_BRANCH
            - OTHER
          description: |-
            **Chỉ `UPDATE_PERSON` có bộ áp dụng tự động ở Giai đoạn 1.** Các loại khác được duyệt
            rồi Trưởng chi tự thao tác — backend ghi log mức INFO nói rõ điều đó chứ không im lặng.
        personId:
          type: [string, 'null']
          format: uuid
          description: |-
            Nhân khẩu bị ảnh hưởng. Bỏ trống **chỉ** hợp lệ với `CREATE_PERSON`; với
            `UPDATE_PERSON` thì bắt buộc, vì không có nó thì không đọc được `person.version` để
            đóng dấu `_baseVersion`.
        targetBranchId:
          type: [string, 'null']
          format: uuid
          description: |-
            Chi/ngành nhắm tới — quyết định **ai được duyệt**. Bỏ trống thì backend suy từ chi chính
            của `personId` và chốt lại ngay lúc gửi.
        payload:
          type: object
          description: |-
            Với `UPDATE_PERSON`: phải theo `CorrectionPayload`. Với các loại khác: object tự do, nội
            dung là lời mô tả cho người duyệt đọc — siết một hợp đồng chưa ai hiện thực chỉ chặn
            người dùng mà không bảo vệ được gì.
        reason:
          type: [string, 'null']
          maxLength: 2000
          description: Lý do; nên có để người duyệt hiểu bối cảnh. / Context for the reviewer.
      if:
        required: [requestType]
        properties:
          requestType:
            const: UPDATE_PERSON
      then:
        required: [personId, payload]
        properties:
          # Nhac lai personId o nhanh `then` — khong thua: o nhanh nay no KHONG duoc phep null, con
          # o `properties` goc thi duoc (CREATE_PERSON chua co person nao de tro toi). Khong co
          # `UPDATE_PERSON` nao gui len mot personId rong ma di qua duoc.
          personId:
            type: string
            format: uuid
          payload:
            $ref: '#/components/schemas/CorrectionPayload'

    ReviewChangeRequest:
      type: object
      title: Quyết định duyệt / Review decision
      required: [approve]
      properties:
        approve:
          type: boolean
          description: '`true` duyệt (và **áp dụng thật**), `false` từ chối.'
        note:
          type: [string, 'null']
          maxLength: 2000
          description: |-
            Ghi chú. **Bắt buộc khi từ chối** — người gửi có quyền biết vì sao đề nghị của mình bị
            bác.

    ChangeRequestDto:
      type: object
      title: Yêu cầu đính chính / Correction request
      required: [id, type, status, payloadFields, createdAt, version]
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          description: Cùng tập giá trị với `SubmitChangeRequest.requestType`.
        status:
          type: string
          enum: [PENDING, APPROVED, REJECTED, CANCELLED]
        personId:
          type: [string, 'null']
          format: uuid
        targetBranchId:
          type: [string, 'null']
          format: uuid
        payload:
          type: object
          description: |-
            **Chỉ hiện với người gửi và người được quyền duyệt** — nó có thể chứa dữ liệu Tầng 3 của
            một người còn sống. Với mọi vai khác đây là object **rỗng**, không phải `null`, và cũng
            không có cờ nào phân biệt "bị che" với "vốn rỗng".

            Khi có mặt, `_baseVersion` **luôn** nằm trong đây.
        payloadFields:
          type: array
          description: |-
            Tên các trường hồ sơ mà đề nghị động tới, đã sắp xếp. FE dựng bảng so sánh
            "đang ghi / đề nghị" từ danh sách này.

            **Khoá điều khiển bị loại** — `_baseVersion` không lọt vào đây, vì một mốc phiên bản
            hiện lên trong bảng so sánh sẽ trông như một trường hồ sơ không ai hiểu là gì.
          items:
            type: string
        reason:
          type: [string, 'null']
        requestedBy:
          type: [string, 'null']
          format: uuid
          description: '`app_user.id` của người gửi. / Submitter app_user id.'
        reviewerId:
          type: [string, 'null']
          format: uuid
          description: '`null` khi còn `PENDING`. / Null while pending.'
        reviewNote:
          type: [string, 'null']
        reviewedAt:
          type: [string, 'null']
          format: date-time
        createdAt:
          type: string
          format: date-time
        version:
          type: integer
          format: int64
          description: Phiên bản của **chính yêu cầu**, không phải của nhân khẩu đích.

    # -------------------------------------------------------------------------
    # NHẬP LIỆU HÀNG LOẠT / BULK IMPORT
    # -------------------------------------------------------------------------
    ImportBranch:
      type: object
      title: Chi/ngành trong màn nhập liệu
      required: [id, name, path, kind, canImport]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          examples: [Chi Ất]
        path:
          type: string
          description: |-
            `ltree` — **căn cứ phạm vi duy nhất**. Giao diện không được suy phạm vi từ `id` hay từ tên.
          examples: [goc.chi_at]
        kind:
          type: string
          enum: [DONG_HO, CHI, NGANH, CANH, NHANH]
          description: Bậc trong cây dòng tộc. Giữ nguyên thuật ngữ tiếng Việt.
        canImport:
          type: boolean
          description: |-
            Người **đang gọi** có quyền nhập liệu vào chi này không. Cờ này để giao diện khoá nút
            *trước* khi người dùng chọn tệp; phép kiểm thật vẫn ở `POST /import/batches`.
        openBatchId:
          type: string
          format: uuid
          description: |-
            Lô **đang dở** của chi này, nếu có. Đây là thứ làm cho màn đầu tiên nói đúng: một Trưởng
            chi quay lại sau hai hôm cần thấy ngay "bạn còn một lô đang đối soát", chứ không phải
            một nút "Tải tệp lên" sạch trơn dẫn họ đi nộp lô thứ hai cho cùng một chi.

            Vắng mặt khi chi không có lô nào đang dở — **hoặc** khi `canImport` là `false`. Việc dở
            dang của chi khác không phải chuyện của màn này, và một mã lô là một liều trỏ thẳng vào
            khu vực chờ của họ.

    ImportDuplicatePolicy:
      type: object
      title: Ngưỡng nghi trùng
      required: [suspectThreshold, preselectMergeThreshold, autoMerge]
      properties:
        suspectThreshold:
          type: integer
          description: Điểm tối thiểu để sinh cảnh báo `IMP_SUSPECT_DUPLICATE`.
          examples: [70]
        preselectMergeThreshold:
          type: integer
          description: Điểm từ đó giao diện tick sẵn "hợp nhất". Vẫn phải người xác nhận.
          examples: [85]
        autoMerge:
          type: boolean
          description: '**Luôn `false`.** Không ngưỡng nào tự gộp người, ở bất kỳ điểm số nào.'

    ImportStage:
      type: string
      description: |-
        Vị trí của một chi trong quy trình nhập liệu.

        **Chưa có `TEMPLATE_DOWNLOADED`**, dù kế hoạch có nhắc tới nó: hệ thống chưa ghi lại lượt
        tải mẫu, và bịa ra một bậc không đo được thì cả thang bậc mất giá trị. Thêm nó vào là việc
        của lúc có bảng ghi lượt tải, không phải của một câu `CASE`.

        `COMMITTED` là bậc cao nhất và **không** bị một lô nháp mới kéo tụt xuống: chi ấy *đã* có
        dữ liệu trong phả, và đó là sự thật bền hơn trạng thái của lô đang mở.
      enum: [NOT_STARTED, UPLOADED, RECONCILING, COMMITTED]

    ImportBranchProgress:
      type: object
      title: Tiến độ nhập liệu của một chi
      description: |-
        Một dòng của màn tiến độ. **Không phải một dòng bảng xếp hạng** — xem mô tả của
        `GET /import/progress`.

        Năm trường `coordinatorName`, `openBatch`, `blockingCount`, `warningCount`,
        `undecidedDuplicateCount` **vắng mặt** với chi ngoài phạm vi người gọi. Client phải xử lý
        "vắng" chứ không được đọc chúng như `null` hay `0`.
      required: [branchId, branchName, branchPath, stage, personsInTree, missingGioCount]
      properties:
        branchId:
          type: string
          format: uuid
        branchName:
          type: string
          examples: [Chi Ất]
        branchPath:
          type: string
          description: '`ltree` — căn cứ phạm vi duy nhất.'
          examples: [goc.chi_at]
        coordinatorName:
          type: string
          description: |-
            Người đang giữ vai Trưởng chi trên chi này. **Là tên một người còn sống**, nên nó vắng
            mặt với chi ngoài phạm vi người gọi.

            Cũng vắng mặt khi chi *trong* phạm vi mà chưa có ai nhận phụ trách. Giao diện đọc "vắng"
            thành "chưa có ai nhận" là đúng cho cả hai trường hợp, nên sự nhập nhằng này không sinh
            ra hành vi sai.
        stage:
          $ref: '#/components/schemas/ImportStage'
        personsInTree:
          type: integer
          format: int64
          description: Số nhân khẩu chưa xoá mềm đang treo vào chi. Một phép đếm, không phải một danh sách.
        expectedPersons:
          type: integer
          description: |-
            Số người Hội đồng Tộc biểu đếm được trên bản phả **giấy** — mẫu số của câu "còn thiếu
            bao nhiêu". Đếm tay, **không** suy ra được từ dữ liệu đã nhập, nên nó không bao giờ tự
            tính lại.

            **Vắng mặt nghĩa là chưa ai đếm**, khác hẳn 0. Coi nó là 0 thì màn này báo mọi chi đã
            xong 100% ngay khi chưa ai nhập gì.
        openBatch:
          type: object
          description: |-
            Lô người nhập sẽ quay lại làm tiếp. Vắng mặt khi chi không có lô nào đang mở — **hoặc**
            khi chi nằm ngoài phạm vi người gọi.
          required: [id, status, uploadedAt]
          properties:
            id:
              type: string
              format: uuid
            status:
              $ref: '#/components/schemas/ImportBatchStatus'
            uploadedAt:
              type: string
              format: date-time
        blockingCount:
          type: integer
          description: Lỗi chặn của lô đang mở. Vắng mặt với chi ngoài phạm vi; `0` khi chi không có lô nào đang mở.
        warningCount:
          type: integer
          description: Điều nên xem lại của lô đang mở. Giao diện không bao giờ cộng nó với `blockingCount`.
        undecidedDuplicateCount:
          type: integer
          description: Cặp nghi trùng chưa ai quyết trong lô đang mở.
        missingGioCount:
          type: integer
          description: |-
            Số người đã mất mà trống ngày giỗ (`IMP_MISSING_GIO`) trong lô đang mở — con số đáng giá
            nhất của cả màn, vì giỗ là thứ dòng họ thật sự mở phả ra để tra.

            **Không** bị cắt với chi ngoài phạm vi: nó là một phép đếm về người **đã khuất**, không
            phải một lời phán về ai đang làm chậm.

    ImportSourceKind:
      type: string
      description: |-
        Nguồn của lô. Đợt này chỉ dùng `EXCEL`; `GEDCOM` có mặt từ ngày đầu một cách có chủ ý, để bộ
        nhập GEDCOM sau này chỉ phải viết một bộ phân tích chứ không phải viết lại cả đường ống.
      enum: [EXCEL, GEDCOM]

    ImportBatchStatus:
      type: string
      description: |-
        Máy trạng thái của một lô.

        ```
        DRAFT → PARSED → VALIDATING → VALIDATED → COMMITTING → COMMITTED
                             ↓
                          FAILED        (còn lỗi chặn; sửa tệp rồi tải lại = lô MỚI)
        bất kỳ ↓
        SUPERSEDED                      (cùng chi đã có lô mới hơn)
        ```

        **`VALIDATED` chính là "chờ duyệt"** — theo định nghĩa nó là lô có 0 lỗi chặn, và đó chính
        xác là điều kiện bấm duyệt. Không có trạng thái `AWAITING_APPROVAL` riêng, vì nó sẽ tạo ra
        hai nguồn chân lý cho cùng một câu hỏi rồi sớm muộn chúng lệch nhau.

        **Không có `ROLLED_BACK`, và đó là quyết định có chủ ý.** Một lô đã gỡ vẫn mang
        `COMMITTED` vì nó *đã từng* được ghi — đó là sự thật lịch sử, và `committedAt` là mốc mà mọi
        phép kiểm "ai đã động vào sau khi ghi" dựa vào. Đổi trạng thái về `VALIDATED` sau khi gỡ sẽ
        xoá mất sự thật ấy và làm lô trông như chưa từng vào phả, trong khi nhật ký kiểm toán vẫn đầy
        dấu vết của nó.

        Việc đã gỡ vì vậy là một **cột riêng** (`import_batch.rolled_back_at`), không phải một trạng
        thái — và nó đi ra hợp đồng thành `ImportBatch.rolledBackAt`. Một lô mang đồng thời
        `status: COMMITTED` và `rolledBackAt` khác null là chuyện bình thường, không phải mâu thuẫn.
      enum:
        - DRAFT
        - PARSED
        - VALIDATING
        - VALIDATED
        - FAILED
        - COMMITTING
        - COMMITTED
        - SUPERSEDED

    ImportBatch:
      type: object
      title: Lô nhập liệu
      description: |-
        Một lần Trưởng chi tải tệp lên, cộng **mọi con số đã đếm sẵn**.

        Backend đếm, client chỉ hiển thị. Đếm ở hai nơi thì hai nơi sẽ lệch ngay khi danh sách lỗi
        được phân trang.
      required:
        - id
        - branchId
        - sourceKind
        - status
        - fileName
        - fileSha256
        - fileSizeBytes
        - uploadedAt
        - personRowCount
        - marriageRowCount
        - blockingCount
        - warningCount
        - plannedCreateCount
        - plannedUpdateCount
        - suspectDuplicateCount
        - undecidedDuplicateCount
        - canApprove
        - version
      properties:
        id:
          type: string
          format: uuid
        branchId:
          type: string
          format: uuid
        branchName:
          type: string
        branchPath:
          type: string
          description: '`ltree` của chi — căn cứ phạm vi.'
          examples: [goc.chi_at]
        sourceKind:
          $ref: '#/components/schemas/ImportSourceKind'
        status:
          $ref: '#/components/schemas/ImportBatchStatus'
        fileName:
          type: string
        fileSha256:
          type: string
          description: |-
            **Chỉ làm đúng một việc: chặn bấm hai lần.** Tính đúng đắn *không* đến từ mã băm — sửa
            một ô là đổi mã băm, mà sửa một ô rồi tải lại chính là bước đối soát bình thường. Cơ chế
            chống sinh người trùng là `person_external_ref`, không phải cột này.
        fileSizeBytes:
          type: integer
          format: int64
        uploadedBy:
          type: string
          format: uuid
          description: '`app_user` đã tải lên. Vắng mặt với lô do tiến trình nền tạo.'
        uploadedAt:
          type: string
          format: date-time
        validatedAt:
          type: string
          format: date-time
        committedAt:
          type: string
          format: date-time
        warningsAcknowledgedAt:
          type: string
          format: date-time
          description: |-
            Lúc người nhập tick "tôi đã xem hết phần cần xem lại". Vắng mặt khi chưa ai tick.

            **Không phải câu trả lời cho "đã xác nhận chưa".** Khi lô được kiểm lại và sinh cảnh báo
            *mới*, xác nhận cũ hết hiệu lực nhưng dấu thời gian này **vẫn còn** — nó là sự thật lịch
            sử (đã có người bấm), còn hiệu lực là chuyện khác. Câu trả lời duy nhất là `canApprove`.
        warningsAcknowledgedBy:
          type: string
          format: uuid
          description: |-
            `app_user` đã tick. Cái tick ấy mở khoá nút ghi vài trăm người vào phả nên nó **phải có
            chủ**: một dấu thời gian vô danh không trả lời được câu duy nhất người ta sẽ hỏi về sau.
        committedBy:
          type: string
          format: uuid
          description: '`app_user` đã bấm ghi vào phả.'
        rolledBackAt:
          type: string
          format: date-time
          description: |-
            Lúc lô được gỡ khỏi phả. **Không phải một trạng thái** — lô vẫn mang `COMMITTED` vì nó
            *đã từng* vào phả, và `committedAt` là mốc mà mọi phép kiểm "ai đã động vào sau khi ghi"
            dựa vào. Xem ghi chú dài ở `ImportBatchStatus`.
        failureReason:
          type: string
          description: Lý do khi `status = FAILED`.
        personRowCount:
          type: integer
        marriageRowCount:
          type: integer
        blockingCount:
          type: integer
          description: Số lỗi **chặn**. Giao diện không bao giờ cộng nó với `warningCount`.
        warningCount:
          type: integer
        plannedCreateCount:
          type: integer
          description: Số dòng sẽ **tạo người mới**, suy từ `person_external_ref`.
        plannedUpdateCount:
          type: integer
          description: Số dòng sẽ **cập nhật người đã có** — bằng chứng tải lại không sinh người trùng.
        suspectDuplicateCount:
          type: integer
          description: |-
            Số **cặp** nghi trùng, không phải số dòng cảnh báo: một dòng có thể bị nghi trùng với
            nhiều hồ sơ, và người đối chiếu phải quyết từng cặp một.
        undecidedDuplicateCount:
          type: integer
          description: |-
            Trong đó bao nhiêu cặp người nhập **chưa quyết**. Đầu vào của cổng duyệt.

            "Chưa quyết" gồm cả `PENDING` lẫn `DEFERRED`: nếu "hoãn" không nằm trong con số này thì
            nó thành nút "cho tôi qua". Giảm dần khi người đối chiếu gửi
            `POST /import/batches/{batchId}/duplicates/{pairId}/decision`.
        canApprove:
          type: boolean
          description: |-
            Nút duyệt có mở không. Đọc thẳng từ cùng một bất biến mà cổng duyệt phía máy chủ áp
            dụng, nên không có cách nào để nút hiện ra trong lúc máy chủ sẽ từ chối, và ngược lại.

            Nó đã tính cả `warningsAcknowledgedAt` **lẫn** việc xác nhận ấy còn hiệu lực hay không.
            Client **không** được tự suy điều kiện duyệt từ các trường lẻ.
        version:
          type: integer
          format: int64
          description: |-
            Bộ đếm sửa đổi của dòng. Tăng ở **mọi** lần ghi, kể cả những lần không đổi trạng thái
            (đếm lại sau khi kiểm, xác nhận cảnh báo). Giao diện dùng nó để phát hiện một tab khác
            đã động vào lô giữa chừng.

    ImportIssueSeverity:
      type: string
      description: |-
        Hai nhóm **tách bạch hoàn toàn**, khác nhau ở đúng một điểm: `BLOCKING` không cho bấm duyệt;
        `WARNING` cho, sau khi người nhập tick "đã xem". Không có nhóm thứ ba, và giao diện không
        bao giờ hiện tổng gộp.
      enum: [BLOCKING, WARNING]

    ImportSheet:
      type: string
      description: |-
        Trang trong mẫu Excel mà một vấn đề trỏ tới. Giữ **nguyên tên trang thật** trong tệp, không
        dịch: người nhập sửa trên chính tệp của họ, nên nhãn phải khớp cái tab họ đang nhìn.
        `LO` nghĩa là vấn đề của cả lô, không gắn với dòng nào.
      enum: [NHAN_KHAU, HON_PHOI, LO]

    ImportPlannedAction:
      type: string
      description: |-
        Hành động dự kiến của một dòng khi lô được ghi. Suy từ `person_external_ref`: tra
        `(EXCEL_MA, branch, Mã)` — có thì `UPDATE`, không thì `CREATE`.
      enum: [CREATE, UPDATE, SKIP]

    ImportIssueCode:
      type: string
      description: |-
        **Danh sách đóng** — giao diện phân nhánh theo mã, không theo câu chữ. Mức nghiêm trọng gắn
        cứng vào mã: một mã luôn nằm cùng một nhóm ở mọi chỗ, nếu không thì cùng một vấn đề lúc
        chặn lúc không và người nhập mất lòng tin vào bộ kiểm.

        Lỗi chặn là **mâu thuẫn nội tại** của dữ liệu: chắc chắn sai, và chỉ ra được sai ở đâu.
        Cảnh báo là **nghi ngờ**: máy không đủ căn cứ, chỉ người mở sổ ra mới trả lời được.
      enum:
        - IMP_PARENT_NOT_FOUND
        - IMP_CYCLE
        - IMP_SELF_PARENT
        - IMP_CHILD_BEFORE_PARENT
        - IMP_LUNAR_DATE_NOT_EXIST
        - IMP_LUNAR_DATE_UNPARSEABLE
        - IMP_LUNAR_DATE_IS_SERIAL
        - IMP_DUP_CODE
        - IMP_MISSING_CODE
        - IMP_MISSING_NAME
        - IMP_BAD_CODE_FORMAT
        - IMP_ALIVE_WITH_DEATH
        - IMP_GENERATION_MISMATCH
        - IMP_SPOUSE_ORDER_CONFLICT
        - IMP_MASS_CREATE_GUARD
        - IMP_SUSPECT_DUPLICATE
        - IMP_TABOO_COLLISION
        - IMP_MISSING_GIO
        - IMP_GIO_DAY_30
        - IMP_LONE_NODE
        - IMP_UNKNOWN_GENDER
        - IMP_MISSING_MOTHER
        - IMP_ROW_DISAPPEARED
        - IMP_UNKNOWN_PLACE_CODE
        - IMP_MISSING_PLACE_CODE
        - IMP_HEIR_TARGET_NOT_FOUND
        - IMP_MERGE_NOT_APPLICABLE
      x-issue-notes:
        IMP_SELF_PARENT: Một dòng khai chính nó là cha/mẹ của chính nó.
        IMP_LUNAR_DATE_UNPARSEABLE: Ô Ngày mất âm không đọc được thành ngày âm (ngày 31, tháng 13…).
        IMP_LUNAR_DATE_IS_SERIAL: |-
          Ô Ngày mất âm đến tay server dưới dạng **số sê-ri Excel**: để định dạng mặc định thì Excel
          nuốt `15/8` thành một ngày *dương lịch* và gửi đi một con số. Đoán ngược lại là đoán ngày
          giỗ — tuyệt đối không. Bảo người nhập định dạng cột thành Văn bản rồi gõ lại.
        IMP_MISSING_CODE: Dòng có dữ liệu nhưng bỏ trống cột Mã.
        IMP_MISSING_NAME: Dòng có Mã nhưng bỏ trống Họ tên.
        IMP_BAD_CODE_FORMAT: |-
          Mã sai dạng, **hoặc** mã đã đăng ký cho một chi khác — vừa là lỗi dữ liệu vừa là ranh giới
          phân quyền.
        IMP_MISSING_GIO: |-
          Người đã mất mà trống Ngày mất âm — cảnh báo **đáng giá nhất** trong bảng: người đó sẽ nằm
          trong phả đồ nhưng không bao giờ được nhắc giỗ, mà nhắc giỗ là lý do dòng họ mở ứng dụng.
        IMP_GIO_DAY_30: Ngày giỗ là 30 mà không rõ năm; tháng thiếu không có ngày 30, giỗ sẽ trôi về 29.
        IMP_MERGE_NOT_APPLICABLE: |-
          **Lỗi chặn, sinh lúc kiểm lại sau khi có quyết định gộp** — không phải lỗi của tệp, mà là
          hệ quả của một chuỗi quyết định.

          Các quyết định `MERGED` được gom theo **nhóm liên thông**: A≡B cộng B≡C thì A, B, C là
          một người. Khi một nhóm như vậy lại dính tới **hai `person` KHÁC NHAU đã có trong phả**,
          nó ngầm yêu cầu hợp nhất hai hồ sơ đã tồn tại — và đó **không phải việc của màn nhập
          liệu**: hợp nhất hai người đã có con cháu treo vào là thao tác cần lịch sử chỉnh sửa và
          thẩm quyền của màn quản lý nhân khẩu, nơi có đường hoàn tác riêng. Gộp nhầm ở đây thì hai
          nhánh con cháu cùng treo vào một node sai.

          Đường ra cho người nhập: đổi một trong các quyết định `MERGED` trong nhóm thành
          `DISTINCT`, rồi kiểm lại.

        IMP_ROW_DISAPPEARED: 'Người có ở lần nhập trước, mất khỏi tệp lần này. **Không xoá gì cả.**'
        IMP_UNKNOWN_PLACE_CODE: Mã tỉnh/quốc gia không có trong danh mục `place_division`.
        IMP_MISSING_PLACE_CODE: Có nguyên quán bằng chữ nhưng không có mã tỉnh — dòng này không vào được báo cáo dân số.
        IMP_HEIR_TARGET_NOT_FOUND: |-
          Mã người được kế tự không tìm thấy. Là **cảnh báo** chứ không phải lỗi chặn: kế tự là quan
          hệ thêm, không phải cạnh giữ cây.

    ImportIssue:
      type: object
      title: Một lỗi hoặc cảnh báo
      required: [id, severity, code, sheet, message]
      properties:
        id:
          type: string
          format: uuid
          description: |-
            Khoá dòng trong `import_issue`. Giao diện dùng nó làm khoá danh sách.

            **Đừng dựng khoá từ `(sheet, rowNo, code, field)`**: bộ ghép ấy *không duy nhất* — hai
            luật khác nhau vẫn có thể cùng trỏ vào một ô — nên bảng lỗi sẽ nhảy chỗ mỗi lần kiểm
            lại, đúng vào lúc người nhập đang dò theo nó để sửa tệp.
        severity:
          $ref: '#/components/schemas/ImportIssueSeverity'
        code:
          $ref: '#/components/schemas/ImportIssueCode'
        sheet:
          $ref: '#/components/schemas/ImportSheet'
        rowNo:
          type: integer
          description: |-
            Số dòng **đúng như Excel đánh** — đơn vị duy nhất người nhập dùng được. Vắng mặt khi
            `sheet = LO`.
        field:
          type: string
          description: Tên cột tiếng Việt, để giao diện tô đúng ô. Vắng mặt khi lỗi thuộc về cả dòng.
          examples: ['Mã cha']
        externalCode:
          type: string
          description: Cột `Mã` của dòng, để tra ngược vào sổ giấy mà không phải mở tệp ra đếm dòng.
          examples: [AT-05-012]
        message:
          type: string
          description: |-
            Một câu tiếng Việt hoàn chỉnh, **không phải mã lỗi** — người đọc là Trưởng chi, không
            phải lập trình viên. Đợt này chỉ có tiếng Việt: câu chữ được soạn *lúc kiểm* và lưu vào
            `import_issue.message`, nên nó không đổi theo `Accept-Language` của lần đọc.
        context:
          type: object
          additionalProperties: true
          description: |-
            Cùng nội dung ấy ở dạng **máy đọc được**. Khoá giữ **nguyên tên tiếng Việt của cơ sở dữ
            liệu**: `import_issue.context` là JSONB do từng luật tự soạn, và dịch khoá ở tầng API
            nghĩa là tầng API phải biết trước payload của cả mười ba luật — mỗi luật mới là một chỗ
            phải nhớ sửa hai nơi, và bản xuất Excel sẽ thấy một bộ tên khác hẳn giao diện.

            Các khoá đáng dựng giao diện quanh chúng:

            | Khoá | Kiểu | Với mã nào | Nội dung |
            |---|---|---|---|
            | `goiY` | `string[]` | `IMP_PARENT_NOT_FOUND`, `IMP_HEIR_TARGET_NOT_FOUND` | Mã gần giống, đã xếp theo độ gần. **Do máy chủ tính** — client chỉ thấy phần dữ liệu đã tải về nên sẽ gợi ý sai đúng lúc người ta tin nhất. |
            | `chuoi` | `string[]` | `IMP_CYCLE` | Đường đi thật của vòng lặp, **đã đóng kín**: `["AT-05-012","AT-04-003","AT-05-012"]`. |
            | `cacDong` | `int[]` | `IMP_DUP_CODE`, `IMP_SPOUSE_ORDER_CONFLICT` | Các số dòng cùng dính. Là **mảng**, không phải một số. |
            | `doiKhai` / `doiSuyRa` | `int` | `IMP_GENERATION_MISMATCH` | Đời người nhập gõ / đời hệ thống suy ra. |
            | `maKhongTimThay` | `string` | `IMP_PARENT_NOT_FOUND` | Mã không phân giải được. |
            | `nghiNgo` | `object[]` | `IMP_SUSPECT_DUPLICATE` | Xem ghi chú riêng tư bên dưới. |
            | `tenHuy`, `bacTrenId` | `string` | `IMP_TABOO_COLLISION` | Tên huý va chạm, và **khoá** của bậc trên. |

            **Riêng tư:** với `IMP_SUSPECT_DUPLICATE`, phần tử `nghiNgo[]` mang
            `nguon = "TREE"` chỉ còn `{ personId, diem, nguon }` — mọi trường dữ liệu của người đã
            có trong phả đã bị cắt. Phần tử mang `nguon = "FILE"` (một dòng khác trong chính tệp
            vừa nộp) giữ đủ, vì đó là thứ chính người nhập vừa gõ. Với `IMP_TABOO_COLLISION`, tên và
            đời của bậc trên đã bị cắt, chỉ còn khoá.

    ImportRow:
      type: object
      title: Một dòng trong khu vực chờ
      description: |-
        Thứ người nhập đã gõ — kể cả khi nó mâu thuẫn, thiếu hoặc sai. Đó là toàn bộ lý do khu vực
        chờ tồn tại: ép nó vào một aggregate có bất biến thì hoặc phải nới bất biến (hỏng cho cả hệ
        thống), hoặc phải từ chối dòng ngay lúc đọc (mất khả năng báo cho người nhập biết cả tệp sai
        những gì).
      required: [rowNo, plannedAction]
      properties:
        rowNo:
          type: integer
        externalCode:
          type: string
          description: Cột `Mã`, đã nâng hoa và bỏ khoảng trắng — **khoá bất biến** của cả đường ống.
        fullName:
          type: string
        tabooName:
          type: string
          description: Tên huý — lớp tên duy nhất kích hoạt cảnh báo kỵ húy (FR-1.6).
        posthumousName:
          type: string
        hanNomName:
          type: string
        gender:
          type: string
          enum: [MALE, FEMALE, UNKNOWN]
        generation:
          type: integer
        fatherCode:
          type: string
        motherCode:
          type: string
        parentRel:
          type: string
          enum: [BIO, ADOPTED, STEP]
          description: Quan hệ với cha/mẹ — ruột, nuôi, kế.
        alive:
          type: boolean
          description: |-
            Ô "Còn sống". Để trống **không** có nghĩa là còn sống: với một cuốn gia phả, mặc định như
            vậy sinh ra phả đồ toàn người sống từ đời thứ ba. Trống thì suy từ sự có mặt của ngày giỗ,
            và nếu cũng không có thì trường này vắng mặt — chưa biết, và bộ kiểm nói ra thay vì tự quyết.
        birthYear:
          type: integer
        deathLunar:
          type: string
          description: Ngày giỗ như người nhập gõ, dạng đã soạn để đọc.
          examples: ['15/8', '15/8 nhuận/1945']
        nativePlace:
          type: string
        nativePlaceCode:
          type: string
          description: Mã tỉnh/quốc gia — đầu vào duy nhất gộp nhóm được cho báo cáo dân số.
        heirOfCode:
          type: string
        heirKind:
          type: string
          enum: [DICH_TON, THUA_TU, KE_TU]
        plannedAction:
          $ref: '#/components/schemas/ImportPlannedAction'
        resolvedPersonId:
          type: string
          format: uuid
          description: |-
            Nhân khẩu đã có mang mã này. **Chỉ là một khoá** — muốn biết người ấy là ai thì gọi
            `GET /persons/{id}`, nơi bộ lọc phân tầng riêng tư quyết định trường nào được trả.

    ImportDuplicateParty:
      type: object
      title: Một bên của cặp nghi trùng
      description: |-
        **Hai nguồn, và chúng khác nhau về mọi thứ.**

        `source = FILE` — một dòng trong chính tệp vừa nộp. Toàn bộ là thứ người nhập vừa gõ, nên
        trả đủ: không có gì để giấu với chính tác giả của nó.

        `source = TREE` — một nhân khẩu **đã có trong phả**. Chỉ trả `personId`, **không một trường
        nào khác**. Xem `ImportDuplicatePair`.
      required: [source]
      properties:
        source:
          type: string
          enum: [FILE, TREE]
        personId:
          type: string
          format: uuid
          description: Chỉ có với `TREE`.
        externalCode:
          type: string
          description: Chỉ có với `FILE`.
        rowNo:
          type: integer
        displayName:
          type: string
        tabooName:
          type: string
        generation:
          type: integer
        birthYear:
          type: integer
        deathLunar:
          type: string
        fatherCode:
          type: string
        nativePlace:
          type: string

    ImportDuplicateEvidence:
      type: object
      title: Một dấu hiệu trong bảng đối chiếu
      description: |-
        **`existingValue` vắng mặt có đúng một nghĩa: "nguồn bên kia không ghi mục này".** Nó
        *không bao giờ* dùng để nói "đã bị cắt theo phân tầng riêng tư" — dấu hiệu nào không được
        phép trưng ra thì bỏ hẳn khỏi mảng `evidence`.
      required: [field, match]
      properties:
        field:
          type: string
          enum: [FULL_NAME, TABOO_NAME, GENERATION, BIRTH_YEAR, DEATH_LUNAR, FATHER, ORIGIN_PLACE]
        match:
          type: string
          enum: [SAME, DIFFERENT, MISSING_IN_FILE, MISSING_IN_TREE]
          description: |-
            `MISSING_IN_FILE` = bên `existing` có, bên `incoming` trống. `MISSING_IN_TREE` = ngược
            lại. Với cặp `FILE`↔`FILE` hai nhãn ấy đọc theo nghĩa đen "thiếu ở bên kia" /
            "thiếu ở bên này".
        points:
          type: integer
          description: |-
            Số điểm dấu hiệu này đóng góp, **do bộ chấm điểm cộng**. Vắng mặt khi bộ dò chưa công bố
            bản tách điểm theo từng tín hiệu — và khi vắng thì giao diện **không** được tự cộng bù:
            thang điểm là dữ liệu hiệu chỉnh của bộ dò, một bản sao ở client chắc chắn sẽ trôi.
        existingValue:
          type: string
        incomingValue:
          type: string
          description: Giá trị trong tệp. Vắng mặt nghĩa là tệp bỏ trống — chỗ phải tô, không để trống lặng lẽ.

    ImportDuplicatePair:
      type: object
      title: Một cặp nghi trùng
      description: |-
        **Máy nghi ngờ, người quyết định.** Không có ngưỡng nào tự gộp.

        Khi `existing.source = "TREE"`, `evidence` **rỗng** và `existing` chỉ có `personId`. Đây là
        bất biến riêng tư, không phải thiếu sót của hiện thực — xem mô tả của
        `GET /import/batches/{batchId}/duplicates`.
      required: [id, rowNo, score, preselectMerge, status, incoming, existing, evidence]
      properties:
        id:
          type: string
          format: uuid
          description: |-
            Khoá chính của cặp (`import_duplicate_pair.id`), và là thứ gửi lên
            `POST /import/batches/{batchId}/duplicates/{pairId}/decision`.

            **Ổn định qua các lần kiểm lại:** bấm "kiểm lại" không đổi khoá của những cặp không đổi,
            nên quyết định cũ vẫn dính đúng cặp cũ. Giao diện được phép lưu nó.
        rowNo:
          type: integer
        score:
          type: integer
          description: Điểm 0–100. Ngưỡng do `GET /import/duplicate-policy` công bố.
        preselectMerge:
          type: boolean
          description: Giao diện nên tick sẵn "hợp nhất". Vẫn phải người bấm xác nhận.
        status:
          type: string
          enum: [PENDING, MERGED, DISTINCT, DEFERRED]
          description: |-
            Quyết định của **người** về cặp này.

            `DEFERRED` ("chưa chắc, để sau") là lựa chọn quan trọng nhất trong ba — ép chọn nhị phân
            khi chưa chắc thì người ta bấm đại, và cái bấm đại đó thành sự thật trong phả. Nhưng nó
            **vẫn nằm trong `undecidedDuplicateCount` và vẫn chặn nút duyệt**: nếu không thì nó là
            nút "cho tôi qua" và cả cơ chế dò trùng thành trang trí.
        decidedBy:
          type: string
          format: uuid
          description: |-
            `app_user` đã quyết. Vắng mặt khi `status = PENDING`. Gộp hai hồ sơ là thao tác có hệ quả
            **vĩnh viễn** lên phả, nên nó phải có chủ — một dấu thời gian vô danh là câu vô dụng đúng
            vào lúc cần nó nhất.
        decidedAt:
          type: string
          format: date-time
        note:
          type: string
          description: Ghi chú tuỳ chọn của người quyết, ví dụ "đối chiếu với sổ chi Giáp bản 1998".
        hint:
          type: string
          description: |-
            Câu giải thích **tự do**, chỉ để hiển thị; đừng phân tích chuỗi này.

            **Vắng mặt với cặp `TREE`** — và đó là một chốt chặn rò rỉ, không phải một thiếu sót:
            câu này có thể nhắc tới giá trị trường của bên kia ("trùng năm sinh 1975"), mà bên kia
            có thể là một người **còn sống ở một chi khác**.
        signals:
          type: string
          description: |-
            **Nhãn tín hiệu** do bộ chấm điểm sinh ra ("trùng ngày giỗ, cùng chi"): trả lời *vì sao
            nghi* mà không tiết lộ *người ấy là ai*. An toàn ở **cả hai** loại cặp, và là thứ duy
            nhất của vế trong phả được phép đi kèm khoá.

            **Cố ý khác tên với `hint`**: hai khoá mang hai mức dữ liệu khác nhau, nên một client lỡ
            đọc nhầm khoá sẽ nhận `null` chứ không nhận dữ liệu của mức kia. Đừng gộp chúng làm một
            trường.
        incoming:
          $ref: '#/components/schemas/ImportDuplicateParty'
        existing:
          $ref: '#/components/schemas/ImportDuplicateParty'
        evidence:
          type: array
          items:
            $ref: '#/components/schemas/ImportDuplicateEvidence'

    ImportDuplicateDecisionRequest:
      type: object
      title: Quyết định cho một cặp nghi trùng
      description: |-
        **Chỉ nhận khoá, không nhận dữ liệu nhân khẩu.** Không có `personId` ở đây: đích của phép gộp
        đã nằm sẵn trong chính cặp mà máy chủ dò ra, nên người gọi chỉ chọn được trong số những cặp
        ấy. Nhận `personId` từ client sẽ biến lối gọi này thành "gộp dòng X vào bất kỳ ai trong dòng
        họ" — một lối ghi vượt phạm vi chi mà không phép kiểm nào ở đây thấy được.
      required: [decision]
      properties:
        decision:
          type: string
          enum: [MERGED, DISTINCT, DEFERRED]
          description: |-
            `MERGED` đây là cùng một người · `DISTINCT` hai người khác nhau, cả hai cùng vào phả ·
            `DEFERRED` chưa chắc, để lại sau (**vẫn chặn** nút duyệt).

            `PENDING` **không** nhận được: rút lại một lời khai đã ghi không phải là xoá nó đi, và
            chưa ai cần nghiệp vụ ấy. Gửi `PENDING` là `400`.
        note:
          type: string
          description: |-
            Ghi chú tuỳ chọn ("đối chiếu với sổ chi Giáp bản 1998"). **Không bắt buộc** — bắt buộc thì
            người ta gõ một dấu chấm.

    ImportDuplicateDecisionResult:
      type: object
      title: Kết quả một lần ghi quyết định
      description: |-
        Cặp vừa quyết, **và** lô sau khi tính lại. Một quyết định thay đổi bốn thứ trên màn hình cùng
        lúc — trạng thái cặp, `undecidedDuplicateCount`, `plannedCreateCount` / `plannedUpdateCount`
        (gộp làm một dòng chuyển từ "tạo mới" sang "cập nhật", hoặc biến mất hẳn), và `canApprove`.
        Trả mỗi cặp thì giao diện phải gọi thêm một vòng để biết ba thứ còn lại, và trong lúc chưa gọi
        xong thì nút duyệt hiện sai.
      required: [pair, batch]
      properties:
        pair:
          $ref: '#/components/schemas/ImportDuplicatePair'
        batch:
          $ref: '#/components/schemas/ImportBatch'

    # -------------------------------------------------------------------------
    # DANH BẠ DÒNG HỌ / CLAN DIRECTORY
    # -------------------------------------------------------------------------

    DirectoryPage:
      type: object
      title: Trang danh bạ / Directory page
      description: |-
        Ba khối, và hai trong số đó là lý do danh bạ không phải một bộ lọc của `/persons/search`:
        `coverage` giải thích vì sao danh sách thưa, `facets` giữ cho bộ lọc không bao giờ là một ô
        nhập tự do dẫn tới không kết quả.
      required: [items, page, coverage, facets]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/DirectoryEntry'
        page:
          $ref: '#/components/schemas/PageMeta'
        coverage:
          $ref: '#/components/schemas/DirectoryCoverage'
        facets:
          $ref: '#/components/schemas/DirectoryFacets'

    DirectoryEntry:
      type: object
      title: Một người trong danh bạ / Directory entry
      description: |-
        Ba trường đầu là dữ liệu phả hệ Tầng 1 — **không có công tắc**, mọi thành viên đã đăng nhập
        đều thấy. Ba trường sau là thứ chủ thể điều khiển, và **vắng mặt khỏi JSON** khi chưa mở cho
        người gọi. Vắng mặt là câu trả lời cuối cùng: không có cờ nào phân biệt "bị giấu" với "chưa
        điền", và FE không được vẽ ô trống thay cho nó.
      required: [personId, displayName]
      properties:
        personId:
          type: string
          format: uuid
        displayName:
          type: string
          description: Tên hiển thị, có dấu. / Display name.
        generation:
          type: integer
          description: Đời thứ (Thủy tổ = 1). / Generation.
        primaryBranch:
          $ref: '#/components/schemas/BranchRef'
        occupation:
          type: string
          description: Chỉ có khi chủ thể mở nhóm `occupation` cho người gọi này.
        currentPlaceProvince:
          type: string
          description: Chỉ có khi chủ thể mở nhóm `residenceProvince` cho người gọi này.
        avatarUrl:
          type: string
          description: |-
            **Khoá đối tượng trong MinIO**, không phải URL đã ký — giữ đúng quy ước (và đúng tên
            trường) mà `PersonSummary` đang dùng cho cùng giá trị. Chỉ có khi chủ thể mở nhóm
            `birthDetailAndPhoto`.

    DirectoryCoverage:
      type: object
      title: Độ phủ danh bạ / Directory coverage
      description: |-
        Tử số / mẫu số của câu **"218 / 627 người còn sống đã điền"**.

        Danh bạ thưa là chuyện bình thường: mô hình đồng thuận mặc định **kín**, nên ngày đầu tiên
        danh bạ gần như rỗng. Không có hai con số này thì màn hình trông y hệt một màn hình hỏng.
      required: [sharedCount, livingCount]
      properties:
        sharedCount:
          type: integer
          format: int64
          description: |-
            Số người hiện ra trong danh bạ của người gọi, **bỏ qua mọi bộ lọc**. Riêng cho từng người
            gọi: mức `BRANCH` phân giải khác nhau tuỳ chi nhà của người xem.
        livingCount:
          type: integer
          format: int64
          description: |-
            Tổng số người còn sống chưa xoá mềm mà người gọi được biết là tồn tại. Không phải bí mật
            với thành viên: Tầng 1 vốn đã cho họ thấy tên và đời của mọi người còn sống, nên đây là
            con số họ đếm được bằng tay. **Không** đổi theo vai — `COUNCIL`/`ADMIN` đọc ra đúng con
            số mà một thành viên đọc ra.

    DirectoryFacetValue:
      type: object
      title: Một giá trị facet / Facet value
      required: [value, count]
      properties:
        value:
          type: string
        count:
          type: integer
          format: int64

    DirectoryBranchFacet:
      type: object
      title: Facet chi/ngành / Branch facet
      required: [id, name, path, count]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          description: Tên hiển thị, có dấu. / Display name.
        path:
          type: string
          description: |-
            `ltree`, dùng để xếp thứ tự và thụt đầu dòng theo cây — **không bao giờ hiển thị**.
          pattern: '^[A-Za-z0-9_]+(\.[A-Za-z0-9_]+)*$'
        count:
          type: integer
          format: int64

    DirectoryFacets:
      type: object
      title: Bộ lọc khả dụng / Directory facets
      description: |-
        Các tỉnh/nghề/chi **có thật** trong danh bạ của người gọi. Đếm trên tập **đã lọc riêng tư
        nhưng chưa áp bộ lọc người dùng**, nên: (a) chọn một tỉnh xong vẫn còn thấy các tỉnh khác để
        đổi ý; (b) một dòng `Hà Nội (37)` bên cạnh danh sách 4 người là **không thể xảy ra** — nó sẽ
        là chính khối facet nói ra 33 người bị ẩn.
      required: [provinces, occupations, branches]
      properties:
        provinces:
          type: array
          items:
            $ref: '#/components/schemas/DirectoryFacetValue'
        occupations:
          type: array
          items:
            $ref: '#/components/schemas/DirectoryFacetValue'
        branches:
          type: array
          items:
            $ref: '#/components/schemas/DirectoryBranchFacet'

    ImportCommitProgress:
      type: object
      title: Tiến độ ghi vào phả
      required: [batchId, status, phase, processedRows, totalRows, estimated]
      properties:
        batchId:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/ImportBatchStatus'
        phase:
          type: string
          enum: [QUEUED, PERSONS, PARENT_EDGES, SPOUSE_EDGES, CACHE, DONE, FAILED]
        processedRows:
          type: integer
        totalRows:
          type: integer
        estimated:
          type: boolean
          description: |-
            **Luôn `true`, và giao diện phải hiện điều đó thành chữ.** Con số đếm ngoài giao dịch ghi
            nên nó là ước lượng *theo bản chất*, không phải vì hiện thực còn dở.
        failureMessage:
          type: string
          description: |-
            Câu lỗi khi `phase = FAILED`. Lô đã cuộn lại **toàn bộ** — tất-cả-hoặc-không; không có
            trạng thái "ghi được một nửa".


    # -------------------------------------------------------------------------
    # LỜI MỜI / INVITATIONS
    # -------------------------------------------------------------------------
    IssueInvitationRequest:
      type: object
      title: Phát lời mời
      description: |-
        Chỉ **một** trường bắt buộc, và đó là chủ ý: Trưởng chi đã chọn đích danh người mình mời
        trong phả, hệ thống không nên bắt họ nói lại điều đó bằng tên, chi và số điện thoại.

        **Không có trường vai trò.** Nhận lời mời cho ra một tài khoản Thành viên đã gắn nhân khẩu;
        cấp vai `BRANCH_HEAD`/`COUNCIL` vẫn đi qua `/branch-assignments`. Nếu lời mời chở theo vai
        trò thì một Trưởng chi phát được lời mời mang vai Hội đồng, và luật "chỉ `ADMIN` mới cấp
        được `ADMIN`" bị đi vòng qua một cửa sau.
      required: [personId]
      properties:
        personId:
          type: string
          format: uuid
          description: Nhân khẩu sẽ được ghép khi lời mời được nhận. / Person to link on accept.
        ttlDays:
          type: integer
          minimum: 1
          maximum: 30
          default: 7
          description: Số ngày hiệu lực; bỏ trống dùng mặc định 7 ngày. / Validity in days.
        note:
          type: string
          maxLength: 500
          description: Ghi chú của người mời, chỉ hiện trong danh sách quản trị. / Inviter note.

    AcceptInvitationRequest:
      type: object
      title: Nhận lời mời
      description: |-
        Thân yêu cầu của `POST /invitations/accept`. Mở rộng `RedeemInvitationRequest` bằng hai
        trường chỉ cần khi backend phải **tạo tài khoản Keycloak** cho người được mời.

        `email` bắt buộc khi người gọi **chưa có** tài khoản — Keycloak cần một định danh. Khi lời
        gọi mang token của một tài khoản đã có, hai trường này bị bỏ qua.
      required: [code]
      properties:
        code:
          type: string
          maxLength: 32
          examples: ['K7M2Q-D9HFX']
          description: Mã mời. Chuẩn hoá như `RedeemInvitationRequest`. / Invitation code.
        email:
          type: string
          format: email
          description: |-
            Định danh của tài khoản sắp tạo. **Bắt buộc khi chưa có tài khoản.**
        displayName:
          type: string
          maxLength: 200
          description: |-
            Tên hiển thị của tài khoản. Tuỳ chọn — vắng thì lấy tên nhân khẩu trong lời mời.

    SetPasswordRequest:
      type: object
      title: Đặt mật khẩu qua liên kết một lần
      description: |-
        `token` là chứng chỉ của lối gọi này, không phải một tham số tra cứu: nó được **ký** và
        mang sẵn hạn dùng, nên máy chủ không cần bảng nào để kiểm.
      required: [token, newPassword]
      properties:
        token:
          type: string
          description: |-
            Lấy nguyên văn từ `setPasswordUrl`. Client **không** được ghi nó vào tiêu đề trang,
            `Referer` hay nhật ký phân tích.
        newPassword:
          type: string
          format: password
          description: |-
            Mật khẩu do chính người dùng chọn. Máy chủ **không** lưu nó; nó đi thẳng tới Keycloak,
            nơi chính sách realm phán quyết và nơi nó được băm.

    RedeemInvitationRequest:
      type: object
      title: Mã mời
      description: |-
        Thân yêu cầu cho cả ba thao tác dùng mã: xem · nhận · từ chối.

        Mã đi trong **thân** yêu cầu chứ không trong đường dẫn vì nó là bí mật duy nhất của luồng —
        một mã nằm trong URL sẽ đi vào access log, lịch sử trình duyệt và header `Referer`.

        Chuẩn hoá phía máy chủ rất rộng tay: dấu gạch, khoảng trắng, dấu chấm và chữ thường đều
        chấp nhận được, và các ký tự dễ nhầm được dịch ngược (`O → 0`, `I`/`L → 1`). Người nhập mã
        là một cụ đọc từ tờ phiếu A6; mỗi lần gõ sai là một cú điện thoại cho Trưởng chi.
      required: [code]
      properties:
        code:
          type: string
          maxLength: 32
          examples: ['K7M2Q-D9HFX']
          description: Mã mời. / Invitation code.

    Invitation:
      type: object
      title: Lời mời (nhìn từ phía người mời)
      description: |-
        **Không có mã, và cũng không có băm của mã.** Băm là bí mật dẫn xuất: một bản băm lọt ra
        ngoài cho phép kiểm chứng offline xem một mã đoán được có đúng không, tức bẻ mất lớp giới
        hạn tần suất.
      required: [id, personId, invitedBy, status, usability, expiresAt]
      properties:
        id:
          type: string
          format: uuid
        personId:
          type: string
          format: uuid
        branchId:
          type: string
          format: uuid
          description: Chi tại thời điểm phát — ảnh chụp để tra soát. / Branch snapshot.
        invitedBy:
          type: string
          format: uuid
          description: Tài khoản đã phát lời mời. / Issuing account.
        status:
          type: string
          enum: [PENDING, ACCEPTED, REVOKED]
          description: |-
            Trạng thái **lưu trữ**. Cố ý không có `EXPIRED`: hết hạn là một phép so sánh với
            `expiresAt`, không phải một dòng dữ liệu cần một job đi lật cờ.
        usability:
          type: string
          enum: [USABLE, EXPIRED, ALREADY_USED, REVOKED]
          description: |-
            Trạng thái **đã xét đồng hồ**. FE hiển thị trường này, **không** phải `status`:
            `PENDING` của một mã đã quá hạn không nói lên điều gì.
        expiresAt:
          type: string
          format: date-time
        acceptedBy:
          type: string
          format: uuid
        acceptedAt:
          type: string
          format: date-time
        revokedAt:
          type: string
          format: date-time
        revokedReason:
          type: string
        note:
          type: string
        createdAt:
          type: string
          format: date-time

    IssuedInvitation:
      type: object
      title: Mã vừa phát
      description: |-
        **Lần duy nhất mã thô rời máy chủ.** `code` không đọc lại được ở bất kỳ endpoint nào — CSDL
        chỉ lưu băm. Màn hình phát mã phải cho Trưởng chi chép hoặc in ngay và nói rõ rằng đóng màn
        là mất mã; mất mã thì phát lại, và phát lại tự thu hồi mã cũ.
      required: [code, invitation]
      properties:
        code:
          type: string
          examples: ['K7M2Q-D9HFX']
          description: Mã thô, đã chia nhóm cho dễ đọc trên phiếu giấy. / Raw code, grouped.
        invitation:
          $ref: '#/components/schemas/Invitation'

    InvitationPreview:
      type: object
      title: Màn nhận lời mời
      description: |-
        **Bề mặt rò rỉ duy nhất** của cả luồng, và nó mở cho người chưa đăng nhập. Mỗi trường ở đây
        là một mẩu dữ liệu mà người nhặt được tờ phiếu cũng đọc được — đừng thêm trường thứ n+1 mà
        không nêu được lý do.

        **Trường không có dữ liệu bị loại khỏi JSON**, không trả `null` — đúng quy ước riêng tư của
        toàn API.

        ### Hai thứ cố ý KHÔNG có

        * **`personId` của người được mời.** Nó là khoá tra cứu ở mọi endpoint khác, tức một khoá
          nối bền vững trao cho người chưa xác thực, trong khi màn hình chẳng dùng tới nó.
          `POST /invitations/accept` mới trả `personId`, và lúc ấy người gọi đã có token.
        * **`relationToInviter`** ("Con dâu ông Nguyễn Văn Bốn"). Bản thiết kế muốn câu ấy và nó
          đẹp, nhưng Giai đoạn 1 không tính được ở đây: danh xưng thuộc context `kinship` (chưa mở
          mặt tiền), bộ tính danh xưng lại **che tên theo người gọi** — mà người gọi ở đây là khách
          không token, nên kết quả sẽ bị che — và nó là một truy vấn LCA bằng Cypher trên một
          endpoint không cần đăng nhập. Trường **vắng mặt**, không phải `null` rỗng nghĩa.
      required: [invitee, expiresAt]
      properties:
        clanName:
          type: string
          description: Tên cả dòng họ, lấy từ nhãn cấp 1 của `ltree`. / Clan name from ltree root.
          examples: ['Dòng họ Nguyễn — Đại Lan']
        inviter:
          $ref: '#/components/schemas/InvitationInviter'
        invitee:
          $ref: '#/components/schemas/InvitationInvitee'
        expiresAt:
          type: string
          format: date-time
          description: Dùng để nói "mã còn dùng được tới …", không để tự tính hết hạn.

    InvitationInviter:
      type: object
      title: Người phát lời mời
      description: |-
        Một **con người trong họ**, không phải hệ thống — đó là lý do tiêu đề màn đọc "Lời mời từ …"
        chứ không phải "Kích hoạt tài khoản". Một tin nhắn từ đầu số lạ kèm đường dẫn đúng là hình
        dạng của tin lừa đảo mà người lớn tuổi được dặn phải xoá; tên người mời là thứ phân biệt.
      properties:
        displayName:
          type: string
          description: |-
            Tên **trần, KHÔNG kính ngữ**. Kính ngữ ("ông", "bà") phụ thuộc quan hệ họ hàng giữa
            người mời và người đọc, tức thuộc bộ luật danh xưng — thứ endpoint này cố ý không gọi
            tới (xem `InvitationPreview`). FE cũng **không được** tự thêm: đoán sai một chữ "ông"
            cho một người phụ nữ là đúng loại lỗi mà quy tắc "quan hệ là việc của máy chủ" sinh ra
            để chặn. Sự tôn kính trên màn này do `clanTitle` gánh.
          examples: ['Nguyễn Văn Bốn']
        clanTitle:
          type: string
          description: |-
            Chức danh **dòng tộc**, suy từ `branch.head_person_id` — **không** phải vai kỹ thuật
            `BRANCH_HEAD` trong `branch_assignment`. Không ai trong họ tự giới thiệu mình bằng một
            mã vai trò. Vắng mặt với phần lớn thành viên, và đó là câu trả lời đúng.
          examples: ['Trưởng Chi Giáp']

    InvitationInvitee:
      type: object
      title: Người được mời
      description: |-
        Mức tối thiểu để một người **tự nhận ra mình**, và không đủ để dựng hồ sơ về họ.

        `displayName` là dữ liệu **Tầng 1 của một người đang sống** (BA v2 §10) — ngoại lệ có chủ ý,
        xem `POST /invitations/lookup`. Vì thế: không năm sinh, không nghề nghiệp, không nơi ở,
        không điện thoại, không ảnh.

        `branch` **không** mở thêm gì: `PublicPersonDto` của cổng công khai vốn đã chở nguyên một
        `BranchRef` cho Khách.
      required: [displayName]
      properties:
        displayName:
          type: string
          examples: ['Nguyễn Thị Lan']
        generation:
          type: integer
          description: Đời thứ; thuỷ tổ = 1. / Generation, founder = 1.
          examples: [7]
        branch:
          $ref: '#/components/schemas/BranchRef'

    AcceptedInvitation:
      type: object
      title: Tài khoản sau khi nhận lời mời
      description: |-
        `status` là `ACTIVE` và `personId` khác `null` **ngay trong phản hồi này** — bằng chứng đọc
        được từ phía client rằng **không có bước chờ duyệt nào**.

        ### `setPasswordUrl` — và vì sao nó có thể VẮNG MẶT

        Khi người được mời chưa có tài khoản Keycloak, backend tạo tài khoản ấy rồi trả về
        `setPasswordUrl` để chính họ đặt mật khẩu. Liên kết có hạn (`setPasswordExpiresAt`), dùng
        một lần, và dẫn tới `POST /invitations/set-password`.

        **Vắng `setPasswordUrl` là một phép chặn có chủ ý, không phải thiếu sót.** Backend **không
        phát liên kết cho tài khoản đã có mật khẩu** — nếu không, ai cầm một mã mời cộng với việc
        đoán đúng email của một thành viên cũ sẽ **đổi được mật khẩu của người ta**. Khi trường này
        vắng, client phải đưa người dùng tới màn đăng nhập, **không** hiện lỗi.

        **Tính một lần neo vào trạng thái thật** — "tài khoản này đã có credential password chưa" —
        chứ không vào một cờ trong cơ sở dữ liệu. Một cờ sót lại là một lối đổi mật khẩu của người
        khác.

        Ghi chú kỹ thuật: Keycloak 26 **không có endpoint nào trả ra action link**
        (`execute-actions-email` gửi thư và trả thân rỗng), nên liên kết do backend tự đúc, ký bằng
        khoá dẫn xuất từ bí mật client, và **không lưu ở bảng nào**. Khi có SMTP hoặc một SPI riêng,
        chỗ đổi là `KeycloakIdentityProviderAdapter` — không phải hợp đồng này.
      required: [appUserId, personId, status]
      properties:
        appUserId:
          type: string
          format: uuid
        personId:
          type: string
          format: uuid
          description: Nhân khẩu đã được nối; dùng cho màn hạ cánh. / Linked person.
        status:
          type: string
          enum: [ACTIVE]
          description: Luôn là `ACTIVE` khi nhận thành công. / Always ACTIVE on success.
        setPasswordUrl:
          type: string
          format: uri
          description: |-
            Liên kết một lần để chính người được mời đặt mật khẩu. **Tuỳ chọn** — vắng mặt nghĩa là
            tài khoản đã có mật khẩu, và client phải đưa họ tới màn đăng nhập chứ **không** hiện
            lỗi. Xem phần mô tả của schema này.
        setPasswordExpiresAt:
          type: string
          format: date-time
          description: |-
            Hạn của `setPasswordUrl`. Đi cùng nó: có trường này thì có trường kia. Hết hạn là ca
            **bình thường** — một cụ có thể để tin nhắn tới hôm sau mới mở — nên giao diện phải cho
            một đường xin lại, không phải một dải đỏ.

